<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5극 3특 체제 완벽 이해 — 대한민국 균형발전 대전환</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090b;
  --t:#f0f0f0;
  --mu:#a1a1aa;
  --c:#00d4ff;  /* Cyan: 수도권 / 메가시티 */
  --a:#f59e0b;  /* Amber: 중부권 / 에너지 / 기회 */
  --e:#10b981;  /* Emerald: 동남권 / 생태 / 성장 */
  --p:#a78bfa;  /* Purple: 호남권 / AI / 자치 */
  --r:#f43f5e;  /* Rose: 대경권 / 경고 / 혁신 */
  --b:#3b82f6;  /* Blue: 3특 강소권 / 해양 */
}
body{
  background:var(--bg);
  color:var(--t);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  overflow:hidden;
  width:1920px;
  height:1080px;
  transform-origin:0 0;
  word-break:keep-all;
  position:relative;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:88px 88px;
  pointer-events:none;
  z-index:0;
}

/* Typography */
.t-hero{font-size:96px;font-weight:800;letter-spacing:-.034em;line-height:1.12}
.t-xl{font-size:72px;font-weight:700;letter-spacing:-.026em;line-height:1.18}
.t-lg{font-size:52px;font-weight:700;letter-spacing:-.020em;line-height:1.24}
.t-md{font-size:36px;font-weight:600;line-height:1.32}
.t-sm{font-size:26px;font-weight:500;line-height:1.45}
.t-xs{font-size:20px;font-weight:400;color:var(--mu);line-height:1.55}

/* Glow Text */
.gc{color:#00d4ff;text-shadow:0 0 28px #00d4ff,0 0 56px rgba(0,212,255,.45)}
.ga{color:#f59e0b;text-shadow:0 0 28px #f59e0b,0 0 56px rgba(245,158,11,.45)}
.ge{color:#10b981;text-shadow:0 0 28px #10b981,0 0 56px rgba(16,185,129,.45)}
.gp{color:#a78bfa;text-shadow:0 0 28px #a78bfa,0 0 56px rgba(167,139,250,.45)}
.gr{color:#f43f5e;text-shadow:0 0 28px #f43f5e,0 0 56px rgba(244,63,94,.45)}
.gb{color:#3b82f6;text-shadow:0 0 28px #3b82f6,0 0 56px rgba(59,130,246,.45)}

/* Glass Cards */
.glass{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.11);
  border-radius:24px;
  box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
}
.glass-c{
  background:rgba(0,212,255,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(0,212,255,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(0,212,255,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-a{
  background:rgba(245,158,11,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(245,158,11,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(245,158,11,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-e{
  background:rgba(16,185,129,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(16,185,129,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(16,185,129,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-p{
  background:rgba(167,139,250,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(167,139,250,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(167,139,250,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-r{
  background:rgba(244,63,94,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(244,63,94,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(244,63,94,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-b{
  background:rgba(59,130,246,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(59,130,246,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(59,130,246,.12),0 8px 40px rgba(0,0,0,.5);
}

/* Animations */
[data-step]{
  opacity:0;
  transform:translateY(20px);
  transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1);
}
[data-step].revealed{opacity:1;transform:translateY(0)}
[data-step="2"].revealed{transition-delay:.06s}
[data-step="3"].revealed{transition-delay:.12s}
[data-step="4"].revealed{transition-delay:.18s}
[data-step="5"].revealed{transition-delay:.24s}

/* Layout Elements */
#blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
#slide{position:relative;z-index:1;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center}
#nav{position:fixed;bottom:24px;right:48px;z-index:100;display:flex;align-items:center;gap:12px;user-select:none}
#nav .nav-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  color:var(--t);
  width:44px;
  height:44px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:20px;
  transition:all .2s ease;
}
#nav .nav-btn:hover{
  background:rgba(0,212,255,.2);
  border-color:var(--c);
  color:var(--c);
  transform:scale(1.06);
}
#nav span{
  color:var(--mu);
  font-size:18px;
  font-weight:600;
  min-width:84px;
  text-align:center;
  cursor:pointer;
  padding:4px 8px;
  border-radius:8px;
  transition:all .2s ease;
}
#nav span:hover{
  background:rgba(255,255,255,.1);
  color:var(--c);
}
#progress{position:fixed;bottom:0;left:0;height:4px;background:linear-gradient(90deg,var(--c),var(--e),var(--a),var(--p));z-index:10;transition:width .3s ease}

/* Quick Jump Toast Indicator */
#jump-indicator{
  position:fixed;
  top:36px;
  right:48px;
  z-index:200;
  background:rgba(19,27,49,.92);
  backdrop-filter:blur(16px);
  border:1px solid var(--c);
  box-shadow:0 0 30px rgba(0,212,255,.35);
  border-radius:14px;
  padding:12px 24px;
  display:none;
  align-items:center;
  gap:12px;
  font-size:18px;
  font-weight:600;
  color:var(--t);
  animation:popIn .2s cubic-bezier(.16,1,.3,1);
}
#jump-indicator span{color:var(--c);font-weight:800;font-size:22px}
@keyframes popIn{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Jump Modal */
#jump-modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(12px);
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
}
#jump-modal{
  background:rgba(20,28,50,.95);
  border:1px solid rgba(0,212,255,.4);
  box-shadow:0 16px 60px rgba(0,0,0,.8),0 0 50px rgba(0,212,255,.2);
  border-radius:24px;
  padding:36px 44px;
  text-align:center;
  width:420px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 20px;
  border-radius:100px;
  font-size:14px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:24px;
}
.badge-c{background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.35);color:var(--c)}
.badge-p{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.35);color:var(--p)}
.badge-e{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);color:var(--e)}
.badge-a{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:var(--a)}
.badge-r{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);color:var(--r)}
.badge-b{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:var(--b)}

.tag{
  display:inline-block;
  padding:4px 12px;
  border-radius:8px;
  font-size:14px;
  font-weight:600;
  background:rgba(255,255,255,.1);
}
</style>
</head>
<body>

<div id="blobs">
  <div style="position:absolute;width:950px;height:950px;top:-280px;left:-200px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.07) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:850px;height:850px;bottom:-200px;right:40px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.06) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:700px;height:700px;top:250px;right:-180px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.05) 0%,transparent 70%)"></div>
</div>

<div id="slide"></div>

<!-- Quick Jump Toast -->
<div id="jump-indicator">
  <iconify-icon icon="solar:round-alt-arrow-right-bold" style="color:var(--c);font-size:24px"></iconify-icon>
  <span>Go to Page : </span>
  <span id="jump-number">1</span>
  <span style="font-size:14px;color:var(--mu);margin-left:8px">(Enter 또는 자동 이동)</span>
</div>

<!-- Quick Jump Modal -->
<div id="jump-modal-overlay">
  <div id="jump-modal">
    <div style="font-size:24px;font-weight:700;margin-bottom:8px;color:var(--c);display:flex;align-items:center;justify-content:center;gap:8px">
      <iconify-icon icon="solar:routing-2-bold"></iconify-icon> 페이지 바로 이동
    </div>
    <p style="font-size:15px;color:var(--mu);margin-bottom:24px">이동할 페이지 번호를 입력하세요 (1 ~ 18)</p>
    <div style="display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:24px">
      <input type="number" id="modal-page-input" min="1" max="18" placeholder="예: 7" style="width:140px;background:rgba(0,0,0,.5);border:2px solid var(--c);border-radius:14px;color:var(--t);font-size:28px;font-weight:800;text-align:center;padding:10px;outline:none">
      <span style="font-size:22px;color:var(--mu)">/ 18</span>
    </div>
    <div style="display:flex;justify-content:center;gap:14px">
      <button id="modal-jump-cancel" style="padding:10px 24px;border-radius:12px;background:rgba(255,255,255,.1);border:none;color:var(--t);font-size:16px;cursor:pointer;font-weight:600">취소 (ESC)</button>
      <button id="modal-jump-btn" style="padding:10px 28px;border-radius:12px;background:linear-gradient(135deg,var(--c),var(--e));border:none;color:#000;font-size:16px;cursor:pointer;font-weight:700">이동 (Enter)</button>
    </div>
  </div>
</div>

<div id="nav">
  <button class="nav-btn" id="btn-prev" title="이전 (← / Backspace)">
    <iconify-icon icon="solar:alt-arrow-left-bold"></iconify-icon>
  </button>
  <span id="counter" title="클릭하여 페이지 직접 입력 / 단축키: 숫자 입력 or G">1 / 18</span>
  <button class="nav-btn" id="btn-next" title="다음 (→ / Space / Click)">
    <iconify-icon icon="solar:alt-arrow-right-bold"></iconify-icon>
  </button>
</div>
<div id="progress"></div>

<script>
const slides = [

// ── 01. 타이틀 ──
{n:2, html:`

    <iconify-icon icon="solar:map-point-bold"></iconify-icon> NATIONAL BALANCED DEVELOPMENT
  </div>

// ── 04. 5극 3특 한눈에 보기 (전국 지도 구상) ──
{n:3, html:`

    <div class="badge badge-c"><iconify-icon icon="solar:globus-bold"></iconify-icon> SPATIAL STRUCTURE</div>

// ── 슬라이드 엔진 ──
let cur = 0, step = 0;

function applySteps() {
  document.querySelectorAll('[data-step]').forEach(el => {
    const n = parseInt(el.dataset.step);
    const on = n <= step;
    el.classList.toggle('revealed', on);
  });
}

function updateNav() {
  const total = slides.length;
  document.getElementById('counter').textContent = `${cur + 1} / ${total}`;
  document.getElementById('progress').style.width = ((cur) / (total - 1) * 100) + '%';
}

function render() {
  step = 0;
  const sl = slides[cur];
  document.getElementById('slide').innerHTML = sl.html;
  if (sl.after) setTimeout(sl.after, 50);
  applySteps();
  updateNav();
}

function go(d) {
  const max = slides[cur].n || 0;
  if (d === 1) {
    if (step < max) {
      step++;
      applySteps();
      updateNav();
    } else if (cur < slides.length - 1) {
      cur++;
      render();
    }
  } else {
    if (step > 0) {
      step--;
      applySteps();
      updateNav();
    } else if (cur > 0) {
      cur--;
      render();
      step = slides[cur].n || 0;
      applySteps();
      updateNav();
    }
  }
}

// ── 특정 페이지 직접 이동 함수 (1 ~ N) ──
function goToPage(targetPage) {
  let p = parseInt(targetPage);
  if (isNaN(p)) return;
  if (p < 1) p = 1;
  if (p > slides.length) p = slides.length;
  cur = p - 1;
  render();
}

// ── 숫자 키보드 입력 점프 버퍼 ──
let jumpBuffer = '';
let jumpTimer = null;
const jumpIndicator = document.getElementById('jump-indicator');
const jumpNumber = document.getElementById('jump-number');

function clearJumpBuffer() {
  jumpBuffer = '';
  if (jumpTimer) clearTimeout(jumpTimer);
  jumpTimer = null;
  if (jumpIndicator) jumpIndicator.style.display = 'none';
}

function handleDigitInput(digit) {
  jumpBuffer += digit;
  if (jumpIndicator && jumpNumber) {
    jumpNumber.textContent = jumpBuffer;
    jumpIndicator.style.display = 'flex';
  }
  if (jumpTimer) clearTimeout(jumpTimer);
  jumpTimer = setTimeout(() => {
    if (jumpBuffer.length > 0) {
      goToPage(jumpBuffer);
      clearJumpBuffer();
    }
  }, 1200);
}

// ── 점프 모달 관리 ──
const modalOverlay = document.getElementById('jump-modal-overlay');
const modalInput = document.getElementById('modal-page-input');
const modalJumpBtn = document.getElementById('modal-jump-btn');
const modalCancelBtn = document.getElementById('modal-jump-cancel');

function openJumpModal() {
  clearJumpBuffer();
  modalOverlay.style.display = 'flex';
  modalInput.value = cur + 1;
  setTimeout(() => {
    modalInput.focus();
    modalInput.select();
  }, 50);
}

function closeJumpModal() {
  modalOverlay.style.display = 'none';
  window.focus();
}

function executeModalJump() {
  const val = modalInput.value.trim();
  if (val) {
    goToPage(val);
  }
  closeJumpModal();
}

modalJumpBtn.addEventListener('click', executeModalJump);
modalCancelBtn.addEventListener('click', closeJumpModal);
modalOverlay.addEventListener('click', e => {
  if (e.target === modalOverlay) closeJumpModal();
});
modalInput.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') {
    executeModalJump();
  } else if (e.key === 'Escape') {
    closeJumpModal();
  }
});

// 하단 카운터 클릭 시 모달 열기
document.getElementById('counter').addEventListener('click', e => {
  e.stopPropagation();
  openJumpModal();
});

// ── 키보드 이벤트 ──
window.addEventListener('keydown', e => {
  if (modalOverlay && modalOverlay.style.display === 'flex') return;

  const k = e.key;

  // 1. 숫자 키 입력 시 퀵 점프 버퍼 처리 (0~9)
  if (/^[0-9]$/.test(k)) {
    e.preventDefault();
    handleDigitInput(k);
    return;
  }

  // 2. 점프 버퍼 활성화 중 Enter 누르면 즉시 점프
  if (jumpBuffer.length > 0) {
    if (k === 'Enter') {
      e.preventDefault();
      goToPage(jumpBuffer);
      clearJumpBuffer();
      return;
    } else if (k === 'Escape' || k === 'Backspace') {
      e.preventDefault();
      clearJumpBuffer();
      return;
    }
  }

  // 3. 'G' 또는 'g' 키 누르면 점프 모달 열기
  if (k === 'g' || k === 'G') {
    e.preventDefault();
    openJumpModal();
    return;
  }

  // 4. 일반 내비게이션 키
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter' || k === 'n' || k === 'N' || k === 'j' || k === 'J') {
    e.preventDefault();
    go(1);
  } else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace' || k === 'p' || k === 'P' || k === 'k' || k === 'K') {
    e.preventDefault();
    go(-1);
  } else if (k === 'ArrowDown') {
    e.preventDefault();
    if (cur < slides.length - 1) {
      cur++;
      render();
    }
  } else if (k === 'ArrowUp') {
    e.preventDefault();
    if (cur > 0) {
      cur--;
      render();
    }
  }
}, true);

// ── 마우스 클릭 & 버튼 이벤트 ──
document.getElementById('btn-next').addEventListener('click', e => {
  e.stopPropagation();
  go(1);
});

document.getElementById('btn-prev').addEventListener('click', e => {
  e.stopPropagation();
  go(-1);
});

// 슬라이드 화면 클릭 시 다음으로 진행
document.addEventListener('click', e => {
  if (modalOverlay && modalOverlay.style.display === 'flex') return;
  if (!e.target.closest('#nav') && !e.target.closest('button') && !e.target.closest('a') && !e.target.closest('#jump-modal')) {
    go(1);
  }
});

// 마우스 휠 스크롤 지원
let wheelTimeout;
window.addEventListener('wheel', e => {
  if (modalOverlay && modalOverlay.style.display === 'flex') return;
  if (wheelTimeout) return;
  if (e.deltaY > 30) {
    go(1);
    wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 250);
  } else if (e.deltaY < -30) {
    go(-1);
    wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 250);
  }
}, { passive: true });

// ── 화면 스케일링 & 포커스 ──
function scale() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  const tx = (window.innerWidth - 1920 * s) / 2;
  const ty = (window.innerHeight - 1080 * s) / 2;
  document.body.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
}

window.addEventListener('resize', scale);
window.addEventListener('load', () => {
  window.focus();
  document.body.focus();
});

// 초기화
scale();
render();
window.focus();
</script>
</body>
</html>
