<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentation Box</title>
  <meta name="description" content="AI, R&D 기획, 정책, 라이프 발표자료를 고르고 바로 발표하는 아카이브">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='16' rx='2' fill='%231b1f27'/%3E%3Crect x='14' y='23' width='4' height='4' fill='%231b1f27'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --wall: #e9ebee;
      --sheet: #ffffff;
      --ink: #1b1f27;
      --ink-2: #4a5160;
      --muted: #7a8190;
      --line: #dfe2e7;
      --select: #f1f3f6;
      --screen: #161a21;

      --cat-ai: #5b4fd6;
      --cat-plan: #d0702a;
      --cat-policy: #1f7fb8;
      --cat-life: #2e9a7e;

      --f: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
      --list-w: 520px;
      --bar-h: 52px;
      color-scheme: light;
    }

    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--f);
      background: var(--wall);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.5;
      font-feature-settings: "tnum";
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    /* ===== Hub layout ===== */
    #hub {
      display: grid;
      grid-template-columns: var(--list-w) 1fr;
      height: 100vh;
      height: 100dvh;
    }

    /* Left: index */
    .index {
      background: var(--sheet);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .index-head {
      padding: 22px 24px 0;
      border-bottom: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .brand h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .brand .count { color: var(--muted); font-size: 13px; }

    .search {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
      padding: 0 12px;
      background: var(--select);
      border-radius: 8px;
    }
    .search svg { width: 16px; height: 16px; flex: none; stroke: var(--muted); fill: none; stroke-width: 2; }
    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      outline: none;
      font-size: 15px;
    }
    .search input::placeholder { color: var(--muted); }
    .search input::-webkit-search-cancel-button { display: none; }
    .search kbd {
      font: inherit;
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--line);
      background: var(--sheet);
      border-radius: 4px;
      padding: 0 6px;
    }
    .search .clear { display: none; color: var(--muted); font-size: 13px; padding: 4px; }
    .search.has-q .clear { display: block; }
    .search.has-q kbd { display: none; }

    .filters {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
    }
    .tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      position: relative;
      padding: 10px 10px 12px;
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
    }
    .tab:hover { color: var(--ink); }
    .tab[aria-pressed="true"] { color: var(--ink); font-weight: 600; }
    .tab[aria-pressed="true"]::after {
      content: "";
      position: absolute;
      left: 10px; right: 10px; bottom: -1px;
      height: 2px;
      background: var(--ink);
    }
    .style-select {
      flex: none;
      border: 0;
      background: transparent;
      font-size: 13px;
      color: var(--ink-2);
      padding: 6px 2px;
      margin-bottom: 4px;
      cursor: pointer;
    }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0 32px;
      overscroll-behavior: contain;
    }
    .group-title {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 18px 24px 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
    }
    .group-title i { width: 8px; height: 8px; border-radius: 2px; }
    .group-title span { color: var(--muted); font-weight: 400; }

    .row {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 8px 24px;
      text-align: left;
      border-left: 3px solid transparent;
    }
    .row:hover { background: var(--select); }
    .row.is-selected { background: var(--select); border-left-color: var(--ink); }
    .row-thumb {
      width: 88px;
      aspect-ratio: 16 / 9;
      border-radius: 4px;
      background: #cfd4db center / cover no-repeat;
    }
    .row-title {
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--ink);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .row-len { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
    mark { background: #fde68a; color: inherit; border-radius: 2px; }

    .empty {
      display: none;
      padding: 48px 24px;
      color: var(--ink-2);
    }
    .empty.show { display: block; }
    .empty button {
      margin-top: 12px;
      padding: 8px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--sheet);
      font-size: 14px;
    }

    /* Right: projector */
    .stage {
      min-width: 0;
      overflow-y: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px clamp(24px, 5vw, 80px);
    }
    .stage-inner { width: 100%; max-width: 1040px; }

    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: var(--screen) center / cover no-repeat;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 24px 48px -24px rgba(27,31,39,.45);
      cursor: pointer;
    }
    .screen iframe {
      position: absolute;
      top: 0; left: 0;
      width: 1920px;
      height: 1080px;
      border: 0;
      transform-origin: 0 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s ease;
      background: var(--screen);
    }
    .screen iframe.ready { opacity: 1; }
    .screen-hint {
      position: absolute;
      left: 16px; bottom: 14px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(22,26,33,.72);
      color: #fff;
      font-size: 12.5px;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .screen:hover .screen-hint, .screen:focus-visible .screen-hint { opacity: 1; }

    .info { margin-top: 28px; max-width: 720px; }
    .tags { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--muted); }
    .tags .cat { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-weight: 600; }
    .tags .cat i { width: 8px; height: 8px; border-radius: 2px; }
    .info h2 {
      margin-top: 10px;
      font-size: clamp(22px, 2.1vw, 30px);
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: -0.015em;
      text-wrap: balance;
    }
    .info .hook { margin-top: 10px; font-size: 16px; color: var(--ink-2); }
    .info .desc {
      margin-top: 14px;
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--muted);
      max-width: 62ch;
    }
    .actions { display: flex; gap: 8px; margin-top: 24px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 42px;
      padding: 0 18px;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 600;
      text-decoration: none;
    }
    .btn svg { width: 14px; height: 14px; }
    .btn-primary { background: var(--ink); color: #fff; }
    .btn-primary:hover { background: #000; }
    .btn-ghost { color: var(--ink-2); border: 1px solid var(--line); background: var(--sheet); }
    .btn-ghost:hover { color: var(--ink); border-color: #c4c9d1; }

    /* ===== Viewer ===== */
    #viewer {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      background: #000;
      visibility: hidden;
    }
    body.viewing #viewer { visibility: visible; }
    body.viewing #hub { visibility: hidden; }

    .vbar {
      height: var(--bar-h);
      flex: none;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 12px;
      background: var(--sheet);
      border-bottom: 1px solid var(--line);
    }
    .vbtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 10px;
      border-radius: 6px;
      font-size: 14px;
      color: var(--ink-2);
      text-decoration: none;
      white-space: nowrap;
    }
    .vbtn:hover { background: var(--select); color: var(--ink); }
    .vbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .vtitle {
      flex: 1;
      min-width: 0;
      font-size: 14.5px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .vpos { font-size: 13px; color: var(--muted); white-space: nowrap; }
    .vstage { flex: 1; position: relative; }
    .vstage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }

    /* ===== Responsive ===== */
    @media (max-width: 960px) {
      #hub { grid-template-columns: minmax(0, 1fr); height: auto; }
      .index { border-right: 0; min-height: 100vh; min-width: 0; }
      .row.is-selected { background: none; border-left-color: transparent; }
      .index-head { position: sticky; top: 0; z-index: 5; background: var(--sheet); padding: 16px 16px 0; }
      .list { overflow: visible; }
      .group-title { padding: 18px 16px 6px; }
      .row { padding: 8px 16px; grid-template-columns: 96px 1fr; }
      .row-thumb { width: 96px; }
      .row-len { display: none; }
      .stage { display: none; }
      .search kbd { display: none; }
      .vbtn span { display: none; }
      .vpos { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>

  <div id="hub">
    <section class="index" aria-label="발표자료 목록">
      <div class="index-head">
        <div class="brand">
          <h1>Presentation Box</h1>
          <span class="count" id="count"></span>
        </div>

        <label class="search" id="searchBox">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="q" type="search" placeholder="제목이나 키워드로 찾기" autocomplete="off" aria-label="발표자료 검색">
          <button class="clear" id="qClear" type="button" aria-label="검색어 지우기">지우기</button>
          <kbd>/</kbd>
        </label>

        <div class="filters">
          <div class="tabs" id="tabs" role="group" aria-label="주제"></div>
          <select class="style-select" id="styleSel" aria-label="스타일">
            <option value="all">모든 스타일</option>
            <option value="CINEMATIC">시네마틱</option>
            <option value="MOTION GRAPHICS">모션그래픽</option>
            <option value="BRIEFING">브리핑</option>
            <option value="INTERACTIVE">인터랙티브</option>
          </select>
        </div>
      </div>

      <div class="list" id="list"></div>
      <div class="empty" id="empty">
        <p>찾는 발표자료가 없습니다. 다른 단어로 찾거나 필터를 해제하세요.</p>
        <button type="button" id="resetBtn">필터 해제</button>
      </div>
    </section>

    <section class="stage" aria-label="미리보기">
      <div class="stage-inner">
        <div class="screen" id="screen" role="button" tabindex="0" aria-label="선택한 발표 시작">
          <span class="screen-hint">눌러서 발표 시작</span>
        </div>
        <div class="info">
          <div class="tags" id="pTags"></div>
          <h2 id="pTitle"></h2>
          <p class="hook" id="pHook"></p>
          <p class="desc" id="pDesc"></p>
          <div class="actions">
            <button class="btn btn-primary" id="pOpen" type="button">
              <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5l9.5 5.5L4 13.5z"/></svg>
              발표 시작
            </button>
            <a class="btn btn-ghost" id="pNewTab" href="#" target="_blank" rel="noopener">새 탭에서 열기</a>
          </div>
        </div>
      </div>
    </section>
  </div>

  <section id="viewer" aria-label="발표 화면">
    <div class="vbar">
      <button class="vbtn" id="vBack" type="button" title="목록으로 (Esc)">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span>목록</span>
      </button>
      <div class="vtitle" id="vTitle"></div>
      <span class="vpos" id="vPos"></span>
      <button class="vbtn" id="vPrev" type="button" aria-label="이전 발표자료" title="이전 발표자료">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="vbtn" id="vNext" type="button" aria-label="다음 발표자료" title="다음 발표자료">
        <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <a class="vbtn" id="vNewTab" href="#" target="_blank" rel="noopener" title="새 탭에서 열기">
        <svg viewBox="0 0 24 24"><path d="M14 4h6v6M10 14L20 4M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg><span>새 탭</span>
      </a>
      <button class="vbtn" id="vFull" type="button" title="전체화면">
        <svg viewBox="0 0 24 24"><path d="M8 3H4v4M20 7V3h-4M16 21h4v-4M4 17v4h4"/></svg><span>전체화면</span>
      </button>
    </div>
    <div class="vstage" id="vStage"></div>
  </section>

        desc: '40대 후반, 속도보다 방향을 돌아보며 일과 삶의 균형을 새롭게 정립하는 에세이형 발표.',

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const fine = matchMedia('(hover: hover) and (min-width: 961px)');

    let cat = 'all';
    let style = 'all';
    let selectedId = null;
    let currentId = null;
    let shown = [];

    function thumbUrl(t, w = 480) {
      if (!t) return '';
      if (t.includes('/')) return t;
      return `https://images.unsplash.com/${t}?auto=format&fit=crop&w=${w}&q=75`;
    }
    // 목록에는 짧은 제목: [모션그래픽] 같은 접두어와 ' — ' 뒤 부제를 뗀다.
    const shortTitle = t => t.replace(/^\[[^\]]+\]\s*/, '').split(' — ')[0];
    const fullTitle = t => t.replace(/^\[[^\]]+\]\s*/, '');
    const styleOf = d => STYLE_LABELS[d.style] || '인터랙티브';

    function mark(text, q) {
      const safe = esc(text);
      if (!q) return safe;
      const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
      return safe.replace(re, '<mark>$1</mark>');
    }

    function filtered() {
      const q = $('q').value.trim().toLowerCase();
      return DECKS.filter(d => {
        if (cat !== 'all' && d.cat !== cat) return false;
        if (style !== 'all' && styleOf(d) !== STYLE_LABELS[style]) return false;
        if (!q) return true;
        return (d.title + ' ' + (d.hook || '') + ' ' + d.desc + ' ' + d.cat + ' ' + styleOf(d)).toLowerCase().includes(q);
      });
    }

    function renderTabs() {
      const items = [['all', '전체', DECKS.length], ...CATS.map(c => [c, CAT_LABELS[c], DECKS.filter(d => d.cat === c).length])];
      $('tabs').innerHTML = items.map(([key, label]) =>
        `<button class="tab" type="button" data-cat="${key}" aria-pressed="${cat === key}">${label}</button>`).join('');
    }

    function renderList() {
      const q = $('q').value.trim();
      shown = filtered();
      const groups = CATS.map(c => [c, shown.filter(d => d.cat === c)]).filter(([, ds]) => ds.length);

      $('list').innerHTML = groups.map(([c, ds]) => `
        <div class="group-title"><i style="background:${CAT_COLORS[c]}"></i>${CAT_LABELS[c]}<span>${ds.length}</span></div>
        ${ds.map(d => `
          <button class="row" type="button" data-id="${d.id}">
            <span class="row-thumb" style="background-image:url('${thumbUrl(d.thumb, 240)}')"></span>
            <span class="row-title">${mark(shortTitle(d.title), q)}</span>
            <span class="row-len">${esc(d.slides)}</span>
          </button>`).join('')}
      `).join('');

      // 화면 순서(그룹 순)대로 다시 정렬해 키보드 이동과 맞춘다.
      shown = groups.flatMap(([, ds]) => ds);
      $('empty').classList.toggle('show', shown.length === 0);
      $('count').textContent = shown.length === DECKS.length ? `${DECKS.length}개` : `${shown.length} / ${DECKS.length}개`;

      if (!shown.some(d => d.id === selectedId)) selectedId = shown[0] ? shown[0].id : null;
      select(selectedId, { scroll: false });
    }

    // ---- 미리보기 (프로젝터) ----
    let liveTimer = null;
    function select(id, { scroll = true, live = true } = {}) {
      selectedId = id;
      document.querySelectorAll('.row').forEach(r => r.classList.toggle('is-selected', r.dataset.id === id));
      const d = DECKS.find(x => x.id === id);
      if (!d) return;

      if (scroll) {
        const row = document.querySelector(`.row[data-id="${id}"]`);
        if (row) row.scrollIntoView({ block: 'nearest' });
      }

      $('pTags').innerHTML = `
        <span class="cat"><i style="background:${CAT_COLORS[d.cat]}"></i>${CAT_LABELS[d.cat]}</span>
        <span>${styleOf(d)}</span>
        <span>${esc(d.slides)}</span>`;
      $('pTitle').textContent = fullTitle(d.title);
      $('pHook').textContent = d.hook || '';
      $('pDesc').textContent = d.desc || '';
      $('pNewTab').href = d.src;

      const screen = $('screen');
      screen.style.backgroundImage = `url('${thumbUrl(d.thumb, 1280)}')`;
      const old = screen.querySelector('iframe');
      if (old) old.remove();

      clearTimeout(liveTimer);
      if (live && fine.matches) liveTimer = setTimeout(() => loadLive(d), 450);
    }

    // 잠시 머물면 실제 덱 첫 장을 축소해 띄운다 (포인터·포커스는 받지 않음).
    function loadLive(d) {
      if (selectedId !== d.id || currentId) return;
      const screen = $('screen');
      const f = document.createElement('iframe');
      f.title = `${shortTitle(d.title)} 미리보기`;
      f.tabIndex = -1;
      f.setAttribute('aria-hidden', 'true');
      f.addEventListener('load', () => {
        try {
          f.contentWindow.document.querySelectorAll('video, audio').forEach(m => { m.muted = true; });
        } catch (e) { }
        f.classList.add('ready');
      });
      f.src = d.src;
      screen.prepend(f);
      fitLive();
    }
    function fitLive() {
      const screen = $('screen');
      const f = screen.querySelector('iframe');
      if (f) f.style.transform = `scale(${screen.clientWidth / 1920})`;
    }
    new ResizeObserver(fitLive).observe($('screen'));

    // ---- 발표 화면 ----
    function openDeck(id, push = true) {
      const d = DECKS.find(x => x.id === id);
      if (!d) return showHub(push);
      currentId = id;
      clearTimeout(liveTimer);
      const live = $('screen').querySelector('iframe');
      if (live) live.remove();

      document.body.classList.add('viewing');
      const order = shown.length ? shown : DECKS;
      const i = order.findIndex(x => x.id === id);
      $('vTitle').textContent = shortTitle(d.title);
      $('vPos').textContent = i >= 0 ? `${i + 1} / ${order.length}` : '';
      $('vNewTab').href = d.src;
      document.title = `${shortTitle(d.title)} · Presentation Box`;

      const f = document.createElement('iframe');
      f.title = shortTitle(d.title);
      f.setAttribute('allow', 'fullscreen; autoplay');
      f.addEventListener('load', () => {
        try {
          f.contentWindow.addEventListener('keydown', e => {
            if (e.key === 'Escape' && currentId) { e.preventDefault(); showHub(); }
          });
        } catch (e) { }
        try { f.contentWindow.focus(); } catch (e) { }
      });
      f.src = d.src;
      $('vStage').replaceChildren(f);

      if (push) history.replaceState(null, '', `#tab=${id}`);
    }

    function showHub(push = true) {
      const last = currentId;
      currentId = null;
      document.body.classList.remove('viewing');
      document.title = 'Presentation Box';
      $('vStage').replaceChildren();
      if (last && shown.some(d => d.id === last)) select(last);
      else if (selectedId) select(selectedId, { scroll: false });
      if (push) history.replaceState(null, '', '#hub');
    }

    function stepDeck(dir) {
      const order = shown.length ? shown : DECKS;
      const i = order.findIndex(d => d.id === currentId);
      const next = order[((i < 0 ? 0 : i) + dir + order.length) % order.length];
      selectedId = next.id;
      openDeck(next.id);
    }

    function route() {
      const m = location.hash.match(/#tab=([^&]+)/);
      if (m) openDeck(decodeURIComponent(m[1]), false);
      else if (currentId) showHub(false);
    }

    // ---- 이벤트 ----
    $('tabs').addEventListener('click', e => {
      const b = e.target.closest('.tab');
      if (!b) return;
      cat = b.dataset.cat;
      renderTabs();
      renderList();
      $('list').scrollTop = 0;
    });
    $('styleSel').addEventListener('change', e => { style = e.target.value; renderList(); });

    $('q').addEventListener('input', () => {
      $('searchBox').classList.toggle('has-q', !!$('q').value);
      renderList();
    });
    $('qClear').addEventListener('click', e => {
      e.preventDefault();
      $('q').value = '';
      $('searchBox').classList.remove('has-q');
      renderList();
      $('q').focus();
    });
    $('resetBtn').addEventListener('click', () => {
      cat = 'all'; style = 'all';
      $('styleSel').value = 'all';
      $('q').value = '';
      $('searchBox').classList.remove('has-q');
      renderTabs(); renderList();
    });

    $('list').addEventListener('click', e => {
      const r = e.target.closest('.row');
      if (r) openDeck(r.dataset.id);
    });
    $('list').addEventListener('mouseover', e => {
      const r = e.target.closest('.row');
      if (r && fine.matches && r.dataset.id !== selectedId) select(r.dataset.id, { scroll: false });
    });
    $('list').addEventListener('focusin', e => {
      const r = e.target.closest('.row');
      if (r && r.dataset.id !== selectedId) select(r.dataset.id, { scroll: false });
    });

    $('screen').addEventListener('click', () => selectedId && openDeck(selectedId));
    $('screen').addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ' ') && selectedId) { e.preventDefault(); openDeck(selectedId); }
    });
    $('pOpen').addEventListener('click', () => selectedId && openDeck(selectedId));

    $('vBack').addEventListener('click', () => showHub());
    $('vPrev').addEventListener('click', () => stepDeck(-1));
    $('vNext').addEventListener('click', () => stepDeck(1));
    $('vFull').addEventListener('click', () => {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
    });

    window.addEventListener('keydown', e => {
      if (currentId) {
        if (e.key === 'Escape') { e.preventDefault(); showHub(); }
        return;
      }
      const typing = e.target === $('q');
      if (!typing && (e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'))) {
        e.preventDefault(); $('q').focus(); return;
      }
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        if (!shown.length) return;
        e.preventDefault();
        const i = shown.findIndex(d => d.id === selectedId);
        const n = Math.min(shown.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)));
        select(shown[n].id);
        if (!typing) document.querySelector(`.row[data-id="${shown[n].id}"]`)?.focus({ preventScroll: true });
      } else if (e.key === 'Enter' && typing && selectedId) {
        e.preventDefault(); openDeck(selectedId);
      } else if (e.key === 'Escape' && typing) {
        $('q').blur();
      }
    });

    window.addEventListener('hashchange', route);

    renderTabs();
    renderList();
    route();
  </script>
