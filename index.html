<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Presentation Hub</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%230a0a0a%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%23ff3b00%27/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Sans+KR:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #ffffff;
            --ink: #0a0a0a;
            --ink-2: #4a4a4a;
            --ink-3: #9a9a9a;
            --line: #e6e6e6;
            --hot: #ff3b00;
            --f-body: "IBM Plex Sans", "IBM Plex Sans KR", "Helvetica Neue", Arial, sans-serif;
            --f-mono: "IBM Plex Mono", ui-monospace, monospace;
            --tick-h: 36px;
            --bar-h: 52px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            font-family: var(--f-body);
            background: var(--paper);
            color: var(--ink);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        button { font-family: inherit; color: inherit; }
        button:focus-visible, input:focus-visible { outline: 2px solid var(--hot); outline-offset: 2px; }

        /* ===== 티커 ===== */
        .ticker {
            position: relative;
            z-index: 10;
            height: var(--tick-h);
            background: var(--ink);
            color: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            font: 500 11px var(--f-mono);
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .track { display: flex; gap: 40px; white-space: nowrap; padding-right: 40px; animation: slide 46s linear infinite; }
        .ticker:hover .track { animation-play-state: paused; }
        .track span { display: inline-flex; align-items: center; gap: 40px; }
        .track span::after { content: "✦"; color: var(--hot); }
        @keyframes slide { to { transform: translateX(-50%); } }

        /* ===== 허브 ===== */
        #hub {
            position: absolute;
            inset: var(--tick-h) 0 0 0;
            overflow-y: auto;
            overflow-x: hidden;
            transition: opacity 0.3s ease;
        }

        body.viewing #hub { opacity: 0; pointer-events: none; }

        .layout {
            display: grid;
            grid-template-columns: minmax(340px, 40%) 1fr;
            min-height: 100%;
            max-width: 1560px;
            margin: 0 auto;
        }

        .side {
            position: sticky;
            top: 0;
            align-self: start;
            height: calc(100vh - var(--tick-h));
            overflow-y: auto;
            overscroll-behavior: contain;
            display: flex;
            flex-direction: column;
            padding: 44px 40px 36px 48px;
            border-right: 1px solid var(--line);
        }

        .kicker { font: 500 11px var(--f-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
        .kicker i { display: inline-block; width: 8px; height: 8px; margin-right: 10px; border-radius: 50%; background: var(--hot); animation: blink 1.6s ease-in-out infinite; }
        @keyframes blink { 50% { opacity: 0.25; } }

        h1 {
            margin-top: 28px;
            font-size: clamp(64px, 9vw, 148px);
            font-weight: 600;
            line-height: 0.88;
            letter-spacing: -0.06em;
        }

        h1 .out {
            display: block;
            color: transparent;
            -webkit-text-stroke: 2px var(--ink);
            transition: color 0.4s;
        }

        h1:hover .out { color: var(--ink); }

        .lede { margin-top: 26px; max-width: 360px; color: var(--ink-2); font-size: 15px; line-height: 1.75; font-weight: 300; word-break: keep-all; }

        .search { position: relative; margin-top: 34px; }

        #q {
            width: 100%;
            padding: 12px 40px 12px 0;
            border: none;
            border-bottom: 2px solid var(--ink);
            background: transparent;
            color: var(--ink);
            font: 400 16px var(--f-body);
            outline: none;
            border-radius: 0;
        }

        #q::placeholder { color: var(--ink-3); }
        #q:focus { border-bottom-color: var(--hot); }

        .kbd { position: absolute; right: 0; bottom: 12px; font: 500 11px var(--f-mono); color: var(--ink-3); border: 1px solid var(--line); padding: 1px 7px; pointer-events: none; }

        .cats { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 8px; }

        .cat {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border: 1.5px solid var(--ink);
            border-radius: 999px;
            background: var(--paper);
            font-size: 13px;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, transform 0.15s;
        }

        .cat:hover { transform: translateY(-2px); }
        .cat.on { background: var(--ink); color: #fff; }
        .cat.zero { opacity: 0.35; }
        .cat b { font: 500 11px var(--f-mono); opacity: 0.6; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }

        .side-foot { margin-top: auto; padding-top: 24px; display: flex; align-items: baseline; gap: 10px; }
        .big-n { font-size: 72px; font-weight: 300; line-height: 1; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
        .side-foot span { font: 500 11px var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }

        /* ===== 목록 ===== */
        .list { padding: 0 0 80px; }

        .list-head {
            display: flex;
            justify-content: space-between;
            padding: 22px 48px;
            font: 500 11px var(--f-mono);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--ink-3);
            border-bottom: 1px solid var(--line);
        }

        .row {
            --c: var(--ink);
            position: relative;
            display: grid;
            grid-template-columns: 76px 1fr auto 44px;
            align-items: center;
            column-gap: 14px;
            width: 100%;
            padding: 26px 48px 26px 48px;
            border: none;
            border-bottom: 1px solid var(--line);
            background: var(--paper);
            text-align: left;
            cursor: pointer;
            opacity: 0;
            transform: translateX(24px);
            animation: in 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: calc(var(--i) * 50ms);
            transition: background 0.25s, color 0.25s, padding 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow: hidden;
        }

        @keyframes in { to { opacity: 1; transform: none; } }

        .row::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: var(--c);
            transform: scaleY(0);
            transform-origin: top;
            transition: transform 0.3s ease;
        }

        .row:hover, .row:focus-visible { background: var(--ink); color: #fff; padding-left: 62px; outline: none; }
        .row:hover::before, .row:focus-visible::before { transform: scaleY(1); }

        .n { font: 400 13px var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
        .row:hover .n { color: var(--c); }

        .t {
            font-size: clamp(24px, 3.1vw, 44px);
            font-weight: 300;
            line-height: 1.15;
            letter-spacing: -0.03em;
            word-break: keep-all;
            transition: font-weight 0.2s;
        }

        .row:hover .t { font-weight: 600; }

        .k { display: inline-flex; align-items: center; gap: 8px; font: 500 11px var(--f-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
        .row:hover .k { color: #fff; }

        .a { width: 44px; height: 44px; display: grid; place-items: center; border: 1.5px solid var(--line); border-radius: 50%; transition: all 0.3s; }
        .a svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
        .row:hover .a { background: var(--hot); border-color: var(--hot); color: #fff; transform: rotate(-45deg); }

        .d {
            grid-column: 2 / 4;
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s ease;
        }

        .d p {
            overflow: hidden;
            min-height: 0;
            color: inherit;
            opacity: 0.72;
            font-size: 15px;
            line-height: 1.7;
            font-weight: 300;
            word-break: keep-all;
        }

        .row:hover .d, .row:focus-visible .d { grid-template-rows: 1fr; }
        .row:hover .d p { padding-top: 12px; }

        .empty { display: none; padding: 80px 48px; color: var(--ink-3); font-size: 18px; font-weight: 300; }
        .empty.show { display: block; }

        /* ===== 뷰어 ===== */
        #viewer {
            position: absolute;
            inset: var(--tick-h) 0 0 0;
            display: flex;
            flex-direction: column;
            background: var(--paper);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        body.viewing #viewer { opacity: 1; pointer-events: auto; }

        .bar {
            flex: none;
            height: var(--bar-h);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 16px;
            border-bottom: 2px solid var(--ink);
        }

        .back {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 34px;
            padding: 0 16px 0 10px;
            border: none;
            border-radius: 999px;
            background: var(--ink);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .back:hover { background: var(--hot); }
        .back svg, .step svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        .pos { flex: none; font: 500 12px var(--f-mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
        .pos b { color: var(--ink); font-weight: 500; }

        .rail { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .rail::-webkit-scrollbar { display: none; }

        .pill {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 32px;
            padding: 0 14px;
            border: 1.5px solid transparent;
            border-radius: 999px;
            background: none;
            color: var(--ink-2);
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s;
        }

        .pill:hover { border-color: var(--line); color: var(--ink); }
        .pill.active { border-color: var(--ink); background: var(--ink); color: #fff; }

        .step { flex: none; display: flex; gap: 6px; }

        .step button {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            border: 1.5px solid var(--ink);
            border-radius: 50%;
            background: var(--paper);
            cursor: pointer;
            transition: all 0.15s;
        }

        .step button:hover { background: var(--hot); border-color: var(--hot); color: #fff; }

        .stage { flex: 1; position: relative; }
        .frame { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .frame.active { opacity: 1; pointer-events: auto; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }

        /* ===== 반응형 ===== */
        @media (max-width: 960px) {
            .layout { grid-template-columns: 1fr; }
            .side { position: static; height: auto; padding: 32px 20px 28px; border-right: none; border-bottom: 1px solid var(--line); }
            h1 { font-size: clamp(64px, 20vw, 120px); }
            .side-foot { display: none; }
            .list-head { padding: 18px 20px; }
            .row { grid-template-columns: 40px 1fr 36px; padding: 22px 20px; }
            .row:hover, .row:focus-visible { padding-left: 28px; }
            .k { display: none; }
            .a { width: 36px; height: 36px; }
            .d { grid-column: 2 / 3; }
            .empty { padding: 60px 20px; }
        }

        @media (max-width: 640px) {
            .pos, .step { display: none; }
            .back span { display: none; }
            .back { padding: 0 10px; }
            .kbd { display: none; }
        }

        @media (hover: none) {
            .d { grid-template-rows: 1fr; }
            .d p { padding-top: 8px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
            .row { opacity: 1; transform: none; }
        }
    </style>
</head>

<body>
    <div class="ticker" aria-hidden="true"><div class="track" id="track"></div></div>

    <!-- 허브 -->
    <section id="hub">
        <div class="layout">
            <aside class="side">
                <div class="kicker"><i></i>Presentation Archive</div>
                <h1>Signal<span class="out">Hub.</span></h1>
                <p class="lede">AI, 국가 정책, 일과 삶까지. 주제별로 정리한 발표 자료를 한곳에서 바로 열어보세요.</p>

                <label class="search">
                    <input id="q" type="search" placeholder="발표 검색" aria-label="발표 검색" autocomplete="off">
                    <span class="kbd">/</span>
                </label>

                <div class="cats" id="cats"></div>

                <div class="side-foot"><span class="big-n" id="big">00</span><span>decks shown</span></div>
            </aside>

            <main class="list">
                <div class="list-head"><span>Index</span><span>Title / Category</span></div>
                <div id="rows"></div>
                <div class="empty" id="empty">검색 결과가 없습니다.</div>
            </main>
        </div>
    </section>

    <!-- 뷰어 -->
    <section id="viewer" aria-label="발표 뷰어">
        <div class="bar">
            <button class="back" id="back" type="button" aria-label="허브로 돌아가기">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg><span>Hub</span>
            </button>
            <span class="pos" id="pos"></span>
            <nav class="rail" id="rail"></nav>
            <div class="step">
                <button id="prev" type="button" aria-label="이전 발표"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg></button>
                <button id="next" type="button" aria-label="다음 발표"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
            </div>
        </div>
        <div class="stage" id="stage"></div>
    </section>

    <script>
        // 카테고리별 색상
        const CATS = { 'AI': '#7c3aed', '기획': '#ff8a00', '정책': '#0a6cff', '라이프': '#00a88f' };

        // 발표 목록: 새 발표는 여기에 한 줄만 추가하면 목록·탭·뷰어가 자동 생성됨
        const DECKS = [
            { id: 'jev', src: 'jev_ai_presentation.html', cat: 'AI', title: 'JEV & 로컬 판정모델', desc: 'JEV, 로컬 판정모델 LAYA, JevK5 개념부터 한국어 최적화 및 3-Tier 하이브리드 구축까지 15장 총정리.' },
            { id: 'investing', src: 'ai_agent_investing_presentation.html', cat: 'AI', title: '주식 투자 AI 에이전트', desc: '투자 의사결정에 AI 에이전트를 어떻게 활용할 수 있는지 살펴봅니다.' },
            { id: 'speed', src: 'ai_speed_presentation.html', cat: 'AI', title: 'AI 개발 속도 조절', desc: 'AI로 빨라진 개발 속도를 어떻게 조절하고 관리할지 다룹니다.' },
            { id: 'langgraph', src: 'langgraph_presentation.html', cat: 'AI', title: 'LangGraph 에이전트', desc: '기초부터 엔터프라이즈 고도화까지 이어지는 LangGraph 마스터클래스.' },
            { id: 'nemotron', src: 'nemotron_personas_korea_presentation.html', cat: 'AI', title: 'Nemotron 가상설문', desc: 'Nemotron Personas Korea 기반 가상설문의 활용법과 한계.' },
            { id: 'rnd', src: 'ax_rnd_presentation_3.html', cat: '기획', title: 'AX R&D 기획 혁신', desc: 'AX 전환 흐름에 맞춰 R&D 기획을 혁신하는 방법.' },
            { id: '5poles', src: 'five_poles_three_specialties_presentation.html', cat: '정책', title: '5극 3특 체제', desc: '대한민국 균형발전 대전환, 5극 3특 체제를 완벽하게 이해하기.' },
            { id: 'nepsa', src: 'nepsa_presentation.html', cat: '정책', title: 'NEPSA 과제 우선순위', desc: '기대성과 6개와 위험 6개, 12개 지표로 국가 R&D 과제의 순서를 매기는 방법론.' },
            { id: 'safety', src: 'life_safety_act_presentation.html', cat: '정책', title: '생명안전기본법', desc: '생명과 존엄을 위한 새로운 사회계약, 생명안전기본법.' },
            { id: 'life', src: 'balanced_life_presentation.html', cat: '라이프', title: '균형 잡힌 삶', desc: '40대 후반, 일과 삶의 균형을 다시 생각해 봅니다.' }
        ];

        const $ = id => document.getElementById(id);
        const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>';
        const pad = n => String(n + 1).padStart(2, '0');
        const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const color = d => CATS[d.cat] || '#0a0a0a';
        const catNames = Object.keys(CATS);

        let filterCat = '전체';
        let currentId = null;

        // ----- 티커 (내용을 두 번 반복해 끊김 없이 순환) -----
        function renderTicker() {
            const once = DECKS.map(d => `<span>${esc(d.title)}</span>`).join('');
            $('track').innerHTML = once + once;
        }

        // ----- 허브 -----
        // 검색어에만 걸린 목록 — 카테고리 칩의 개수와 행 목록이 같은 기준을 쓴다
        function hits() {
            const q = $('q').value.trim().toLowerCase();
            return q ? DECKS.filter(d => (d.title + d.desc + d.cat).toLowerCase().includes(q)) : DECKS;
        }

        function renderCats() {
            const found = hits();
            const btn = (name, n, c) =>
                `<button class="cat${filterCat === name ? ' on' : ''}${n === 0 ? ' zero' : ''}" type="button" data-cat="${name}">${c ? `<i class="dot" style="--c:${c}"></i>` : ''}${name}<b>${n}</b></button>`;
            $('cats').innerHTML = btn('전체', found.length, '') +
                catNames.map(c => btn(c, found.filter(d => d.cat === c).length, CATS[c])).join('');
        }

        function renderRows() {
            const list = hits().filter(d => filterCat === '전체' || d.cat === filterCat);
            $('rows').innerHTML = list.map((d, i) => `
                <button class="row" type="button" data-id="${d.id}" style="--c:${color(d)};--i:${i}">
                    <span class="n">${pad(DECKS.indexOf(d))}</span>
                    <span class="t">${esc(d.title)}</span>
                    <span class="k"><i class="dot" style="--c:${color(d)}"></i>${esc(d.cat)}</span>
                    <span class="a">${ARROW}</span>
                    <span class="d"><p>${esc(d.desc)}</p></span>
                </button>`).join('');
            $('empty').classList.toggle('show', list.length === 0);
            $('big').textContent = String(list.length).padStart(2, '0');
        }

        function setCat(c) {
            filterCat = c;
            renderCats();
            renderRows();
        }

        // ----- 뷰어 -----
        function buildViewer() {
            $('rail').innerHTML = DECKS.map(d =>
                `<button class="pill" type="button" data-id="${d.id}"><i class="dot" style="--c:${color(d)}"></i>${esc(d.title)}</button>`).join('');
            $('stage').innerHTML = DECKS.map(d =>
                `<div class="frame" id="frame-${d.id}"><iframe id="iframe-${d.id}" title="${esc(d.title)}"></iframe></div>`).join('');
        }

        function openDeck(id, push = true) {
            const idx = DECKS.findIndex(d => d.id === id);
            if (idx < 0) return showHub(push);
            const deck = DECKS[idx];
            currentId = id;
            document.body.classList.add('viewing');

            document.querySelectorAll('.rail .pill').forEach(p => p.classList.toggle('active', p.dataset.id === id));
            document.querySelectorAll('.frame').forEach(f => f.classList.toggle('active', f.id === `frame-${id}`));
            $('pos').innerHTML = `<b>${pad(idx)}</b> / ${String(DECKS.length).padStart(2, '0')}`;
            document.title = `${deck.title} · Signal Hub`;

            // 지연 로딩
            const frame = $(`iframe-${id}`);
            if (!frame.getAttribute('src')) frame.src = deck.src;

            const active = document.querySelector('.rail .pill.active');
            if (active) active.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });

            // 키보드 조작이 바로 되도록 iframe에 포커스
            setTimeout(() => { try { frame.contentWindow.focus(); } catch (e) { } }, 150);

            if (push) history.replaceState(null, '', `#tab=${id}`);
        }

        function showHub(push = true) {
            const last = currentId;
            currentId = null;
            document.body.classList.remove('viewing');
            document.title = 'Signal Presentation Hub';
            // 포커스가 iframe에 남아 있으면 허브에서 키보드가 먹지 않는다
            if (last) (document.querySelector(`.row[data-id="${last}"]`) || $('q')).focus();
            if (push) history.replaceState(null, '', '#hub');
        }

        function step(dir) {
            const i = DECKS.findIndex(d => d.id === currentId);
            if (i < 0) return;
            openDeck(DECKS[(i + dir + DECKS.length) % DECKS.length].id);
        }

        function routeFromHash() {
            const m = location.hash.match(/#tab=([^&]+)/);
            m ? openDeck(decodeURIComponent(m[1]), false) : showHub(false);
        }

        // ----- 이벤트 -----
        $('cats').addEventListener('click', e => { const b = e.target.closest('.cat'); if (b) setCat(b.dataset.cat); });
        $('q').addEventListener('input', () => { renderCats(); renderRows(); });
        $('rows').addEventListener('click', e => { const r = e.target.closest('.row'); if (r) openDeck(r.dataset.id); });
        $('rail').addEventListener('click', e => { const p = e.target.closest('.pill'); if (p) openDeck(p.dataset.id); });
        $('back').addEventListener('click', () => showHub());
        $('prev').addEventListener('click', () => step(-1));
        $('next').addEventListener('click', () => step(1));

        window.addEventListener('keydown', e => {
            // 허브에서 "/" 또는 Ctrl/⌘+K 로 검색창 포커스
            if (!currentId && e.target !== $('q') && (e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'))) {
                e.preventDefault();
                $('q').focus();
                return;
            }
            if (!currentId) return;
            if (e.key === 'Escape') { e.preventDefault(); showHub(); return; }
            // 부모 창에 포커스가 있을 때 누른 키를 활성 iframe으로 전달
            try {
                $(`iframe-${currentId}`).contentWindow.dispatchEvent(new KeyboardEvent('keydown', {
                    key: e.key, code: e.code, keyCode: e.keyCode, which: e.which, bubbles: true
                }));
            } catch (err) { }
        });

        window.addEventListener('hashchange', routeFromHash);

        // ----- 시작 -----
        renderTicker();
        renderCats();
        renderRows();
        buildViewer();
        routeFromHash();
    </script>
</body>

</html>
