<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Presentation Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,300;1,8..60,400;1,8..60,600;1,8..60,700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --c-bg: #1c2644;
            --c-bg-alt: #131b31;
            --c-accent: #c8a870;
            --c-fg: #e2dcd0;
            --c-fg-muted: #8a96a8;
            --f-display: "Source Serif 4", "Noto Serif KR", Georgia, serif;
            --f-body: "DM Sans", "Noto Sans KR", system-ui, sans-serif;
            --f-mono: "IBM Plex Mono", monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--f-body);
            background-color: var(--c-bg-alt);
            color: var(--c-fg);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header Navigation */
        header {
            height: 60px;
            background-color: rgba(28, 38, 68, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(200, 168, 112, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 1000;
            position: relative;
        }

        .logo {
            font-family: var(--f-display);
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--c-fg);
        }

        .logo em {
            font-style: italic;
            color: var(--c-accent);
        }

        nav {
            display: flex;
            height: 100%;
            position: relative;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--c-fg-muted);
            font-family: var(--f-body);
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0 20px;
            cursor: pointer;
            height: 100%;
            display: flex;
            align-items: center;
            position: relative;
            transition: color 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--c-fg);
        }

        .tab-btn.active {
            color: var(--c-accent);
            font-weight: 600;
        }

        /* Active underline slide animation */
        .nav-underline {
            position: absolute;
            bottom: 0;
            height: 3px;
            background-color: var(--c-accent);
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 3px 3px 0 0;
            box-shadow: 0 -2px 10px rgba(200, 168, 112, 0.4);
        }

        /* Main Content (iframe area) */
        main {
            flex: 1;
            position: relative;
            background-color: var(--c-bg);
        }

        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .iframe-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: var(--c-bg);
        }

        /* Mobile adaptation */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                height: auto;
                padding: 15px 15px 0 15px;
                gap: 12px;
            }
            .logo {
                font-size: 1.1rem;
            }
            nav {
                width: 100%;
                overflow-x: auto;
                scrollbar-width: none; /* Firefox */
                -ms-overflow-style: none;  /* IE and Edge */
            }
            nav::-webkit-scrollbar {
                display: none; /* Chrome, Safari, Opera */
            }
            .tab-btn {
                padding: 12px 15px;
                font-size: 0.85rem;
                white-space: nowrap;
            }
            main {
                height: calc(100vh - 100px); /* header height approximate fallback */
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Signal <em>Hub</em></div>
        <nav id="tab-navigation">
            <button class="tab-btn" data-tab="investing" data-src="ai_agent_investing_presentation.html">주식 투자 AI 에이전트</button>
            <button class="tab-btn" data-tab="rnd" data-src="ax_rnd_presentation_3.html">AX R&D 기획 혁신</button>
            <button class="tab-btn" data-tab="life" data-src="balanced_life_presentation.html">균형 잡힌 삶</button>
            <button class="tab-btn" data-tab="nemotron" data-src="nemotron_personas_korea_presentation.html">Nemotron 가상설문</button>
            <div class="nav-underline" id="nav-underline"></div>
        </nav>
    </header>

    <main>
        <div class="iframe-container" id="container-investing">
            <iframe id="iframe-investing" title="주식 투자 AI 에이전트"></iframe>
        </div>
        <div class="iframe-container" id="container-rnd">
            <iframe id="iframe-rnd" title="AX R&D 기획 혁신"></iframe>
        </div>
        <div class="iframe-container" id="container-life">
            <iframe id="iframe-life" title="균형 잡힌 삶"></iframe>
        </div>
        <div class="iframe-container" id="container-nemotron">
            <iframe id="iframe-nemotron" title="Nemotron 가상설문"></iframe>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.tab-btn');
            const containers = document.querySelectorAll('.iframe-container');
            const underline = document.getElementById('nav-underline');
            const nav = document.getElementById('tab-navigation');

            // Update underline position
            function updateUnderline(activeTab) {
                if (!activeTab) return;
                const rect = activeTab.getBoundingClientRect();
                const navRect = nav.getBoundingClientRect();
                underline.style.width = `${rect.width}px`;
                underline.style.left = `${rect.left - navRect.left}px`;
            }

            // Switch tab function
            function switchTab(tabId, pushState = true) {
                const activeTab = document.querySelector(`.tab-btn[data-tab="${tabId}"]`);
                if (!activeTab) return;

                // Remove active class from all tabs
                tabs.forEach(t => t.classList.remove('active'));
                activeTab.classList.add('active');

                // Update underline
                updateUnderline(activeTab);

                // Show target container, hide others
                containers.forEach(c => c.classList.remove('active'));
                const targetContainer = document.getElementById(`container-${tabId}`);
                if (targetContainer) {
                    targetContainer.classList.add('active');
                }

                // Lazy load iframe src
                const targetIframe = document.getElementById(`iframe-${tabId}`);
                if (targetIframe && !targetIframe.src) {
                    const src = activeTab.getAttribute('data-src');
                    targetIframe.src = src;
                }

                // Update URL hash
                if (pushState) {
                    history.replaceState(null, null, `#tab=${tabId}`);
                }
            }

            // Event Listeners for tabs
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    switchTab(tab.getAttribute('data-tab'));
                });
            });

            // Initialize based on URL hash or default to first tab
            function initHashNavigation() {
                const hash = window.location.hash;
                const match = hash.match(/#tab=([^&]+)/);
                const initialTabId = match ? match[1] : 'investing';
                
                // Switch to initial tab
                switchTab(initialTabId, false);
                
                // Small delay to ensure layout is complete before positioning underline
                setTimeout(() => {
                    const activeTab = document.querySelector(`.tab-btn[data-tab="${initialTabId}"]`);
                    updateUnderline(activeTab);
                }, 100);
            }

            // Window resize handler to reposition underline
            window.addEventListener('resize', () => {
                const activeTab = document.querySelector('.tab-btn.active');
                updateUnderline(activeTab);
            });

            // Handle back/forward hash changes
            window.addEventListener('hashchange', () => {
                const hash = window.location.hash;
                const match = hash.match(/#tab=([^&]+)/);
                if (match) {
                    switchTab(match[1], false);
                }
            });

            // Start navigation setup
            initHashNavigation();
        });
    </script>
</body>
</html>
