<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Presentation Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --c-bg: #fbfaf7;
            --c-surface: #ffffff;
            --c-line: rgba(20, 22, 31, 0.09);
            --c-accent: #a9762a;
            --c-ink: #14161f;
            --c-fg: #14161f;
            --c-fg-muted: #6a7080;
            --f-display: "Source Serif 4", "Noto Serif KR", Georgia, serif;
            --f-body: "DM Sans", "Noto Sans KR", system-ui, sans-serif;
            --f-mono: "IBM Plex Mono", monospace;
            --bar-h: 56px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: var(--f-body);
            background: var(--c-bg);
            color: var(--c-fg);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== 배경: 오로라 + 그리드 ===== */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(55% 45% at 12% 0%, rgba(255, 196, 120, 0.35), transparent 70%),
                radial-gradient(45% 40% at 92% 8%, rgba(120, 160, 255, 0.28), transparent 70%),
                radial-gradient(55% 45% at 65% 105%, rgba(255, 140, 190, 0.20), transparent 70%),
                var(--c-bg);
        }

        .bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(20, 22, 31, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(20, 22, 31, 0.045) 1px, transparent 1px);
            background-size: 56px 56px;
            mask-image: radial-gradient(ellipse at 50% 0%, #000 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 20%, transparent 75%);
        }

        /* ===== 허브(갤러리) ===== */
        #hub {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow-y: auto;
            padding: 0 clamp(20px, 5vw, 72px) 80px;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        body.viewing #hub {
            opacity: 0;
            transform: scale(0.985);
            pointer-events: none;
        }

        .hub-inner { max-width: 1240px; margin: 0 auto; }

        .hub-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 0 0;
            font-family: var(--f-mono);
            font-size: 0.75rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--c-fg-muted);
        }

        .hub-top .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--c-accent);
            box-shadow: 0 0 12px var(--c-accent);
            margin-right: 10px;
            animation: pulse 2.4s ease-in-out infinite;
        }

        @keyframes pulse { 50% { opacity: 0.35; } }

        .hero { padding: clamp(48px, 9vh, 96px) 0 40px; }

        .hero h1 {
            font-family: var(--f-display);
            font-weight: 700;
            font-size: clamp(2.8rem, 8vw, 6rem);
            line-height: 1.02;
            letter-spacing: -0.03em;
        }

        .hero h1 em {
            font-style: italic;
            font-weight: 400;
            background: linear-gradient(100deg, #e08a2c, #d4526e 55%, #5b6cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero p {
            margin-top: 22px;
            max-width: 560px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--c-fg-muted);
            font-weight: 300;
            word-break: keep-all;
        }

        /* 툴바: 검색 + 필터 */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            margin-bottom: 28px;
        }

        .search {
            flex: 1 1 260px;
            max-width: 360px;
            position: relative;
        }

        .search input {
            width: 100%;
            height: 42px;
            padding: 0 16px 0 40px;
            border-radius: 999px;
            border: 1px solid var(--c-line);
            background: var(--c-surface);
            color: var(--c-fg);
            font: 400 0.92rem var(--f-body);
            outline: none;
            transition: border-color 0.25s, background 0.25s;
        }

        .search input:focus { border-color: var(--c-ink); background: #fff; box-shadow: 0 0 0 4px rgba(20, 22, 31, 0.06); }
        .search input::placeholder { color: var(--c-fg-muted); }

        .search svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--c-fg-muted);
            fill: none;
            stroke-width: 2;
        }

        .chips { display: flex; flex-wrap: wrap; gap: 8px; }

        .chip {
            height: 34px;
            padding: 0 16px;
            border-radius: 999px;
            border: 1px solid var(--c-line);
            background: transparent;
            color: var(--c-fg-muted);
            font: 500 0.82rem var(--f-body);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover { color: var(--c-fg); border-color: rgba(20, 22, 31, 0.35); }
        .chip.on { color: #fff; background: var(--c-ink); border-color: var(--c-ink); }

        .count { margin-left: auto; font: 400 0.78rem var(--f-mono); color: var(--c-fg-muted); }

        /* 카드 그리드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 18px;
        }

        .card {
            --mx: 50%;
            --my: 0%;
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 230px;
            padding: 26px 26px 22px;
            text-align: left;
            border-radius: 20px;
            border: 1px solid var(--c-line);
            background: var(--c-surface);
            color: inherit;
            font: inherit;
            cursor: pointer;
            overflow: hidden;
            opacity: 0;
            transform: translateY(18px);
            animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: calc(var(--i) * 55ms + 120ms);
            box-shadow: 0 1px 2px rgba(20, 22, 31, 0.04), 0 8px 24px -14px rgba(20, 22, 31, 0.12);
            transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
        }

        @keyframes rise { to { opacity: 1; transform: none; } }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(320px circle at var(--mx) var(--my), color-mix(in srgb, var(--hue) 16%, transparent), transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .card::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--hue), transparent 70%);
            opacity: 0.85;
        }

        .card:hover, .card:focus-visible {
            transform: translateY(-4px);
            border-color: color-mix(in srgb, var(--hue) 55%, transparent);
            box-shadow: 0 24px 50px -22px color-mix(in srgb, var(--hue) 65%, transparent);
            outline: none;
        }

        .card:hover::before, .card:focus-visible::before { opacity: 1; }

        .card-head {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .tag {
            font: 500 0.68rem var(--f-mono);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 5px 10px;
            border-radius: 999px;
            color: color-mix(in srgb, var(--hue) 62%, #000);
            background: color-mix(in srgb, var(--hue) 16%, #fff);
        }

        .num { font: 400 0.8rem var(--f-mono); color: var(--c-fg-muted); }

        .card h2 {
            position: relative;
            font-family: var(--f-display);
            font-size: 1.5rem;
            line-height: 1.3;
            font-weight: 700;
            letter-spacing: -0.015em;
            word-break: keep-all;
        }

        .card p {
            position: relative;
            margin-top: 10px;
            font-size: 0.9rem;
            line-height: 1.65;
            color: var(--c-fg-muted);
            font-weight: 300;
            word-break: keep-all;
        }

        .card-foot {
            position: relative;
            margin-top: auto;
            padding-top: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font: 500 0.8rem var(--f-body);
            color: var(--c-fg-muted);
        }

        .arrow {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            border: 1px solid var(--c-line);
            transition: all 0.3s;
        }

        .arrow svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }

        .card:hover .arrow {
            background: var(--hue);
            border-color: var(--hue);
            color: #fff;
            transform: translateX(3px);
        }

        .card:hover .card-foot { color: var(--c-fg); }

        .empty { display: none; padding: 60px 0; text-align: center; color: var(--c-fg-muted); }
        .empty.show { display: block; }

        footer.hub-foot {
            margin-top: 64px;
            padding-top: 22px;
            border-top: 1px solid var(--c-line);
            font: 400 0.75rem var(--f-mono);
            color: var(--c-fg-muted);
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ===== 뷰어 ===== */
        #viewer {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transform: translateY(14px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        body.viewing #viewer { opacity: 1; pointer-events: auto; transform: none; }

        .bar {
            height: var(--bar-h);
            flex: none;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.86);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--c-line);
        }

        .back {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 36px;
            padding: 0 14px 0 10px;
            border-radius: 999px;
            border: 1px solid var(--c-line);
            background: var(--c-surface);
            color: var(--c-fg);
            font: 500 0.85rem var(--f-body);
            cursor: pointer;
            transition: all 0.2s;
        }

        .back:hover { border-color: var(--c-ink); background: var(--c-ink); color: #fff; }
        .back svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        .now {
            flex: none;
            max-width: 26vw;
            font: 700 1rem var(--f-display);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        nav.rail {
            flex: 1;
            min-width: 0;
            display: flex;
            gap: 4px;
            overflow-x: auto;
            scrollbar-width: none;
            padding: 0 4px;
        }

        nav.rail::-webkit-scrollbar { display: none; }

        .pill {
            flex: none;
            height: 34px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1px solid transparent;
            background: none;
            color: var(--c-fg-muted);
            font: 500 0.82rem var(--f-body);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pill:hover { color: var(--c-fg); background: var(--c-surface); }

        .pill.active {
            color: color-mix(in srgb, var(--hue) 55%, #000);
            background: color-mix(in srgb, var(--hue) 16%, #fff);
            border-color: color-mix(in srgb, var(--hue) 45%, transparent);
        }

        .step { flex: none; display: flex; gap: 6px; }

        .step button {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--c-line);
            background: var(--c-surface);
            color: var(--c-fg);
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: all 0.2s;
        }

        .step button:hover { border-color: var(--c-ink); background: var(--c-ink); color: #fff; }
        .step svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }

        .stage { flex: 1; position: relative; background: var(--c-bg); }

        .frame {
            position: absolute;
            inset: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .frame.active { opacity: 1; pointer-events: auto; }

        iframe { width: 100%; height: 100%; border: none; background: #fff; }

        @media (max-width: 860px) {
            .now { display: none; }
            .count { display: none; }
        }

        @media (max-width: 560px) {
            .grid { grid-template-columns: 1fr; }
            .step { display: none; }
            .back span { display: none; }
            .back { padding: 0 10px; }
            .search { max-width: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
            .card { opacity: 1; transform: none; }
        }
    </style>
</head>

<body>
    <div class="bg"></div>

    <!-- 허브: 카드 갤러리 -->
    <section id="hub">
        <div class="hub-inner">
            <div class="hub-top">
                <span><span class="dot"></span>Presentation Archive</span>
                <span id="year"></span>
            </div>

            <div class="hero">
                <h1>Signal <em>Hub</em></h1>
                <p>AI, 국가 정책, 일과 삶까지. 주제별로 정리한 발표 자료를 한곳에서 바로 열어보세요.</p>
            </div>

            <div class="toolbar">
                <label class="search">
                    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
                    <input id="q" type="search" placeholder="발표 검색" aria-label="발표 검색" autocomplete="off">
                </label>
                <div class="chips" id="chips"></div>
                <span class="count" id="count"></span>
            </div>

            <div class="grid" id="grid"></div>
            <div class="empty" id="empty">검색 결과가 없습니다.</div>

            <footer class="hub-foot">
                <span>Signal Presentation Hub</span>
                <span>카드를 클릭하거나 키보드로 Enter</span>
            </footer>
        </div>
    </section>

    <!-- 뷰어: 슬림 바 + iframe -->
    <section id="viewer" aria-label="발표 뷰어">
        <div class="bar">
            <button class="back" id="back" type="button" aria-label="허브로 돌아가기">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg><span>Hub</span>
            </button>
            <div class="now" id="now"></div>
            <nav class="rail" id="rail"></nav>
            <div class="step">
                <button id="prev" type="button" aria-label="이전 발표"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg></button>
                <button id="next" type="button" aria-label="다음 발표"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
            </div>
        </div>
        <div class="stage" id="stage"></div>
    </section>

    <script>
        // 발표 목록: 새 발표는 여기에 한 줄만 추가하면 카드·탭·뷰어가 자동 생성됨
        const DECKS = [
            { id: 'investing', src: 'ai_agent_investing_presentation.html', cat: 'AI', hue: '#14b8a6', title: '주식 투자 AI 에이전트', desc: '투자 의사결정에 AI 에이전트를 어떻게 활용할 수 있는지 살펴봅니다.' },
            { id: 'speed', src: 'ai_speed_presentation.html', cat: 'AI', hue: '#0ea5e9', title: 'AI 개발 속도 조절', desc: 'AI로 빨라진 개발 속도를 어떻게 조절하고 관리할지 다룹니다.' },
            { id: 'langgraph', src: 'langgraph_presentation.html', cat: 'AI', hue: '#a78bfa', title: 'LangGraph 에이전트', desc: '기초부터 엔터프라이즈 고도화까지 이어지는 LangGraph 마스터클래스.' },
            { id: 'nemotron', src: 'nemotron_personas_korea_presentation.html', cat: 'AI', hue: '#65a30d', title: 'Nemotron 가상설문', desc: 'Nemotron Personas Korea 기반 가상설문의 활용법과 한계.' },
            { id: 'rnd', src: 'ax_rnd_presentation_3.html', cat: '기획', hue: '#f59e0b', title: 'AX R&D 기획 혁신', desc: 'AX 전환 흐름에 맞춰 R&D 기획을 혁신하는 방법.' },
            { id: '5poles', src: 'five_poles_three_specialties_presentation.html', cat: '정책', hue: '#60a5fa', title: '5극 3특 체제', desc: '대한민국 균형발전 대전환, 5극 3특 체제를 완벽하게 이해하기.' },
            { id: 'nepsa', src: 'nepsa_presentation.html', cat: '정책', hue: '#f472b6', title: 'NEPSA 과제 우선순위', desc: 'NEPSA 과제의 우선순위를 정리한 발표 자료.' },
            { id: 'safety', src: 'life_safety_act_presentation.html', cat: '정책', hue: '#fb7185', title: '생명안전기본법', desc: '생명과 존엄을 위한 새로운 사회계약, 생명안전기본법.' },
            { id: 'life', src: 'balanced_life_presentation.html', cat: '라이프', hue: '#d4a017', title: '균형 잡힌 삶', desc: '40대 후반, 일과 삶의 균형을 다시 생각해 봅니다.' }
        ];

        const $ = id => document.getElementById(id);
        const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>';
        const pad = n => String(n + 1).padStart(2, '0');
        const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

        let filterCat = '전체';
        let currentId = null;

        // ----- 허브 렌더링 -----
        function renderChips() {
            const cats = ['전체', ...new Set(DECKS.map(d => d.cat))];
            $('chips').innerHTML = cats.map(c =>
                `<button class="chip${c === filterCat ? ' on' : ''}" type="button" data-cat="${c}">${c}</button>`).join('');
        }

        function renderGrid() {
            const q = $('q').value.trim().toLowerCase();
            const list = DECKS.filter(d =>
                (filterCat === '전체' || d.cat === filterCat) &&
                (!q || (d.title + d.desc + d.cat).toLowerCase().includes(q)));
            $('grid').innerHTML = list.map((d, i) => `
                <button class="card" type="button" data-id="${d.id}" style="--hue:${d.hue};--i:${i}">
                    <div class="card-head"><span class="tag">${esc(d.cat)}</span><span class="num">${pad(DECKS.indexOf(d))}</span></div>
                    <h2>${esc(d.title)}</h2>
                    <p>${esc(d.desc)}</p>
                    <div class="card-foot"><span>발표 열기</span><span class="arrow">${ARROW}</span></div>
                </button>`).join('');
            $('empty').classList.toggle('show', list.length === 0);
            $('count').textContent = `${list.length} / ${DECKS.length} decks`;
        }

        // ----- 뷰어 구성 -----
        function buildViewer() {
            $('rail').innerHTML = DECKS.map(d =>
                `<button class="pill" type="button" data-id="${d.id}" style="--hue:${d.hue}">${esc(d.title)}</button>`).join('');
            $('stage').innerHTML = DECKS.map(d =>
                `<div class="frame" id="frame-${d.id}"><iframe id="iframe-${d.id}" title="${esc(d.title)}"></iframe></div>`).join('');
        }

        function openDeck(id, push = true) {
            const deck = DECKS.find(d => d.id === id);
            if (!deck) return showHub(push);
            currentId = id;
            document.body.classList.add('viewing');

            document.querySelectorAll('.pill').forEach(p => p.classList.toggle('active', p.dataset.id === id));
            document.querySelectorAll('.frame').forEach(f => f.classList.toggle('active', f.id === `frame-${id}`));
            $('now').textContent = deck.title;
            document.title = `${deck.title} · Signal Hub`;

            // 지연 로딩
            const frame = $(`iframe-${id}`);
            if (!frame.getAttribute('src')) frame.src = deck.src;

            const active = document.querySelector('.pill.active');
            if (active) active.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });

            // 키보드 조작이 바로 되도록 iframe에 포커스
            setTimeout(() => { try { frame.contentWindow.focus(); } catch (e) { } }, 150);

            if (push) history.replaceState(null, '', `#tab=${id}`);
        }

        function showHub(push = true) {
            currentId = null;
            document.body.classList.remove('viewing');
            document.title = 'Signal Presentation Hub';
            if (push) history.replaceState(null, '', '#hub');
        }

        function step(dir) {
            const i = DECKS.findIndex(d => d.id === currentId);
            if (i < 0) return;
            openDeck(DECKS[(i + dir + DECKS.length) % DECKS.length].id);
        }

        function routeFromHash() {
            const m = location.hash.match(/#tab=([^&]+)/);
            m ? openDeck(decodeURIComponent(m[1]), false) : showHub(false);
        }

        // ----- 이벤트 -----
        $('chips').addEventListener('click', e => {
            const b = e.target.closest('.chip');
            if (!b) return;
            filterCat = b.dataset.cat;
            renderChips();
            renderGrid();
        });
        $('q').addEventListener('input', renderGrid);

        $('grid').addEventListener('click', e => {
            const c = e.target.closest('.card');
            if (c) openDeck(c.dataset.id);
        });
        // 마우스 위치 따라 움직이는 카드 글로우
        $('grid').addEventListener('pointermove', e => {
            const c = e.target.closest('.card');
            if (!c) return;
            const r = c.getBoundingClientRect();
            c.style.setProperty('--mx', `${e.clientX - r.left}px`);
            c.style.setProperty('--my', `${e.clientY - r.top}px`);
        });

        $('rail').addEventListener('click', e => {
            const p = e.target.closest('.pill');
            if (p) openDeck(p.dataset.id);
        });
        $('back').addEventListener('click', () => showHub());
        $('prev').addEventListener('click', () => step(-1));
        $('next').addEventListener('click', () => step(1));

        // 부모 창에 포커스가 있을 때 누른 키를 활성 iframe으로 전달
        window.addEventListener('keydown', e => {
            if (!currentId || e.target === $('q')) return;
            const frame = $(`iframe-${currentId}`);
            try {
                frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown', {
                    key: e.key, code: e.code, keyCode: e.keyCode, which: e.which, bubbles: true
                }));
            } catch (err) { }
        });

        window.addEventListener('hashchange', routeFromHash);

        // ----- 시작 -----
        $('year').textContent = new Date().getFullYear();
        renderChips();
        renderGrid();
        buildViewer();
        routeFromHash();
    </script>
</body>

</html>
