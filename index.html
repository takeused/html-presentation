<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signal Presentation Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=IBM+Plex+Sans+KR:wght@300;400;600&family=IBM+Plex+Mono:wght@400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --canvas: #ffffff;
            --surface-1: #f4f4f4;
            --surface-2: #e0e0e0;
            --hairline: #e0e0e0;
            --ink: #161616;
            --ink-muted: #525252;
            --ink-subtle: #8c8c8c;
            --primary: #0f62fe;
            --primary-hover: #0043ce;
            --cat-ai: #7c3aed;
            --cat-plan: #b45309;
            --cat-policy: #0369a1;
            --cat-life: #0d9488;
            --f-body: "IBM Plex Sans", "IBM Plex Sans KR", "Helvetica Neue", Arial, sans-serif;
            --f-mono: "IBM Plex Mono", monospace;
            --strip-h: 32px;
            --bar-h: 48px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: var(--f-body);
            font-size: 16px;
            line-height: 1.5;
            letter-spacing: 0.16px;
            background: var(--canvas);
            color: var(--ink);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        button { font-family: inherit; }
        button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

        /* ===== 상단 유틸리티 스트립 ===== */
        .strip {
            position: relative;
            z-index: 5;
            height: var(--strip-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: var(--surface-1);
            border-bottom: 1px solid var(--hairline);
            color: var(--ink-muted);
            font-size: 12px;
            letter-spacing: 0.32px;
        }

        .strip b { font-weight: 600; color: var(--ink); }

        /* ===== 허브 ===== */
        #hub {
            position: absolute;
            inset: var(--strip-h) 0 0 0;
            overflow-y: auto;
            transition: opacity 0.3s ease;
        }

        body.viewing #hub { opacity: 0; pointer-events: none; }

        .container { max-width: 1312px; margin: 0 auto; padding: 0 32px; }

        .hero {
            padding: 56px 0 28px;
            text-align: center;
            border-bottom: 1px solid var(--hairline);
        }

        .eyebrow { display: block; font-size: 14px; color: var(--ink-muted); margin-bottom: 16px; }

        .hero h1 {
            font-size: clamp(1.7rem, 4.2vw, 2.4rem);
            font-weight: 300;
            line-height: 1.25;
            letter-spacing: -0.4px;
            word-break: keep-all;
        }

        .hero h1 em { font-style: normal; color: var(--primary); }

        /* 개요 패널 */
        .panel {
            margin: 32px 0;
            padding: 16px;
            background: var(--surface-1);
            border: 1px solid var(--hairline);
            border-radius: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 8px;
        }

        .stat {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background: var(--canvas);
            color: var(--ink-muted);
            font-size: 13px;
            cursor: pointer;
            text-align: left;
            transition: box-shadow 0.15s;
        }

        .stat:hover { box-shadow: inset 0 0 0 1px var(--ink-subtle); }
        .stat.on { box-shadow: inset 0 0 0 2px var(--ink); }
        .stat .l { display: inline-flex; align-items: center; gap: 8px; }
        .stat .v { font-size: 20px; font-weight: 600; color: var(--ink); }

        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink)); flex: none; }

        .dist {
            display: flex;
            height: 8px;
            margin-top: 12px;
            border-radius: 4px;
            overflow: hidden;
            gap: 2px;
            background: var(--canvas);
        }

        .dist i { display: block; background: var(--c); transition: flex 0.3s; }

        /* 검색 */
        .search { position: relative; margin-bottom: 20px; }

        .search svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            stroke: var(--ink-subtle);
            fill: none;
            stroke-width: 2;
            pointer-events: none;
        }

        #q {
            width: 100%;
            padding: 11px 64px 11px 44px;
            border: none;
            border-bottom: 1px solid var(--ink-subtle);
            background: var(--surface-1);
            color: var(--ink);
            font: 400 16px var(--f-body);
            letter-spacing: 0.16px;
            outline: none;
        }

        #q:focus { border-bottom: 2px solid var(--primary); }
        #q::placeholder { color: var(--ink-subtle); }

        .kbd {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            padding: 1px 7px;
            border: 1px solid var(--hairline);
            background: var(--canvas);
            font: 400 11px var(--f-mono);
            color: var(--ink-subtle);
            pointer-events: none;
        }

        /* 필터 */
        .filters { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 28px; }

        .flabel {
            padding: 4px 10px;
            border-radius: 999px;
            background: #0f62fe;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .pills { display: flex; flex-wrap: wrap; gap: 4px; }

        .pill {
            padding: 5px 12px;
            border: 1px solid var(--hairline);
            border-radius: 999px;
            background: var(--canvas);
            color: var(--ink-muted);
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.1s, color 0.1s;
        }

        .pill:hover { background: var(--surface-2); color: var(--ink); }

        .pill.on {
            background: linear-gradient(#f5f5f7, #d2d2d7);
            border-color: #c0c0c5;
            color: #1d1d1f;
        }

        .count { margin-left: auto; font: 400 12px var(--f-mono); color: var(--ink-subtle); }

        /* 카드 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 16px;
            padding-bottom: 8px;
        }

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 200px;
            padding: 20px 24px;
            text-align: left;
            background: var(--canvas);
            border: 1px solid var(--hairline);
            border-left: 4px solid var(--c);
            color: inherit;
            font: inherit;
            cursor: pointer;
            opacity: 0;
            transform: translateY(8px);
            animation: rise 0.45s ease forwards;
            animation-delay: calc(var(--i) * 40ms);
            transition: background 0.12s, box-shadow 0.2s;
        }

        @keyframes rise { to { opacity: 1; transform: none; } }

        .card:hover { background: var(--surface-1); box-shadow: 0 6px 20px -10px rgba(22, 22, 22, 0.25); }

        .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }

        .no { font: 400 12px var(--f-mono); color: var(--ink-subtle); }

        .tag {
            padding: 1px 8px;
            border: 1px solid var(--c);
            color: var(--c);
            font-size: 12px;
            letter-spacing: 0.16px;
        }

        .card h2 { font-size: 20px; font-weight: 400; line-height: 1.35; letter-spacing: 0; word-break: keep-all; }

        .card p {
            margin-top: 8px;
            color: var(--ink-muted);
            font-size: 14px;
            line-height: 1.6;
            word-break: keep-all;
        }

        .open {
            margin-top: auto;
            padding-top: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--primary);
        }

        .open svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; transition: transform 0.2s; }
        .card:hover .open svg { transform: translateX(4px); }

        .empty { display: none; padding: 64px 0; text-align: center; color: var(--ink-subtle); }
        .empty.show { display: block; }

        .foot {
            margin-top: 56px;
            padding: 20px 0 40px;
            border-top: 1px solid var(--hairline);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12px;
            color: var(--ink-subtle);
        }

        /* ===== 뷰어 ===== */
        #viewer {
            position: absolute;
            inset: var(--strip-h) 0 0 0;
            display: flex;
            flex-direction: column;
            background: var(--canvas);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        body.viewing #viewer { opacity: 1; pointer-events: auto; }

        .bar {
            flex: none;
            height: var(--bar-h);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            background: var(--canvas);
            border-bottom: 1px solid var(--hairline);
        }

        .back {
            flex: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            padding: 0 14px 0 8px;
            border: 1px solid var(--hairline);
            border-radius: 999px;
            background: var(--canvas);
            color: var(--ink);
            font-size: 13px;
            cursor: pointer;
            transition: background 0.1s;
        }

        .back:hover { background: var(--surface-2); }
        .back svg, .step svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

        .rail { flex: 1; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .rail::-webkit-scrollbar { display: none; }
        .rail .pill { flex: none; }

        .rail .pill.active {
            background: linear-gradient(#f5f5f7, #d2d2d7);
            border-color: #c0c0c5;
            color: #1d1d1f;
        }

        .step { flex: none; display: flex; gap: 4px; }

        .step button {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border: 1px solid var(--hairline);
            border-radius: 50%;
            background: var(--canvas);
            color: var(--ink);
            cursor: pointer;
        }

        .step button:hover { background: var(--ink); color: #fff; border-color: var(--ink); }

        .stage { flex: 1; position: relative; }

        .frame { position: absolute; inset: 0; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .frame.active { opacity: 1; pointer-events: auto; }
        iframe { width: 100%; height: 100%; border: none; background: #fff; }

        @media (max-width: 720px) {
            .strip { padding: 0 16px; }
            .container { padding: 0 16px; }
            .hero { padding-top: 40px; }
            .grid { grid-template-columns: 1fr; }
            .count { display: none; }
            .step { display: none; }
            .back span { display: none; }
            .back { padding: 0 8px; }
            .kbd { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
            .card { opacity: 1; transform: none; }
        }
    </style>
</head>

<body>
    <div class="strip">
        <span><b>Signal</b> Presentation Hub</span>
        <span id="meta"></span>
    </div>

    <!-- 허브 -->
    <section id="hub">
        <div class="container">
            <div class="hero">
                <span class="eyebrow">Presentation Archive</span>
                <h1>AI, 정책, 그리고 삶까지 정리한 <em>발표 자료</em></h1>
            </div>

            <div class="panel">
                <div class="stats" id="stats"></div>
                <div class="dist" id="dist" aria-hidden="true"></div>
            </div>

            <div class="search">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
                <input id="q" type="search" placeholder="발표 제목, 설명, 카테고리 검색..." aria-label="발표 검색" autocomplete="off">
                <span class="kbd">/</span>
            </div>

            <div class="filters">
                <span class="flabel">카테고리</span>
                <div class="pills" id="pills"></div>
                <span class="count" id="count"></span>
            </div>

            <div class="grid" id="grid"></div>
            <div class="empty" id="empty">검색 결과가 없습니다.</div>

            <div class="foot">
                <span>Signal Presentation Hub</span>
                <span>카드를 선택하면 발표가 열립니다 · 검색 단축키 /</span>
            </div>
        </div>
    </section>

    <!-- 뷰어 -->
    <section id="viewer" aria-label="발표 뷰어">
        <div class="bar">
            <button class="back" id="back" type="button" aria-label="허브로 돌아가기">
                <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg><span>Hub</span>
            </button>
            <nav class="rail" id="rail"></nav>
            <div class="step">
                <button id="prev" type="button" aria-label="이전 발표"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg></button>
                <button id="next" type="button" aria-label="다음 발표"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg></button>
            </div>
        </div>
        <div class="stage" id="stage"></div>
    </section>

    <script>
        // 카테고리별 색상
        const CATS = { 'AI': '#7c3aed', '기획': '#b45309', '정책': '#0369a1', '라이프': '#0d9488' };

        // 발표 목록: 새 발표는 여기에 한 줄만 추가하면 카드·탭·뷰어가 자동 생성됨
        const DECKS = [
            { id: 'investing', src: 'ai_agent_investing_presentation.html', cat: 'AI', title: '주식 투자 AI 에이전트', desc: '투자 의사결정에 AI 에이전트를 어떻게 활용할 수 있는지 살펴봅니다.' },
            { id: 'speed', src: 'ai_speed_presentation.html', cat: 'AI', title: 'AI 개발 속도 조절', desc: 'AI로 빨라진 개발 속도를 어떻게 조절하고 관리할지 다룹니다.' },
            { id: 'langgraph', src: 'langgraph_presentation.html', cat: 'AI', title: 'LangGraph 에이전트', desc: '기초부터 엔터프라이즈 고도화까지 이어지는 LangGraph 마스터클래스.' },
            { id: 'nemotron', src: 'nemotron_personas_korea_presentation.html', cat: 'AI', title: 'Nemotron 가상설문', desc: 'Nemotron Personas Korea 기반 가상설문의 활용법과 한계.' },
            { id: 'rnd', src: 'ax_rnd_presentation_3.html', cat: '기획', title: 'AX R&D 기획 혁신', desc: 'AX 전환 흐름에 맞춰 R&D 기획을 혁신하는 방법.' },
            { id: '5poles', src: 'five_poles_three_specialties_presentation.html', cat: '정책', title: '5극 3특 체제', desc: '대한민국 균형발전 대전환, 5극 3특 체제를 완벽하게 이해하기.' },
            { id: 'nepsa', src: 'nepsa_presentation.html', cat: '정책', title: 'NEPSA 과제 우선순위', desc: 'NEPSA 과제의 우선순위를 정리한 발표 자료.' },
            { id: 'safety', src: 'life_safety_act_presentation.html', cat: '정책', title: '생명안전기본법', desc: '생명과 존엄을 위한 새로운 사회계약, 생명안전기본법.' },
            { id: 'life', src: 'balanced_life_presentation.html', cat: '라이프', title: '균형 잡힌 삶', desc: '40대 후반, 일과 삶의 균형을 다시 생각해 봅니다.' }
        ];

        const $ = id => document.getElementById(id);
        const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>';
        const pad = n => String(n + 1).padStart(2, '0');
        const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const color = d => CATS[d.cat] || '#525252';
        const catNames = Object.keys(CATS);

        let filterCat = '전체';
        let currentId = null;

        // ----- 허브 -----
        function renderStats() {
            const stat = (name, n, c) =>
                `<button class="stat${filterCat === name ? ' on' : ''}" type="button" data-cat="${name}">
                    <span class="l"><i class="dot" style="--c:${c}"></i>${name === '전체' ? '총 발표' : name}</span><span class="v">${n}</span></button>`;
            $('stats').innerHTML = stat('전체', DECKS.length, '#161616') +
                catNames.map(c => stat(c, DECKS.filter(d => d.cat === c).length, CATS[c])).join('');
            $('dist').innerHTML = catNames.map(c =>
                `<i style="--c:${CATS[c]};flex:${DECKS.filter(d => d.cat === c).length}"></i>`).join('');
            $('meta').textContent = `${DECKS.length} decks · ${catNames.length} categories`;
        }

        function renderPills() {
            $('pills').innerHTML = ['전체', ...catNames].map(c =>
                `<button class="pill${c === filterCat ? ' on' : ''}" type="button" data-cat="${c}">${c === '전체' ? '' : `<i class="dot" style="--c:${CATS[c]};display:inline-block;margin-right:6px"></i>`}${c}</button>`).join('');
        }

        function renderGrid() {
            const q = $('q').value.trim().toLowerCase();
            const list = DECKS.filter(d =>
                (filterCat === '전체' || d.cat === filterCat) &&
                (!q || (d.title + d.desc + d.cat).toLowerCase().includes(q)));
            $('grid').innerHTML = list.map((d, i) => `
                <button class="card" type="button" data-id="${d.id}" style="--c:${color(d)};--i:${i}">
                    <div class="card-top"><span class="tag">${esc(d.cat)}</span><span class="no">${pad(DECKS.indexOf(d))}</span></div>
                    <h2>${esc(d.title)}</h2>
                    <p>${esc(d.desc)}</p>
                    <div class="open"><span>발표 열기</span>${ARROW}</div>
                </button>`).join('');
            $('empty').classList.toggle('show', list.length === 0);
            $('count').textContent = `${list.length} / ${DECKS.length}`;
        }

        function setCat(c) {
            filterCat = c;
            renderStats();
            renderPills();
            renderGrid();
        }

        // ----- 뷰어 -----
        function buildViewer() {
            $('rail').innerHTML = DECKS.map(d =>
                `<button class="pill" type="button" data-id="${d.id}"><i class="dot" style="--c:${color(d)};display:inline-block;margin-right:6px"></i>${esc(d.title)}</button>`).join('');
            $('stage').innerHTML = DECKS.map(d =>
                `<div class="frame" id="frame-${d.id}"><iframe id="iframe-${d.id}" title="${esc(d.title)}"></iframe></div>`).join('');
        }

        function openDeck(id, push = true) {
            const deck = DECKS.find(d => d.id === id);
            if (!deck) return showHub(push);
            currentId = id;
            document.body.classList.add('viewing');

            document.querySelectorAll('.rail .pill').forEach(p => p.classList.toggle('active', p.dataset.id === id));
            document.querySelectorAll('.frame').forEach(f => f.classList.toggle('active', f.id === `frame-${id}`));
            document.title = `${deck.title} · Signal Hub`;

            // 지연 로딩
            const frame = $(`iframe-${id}`);
            if (!frame.getAttribute('src')) frame.src = deck.src;

            const active = document.querySelector('.rail .pill.active');
            if (active) active.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });

            // 키보드 조작이 바로 되도록 iframe에 포커스
            setTimeout(() => { try { frame.contentWindow.focus(); } catch (e) { } }, 150);

            if (push) history.replaceState(null, '', `#tab=${id}`);
        }

        function showHub(push = true) {
            currentId = null;
            document.body.classList.remove('viewing');
            document.title = 'Signal Presentation Hub';
            if (push) history.replaceState(null, '', '#hub');
        }

        function step(dir) {
            const i = DECKS.findIndex(d => d.id === currentId);
            if (i < 0) return;
            openDeck(DECKS[(i + dir + DECKS.length) % DECKS.length].id);
        }

        function routeFromHash() {
            const m = location.hash.match(/#tab=([^&]+)/);
            m ? openDeck(decodeURIComponent(m[1]), false) : showHub(false);
        }

        // ----- 이벤트 -----
        $('stats').addEventListener('click', e => { const b = e.target.closest('.stat'); if (b) setCat(b.dataset.cat); });
        $('pills').addEventListener('click', e => { const b = e.target.closest('.pill'); if (b) setCat(b.dataset.cat); });
        $('q').addEventListener('input', renderGrid);
        $('grid').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) openDeck(c.dataset.id); });
        $('rail').addEventListener('click', e => { const p = e.target.closest('.pill'); if (p) openDeck(p.dataset.id); });
        $('back').addEventListener('click', () => showHub());
        $('prev').addEventListener('click', () => step(-1));
        $('next').addEventListener('click', () => step(1));

        window.addEventListener('keydown', e => {
            // 허브에서 "/" 또는 Ctrl/⌘+K 로 검색창 포커스
            if (!currentId && e.target !== $('q') && (e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'))) {
                e.preventDefault();
                $('q').focus();
                return;
            }
            // 부모 창에 포커스가 있을 때 누른 키를 활성 iframe으로 전달
            if (!currentId) return;
            try {
                $(`iframe-${currentId}`).contentWindow.dispatchEvent(new KeyboardEvent('keydown', {
                    key: e.key, code: e.code, keyCode: e.keyCode, which: e.which, bubbles: true
                }));
            } catch (err) { }
        });

        window.addEventListener('hashchange', routeFromHash);

        // ----- 시작 -----
        renderStats();
        renderPills();
        renderGrid();
        buildViewer();
        routeFromHash();
    </script>
</body>

</html>
