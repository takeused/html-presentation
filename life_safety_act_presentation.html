<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생명안전기본법: 생명과 존엄을 위한 새로운 사회계약</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
<style>
:root{
  --bg:#090d16;
  --c:#00d4ff;
  --a:#f59e0b;
  --e:#10b981;
  --p:#a78bfa;
  --r:#f43f5e;
  --b:#3b82f6;
  --t:#f1f5f9;
  --mu:#94a3b8;
  --card-bg:rgba(255,255,255,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1920px;
  height:1080px;
  overflow:hidden;
  background:var(--bg);
  font-family:"Pretendard",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color:var(--t);
  user-select:none;
  transform-origin:top left;
}

/* Neon Glows */
.gc{color:var(--c);text-shadow:0 0 24px var(--c),0 0 48px rgba(0,212,255,.45)}
.ga{color:var(--a);text-shadow:0 0 24px var(--a),0 0 48px rgba(245,158,11,.45)}
.ge{color:var(--e);text-shadow:0 0 24px var(--e),0 0 48px rgba(16,185,129,.45)}
.gp{color:var(--p);text-shadow:0 0 24px var(--p),0 0 48px rgba(167,139,250,.45)}
.gr{color:var(--r);text-shadow:0 0 24px var(--r),0 0 48px rgba(244,63,94,.45)}
.gb{color:var(--b);text-shadow:0 0 24px var(--b),0 0 48px rgba(59,130,246,.45)}

/* Glassmorphism */
.glass{
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:24px;
  box-shadow:0 8px 36px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
}
.glass-c{
  background:rgba(0,212,255,.06);
  backdrop-filter:blur(24px);
  border:1px solid rgba(0,212,255,.28);
  border-radius:24px;
  box-shadow:0 0 44px rgba(0,212,255,.12),0 8px 36px rgba(0,0,0,.5);
}
.glass-a{
  background:rgba(245,158,11,.06);
  backdrop-filter:blur(24px);
  border:1px solid rgba(245,158,11,.28);
  border-radius:24px;
  box-shadow:0 0 44px rgba(245,158,11,.12),0 8px 36px rgba(0,0,0,.5);
}
.glass-e{
  background:rgba(16,185,129,.06);
  backdrop-filter:blur(24px);
  border:1px solid rgba(16,185,129,.28);
  border-radius:24px;
  box-shadow:0 0 44px rgba(16,185,129,.12),0 8px 36px rgba(0,0,0,.5);
}
.glass-p{
  background:rgba(167,139,250,.06);
  backdrop-filter:blur(24px);
  border:1px solid rgba(167,139,250,.28);
  border-radius:24px;
  box-shadow:0 0 44px rgba(167,139,250,.12),0 8px 36px rgba(0,0,0,.5);
}
.glass-r{
  background:rgba(244,63,94,.06);
  backdrop-filter:blur(24px);
  border:1px solid rgba(244,63,94,.28);
  border-radius:24px;
  box-shadow:0 0 44px rgba(244,63,94,.12),0 8px 36px rgba(0,0,0,.5);
}
.glass-b{
  background:rgba(59,130,246,.06);
  backdrop-filter:blur(24px);
  border:1px solid rgba(59,130,246,.28);
  border-radius:24px;
  box-shadow:0 0 44px rgba(59,130,246,.12),0 8px 36px rgba(0,0,0,.5);
}

/* Animations */
[data-step]{
  opacity:0;
  transform:translateY(22px);
  transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1);
}
[data-step].revealed{opacity:1;transform:translateY(0)}
[data-step="2"].revealed{transition-delay:.05s}
[data-step="3"].revealed{transition-delay:.1s}
[data-step="4"].revealed{transition-delay:.15s}
[data-step="5"].revealed{transition-delay:.2s}
[data-step="6"].revealed{transition-delay:.25s}

/* Layout Elements */
#blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
#slide{position:relative;z-index:1;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center}
#nav{position:fixed;bottom:24px;right:48px;z-index:100;display:flex;align-items:center;gap:12px;user-select:none}
#nav .nav-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  color:var(--t);
  width:44px;
  height:44px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:20px;
  transition:all .2s ease;
}
#nav .nav-btn:hover{
  background:rgba(0,212,255,.2);
  border-color:var(--c);
  color:var(--c);
  transform:scale(1.06);
}
#nav span{
  color:var(--mu);
  font-size:18px;
  font-weight:600;
  min-width:84px;
  text-align:center;
  cursor:pointer;
  padding:4px 8px;
  border-radius:8px;
  transition:all .2s ease;
}
#nav span:hover{
  background:rgba(255,255,255,.1);
  color:var(--c);
}
#progress{position:fixed;bottom:0;left:0;height:4px;background:linear-gradient(90deg,var(--c),var(--e),var(--a),var(--r),var(--p));z-index:10;transition:width .3s ease}

/* Quick Jump Toast Indicator */
#jump-indicator{
  position:fixed;
  top:36px;
  right:48px;
  z-index:200;
  background:rgba(15,23,42,.92);
  backdrop-filter:blur(16px);
  border:1px solid var(--c);
  box-shadow:0 0 30px rgba(0,212,255,.35);
  border-radius:14px;
  padding:12px 24px;
  display:none;
  align-items:center;
  gap:12px;
  font-size:18px;
  font-weight:600;
  color:var(--t);
  animation:popIn .2s cubic-bezier(.16,1,.3,1);
}
#jump-indicator span{color:var(--c);font-weight:800;font-size:22px}
@keyframes popIn{from{opacity:0;transform:translateY(-10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Jump Modal */
#jump-modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(12px);
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
}
#jump-modal{
  background:rgba(15,23,42,.96);
  border:1px solid rgba(0,212,255,.45);
  box-shadow:0 16px 60px rgba(0,0,0,.8),0 0 50px rgba(0,212,255,.25);
  border-radius:24px;
  padding:36px 44px;
  text-align:center;
  width:440px;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 20px;
  border-radius:100px;
  font-size:14px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:20px;
}
.badge-c{background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.35);color:var(--c)}
.badge-p{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.35);color:var(--p)}
.badge-e{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);color:var(--e)}
.badge-a{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:var(--a)}
.badge-r{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);color:var(--r)}
.badge-b{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:var(--b)}

.slide-content{
  width:1680px;
  height:920px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.slide-header{
  margin-bottom:24px;
}
.slide-header h2{
  font-size:52px;
  font-weight:800;
  letter-spacing:-0.02em;
  line-height:1.2;
}
.slide-header p{
  font-size:22px;
  color:var(--mu);
  margin-top:10px;
  font-weight:400;
}
</style>
</head>
<body>

<div id="blobs">
  <div style="position:absolute;width:1000px;height:1000px;top:-300px;left:-200px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.08) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:900px;height:900px;bottom:-200px;right:-100px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.07) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:750px;height:750px;top:250px;right:25%;border-radius:50%;background:radial-gradient(circle,rgba(244,63,94,.05) 0%,transparent 70%)"></div>
</div>

<div id="slide"></div>

<!-- Quick Jump Toast -->
<div id="jump-indicator">
  <iconify-icon icon="solar:round-alt-arrow-right-bold" style="color:var(--c);font-size:24px"></iconify-icon>
  <span>Go to Page : </span>
  <span id="jump-number">1</span>
  <span style="font-size:14px;color:var(--mu);margin-left:8px">(Enter 또는 자동 이동)</span>
</div>

<!-- Quick Jump Modal -->
<div id="jump-modal-overlay">
  <div id="jump-modal">
    <div style="font-size:24px;font-weight:700;margin-bottom:8px;color:var(--c);display:flex;align-items:center;justify-content:center;gap:8px">
      <iconify-icon icon="solar:routing-2-bold"></iconify-icon> 페이지 바로 이동
    </div>
    <div style="font-size:15px;color:var(--mu);margin-bottom:24px">이동할 슬라이드 번호(1~20)를 입력하세요</div>
    <input type="number" id="modal-page-input" min="1" max="20" placeholder="1~20" style="width:100%;padding:14px 20px;font-size:20px;font-weight:700;text-align:center;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(0,212,255,.4);color:var(--t);outline:none;margin-bottom:24px;box-sizing:border-box;">
    <div style="display:flex;gap:12px;justify-content:center">
      <button id="modal-cancel-btn" style="padding:12px 28px;border-radius:12px;background:rgba(255,255,255,.1);border:none;color:var(--t);font-size:16px;cursor:pointer;font-weight:600">취소</button>
      <button id="modal-jump-btn" style="padding:12px 28px;border-radius:12px;background:var(--c);border:none;color:#000;font-size:16px;cursor:pointer;font-weight:700">이동</button>
    </div>
  </div>
</div>

<div id="nav">
  <button class="nav-btn" id="btn-prev" title="이전 (←, Backspace, P)">◀</button>
  <span id="counter" title="클릭하여 페이지 이동 (단축키: G)">1 / 20</span>
  <button class="nav-btn" id="btn-next" title="다음 (→, Space, Enter, N)">▶</button>
</div>
<div id="progress"></div>

<script>
const slides = [
  // ── 01. 표지 ──
  {

    <div class="slide-content" style="justify-content:center;align-items:center;text-align:center;">

// ── 슬라이드 엔진 & 상태 관리 ──
let cur = 0;
let step = 1;
const slideEl = document.getElementById('slide');
const counterEl = document.getElementById('counter');
const progressEl = document.getElementById('progress');

function render() {
  const s = slides[cur];
  slideEl.innerHTML = s.html;
  counterEl.textContent = (cur + 1) + ' / ' + slides.length;
  progressEl.style.width = (((cur + 1) / slides.length) * 100) + '%';
  step = 1;
  applyStep();
}

function applyStep() {
  const els = slideEl.querySelectorAll('[data-step]');
  els.forEach(el => {
    const st = parseInt(el.getAttribute('data-step'), 10);
    if (st <= step) {
      el.classList.add('revealed');
    } else {
      el.classList.remove('revealed');
    }
  });
}

function go(dir) {
  const s = slides[cur];
  if (dir > 0) {
    if (step < s.n) {
      step++;
      applyStep();
    } else {
      if (cur < slides.length - 1) {
        cur++;
        render();
      }
    }
  } else {
    if (step > 1) {
      step--;
      applyStep();
    } else {
      if (cur > 0) {
        cur--;
        render();
        step = slides[cur].n;
        applyStep();
      }
    }
  }
}

// ── 직접 숫자 입력 점프 시스템 ──
let jumpBuffer = '';
let jumpTimeout = null;
const jumpIndicator = document.getElementById('jump-indicator');
const jumpNumber = document.getElementById('jump-number');

function handleDigitInput(digit) {
  jumpBuffer += digit;
  const pageNum = parseInt(jumpBuffer, 10);

  jumpNumber.textContent = jumpBuffer;
  jumpIndicator.style.display = 'flex';

  if (jumpTimeout) clearTimeout(jumpTimeout);

  if (pageNum > slides.length) {
    jumpNumber.textContent = jumpBuffer + ' (최대 ' + slides.length + 'p)';
    jumpTimeout = setTimeout(clearJumpBuffer, 1200);
    return;
  }

  jumpTimeout = setTimeout(() => {
    goToPage(jumpBuffer);
    clearJumpBuffer();
  }, 1200);
}

function clearJumpBuffer() {
  jumpBuffer = '';
  jumpIndicator.style.display = 'none';
  if (jumpTimeout) {
    clearTimeout(jumpTimeout);
    jumpTimeout = null;
  }
}

function goToPage(numStr) {
  const page = parseInt(numStr, 10);
  if (!isNaN(page) && page >= 1 && page <= slides.length) {
    cur = page - 1;
    render();
  }
}

// ── Quick Jump Modal 시스템 ──
const modalOverlay = document.getElementById('jump-modal-overlay');
const modalInput = document.getElementById('modal-page-input');
const modalJumpBtn = document.getElementById('modal-jump-btn');
const modalCancelBtn = document.getElementById('modal-cancel-btn');

function openJumpModal() {
  clearJumpBuffer();
  modalOverlay.style.display = 'flex';
  modalInput.value = cur + 1;
  modalInput.focus();
  modalInput.select();
}

function closeJumpModal() {
  modalOverlay.style.display = 'none';
  window.focus();
}

modalJumpBtn.addEventListener('click', () => {
  goToPage(modalInput.value);
  closeJumpModal();
});

modalCancelBtn.addEventListener('click', closeJumpModal);

modalOverlay.addEventListener('click', e => {
  if (e.target === modalOverlay) closeJumpModal();
});

modalInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    goToPage(modalInput.value);
    closeJumpModal();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    closeJumpModal();
  }
});

counterEl.addEventListener('click', openJumpModal);

// ── 키보드 이벤트 리스너 ──
window.addEventListener('keydown', e => {
  if (modalOverlay && modalOverlay.style.display === 'flex') return;

  const k = e.key;

  // 1. 숫자 키 (0~9) 입력 시 점프 버퍼 처리
  if (/^[0-9]$/.test(k) && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    handleDigitInput(k);
    return;
  }

  // 2. 점프 버퍼 활성화 중 Enter 누르면 즉시 점프
  if (jumpBuffer.length > 0) {
    if (k === 'Enter') {
      e.preventDefault();
      goToPage(jumpBuffer);
      clearJumpBuffer();
      return;
    } else if (k === 'Escape' || k === 'Backspace') {
      e.preventDefault();
      clearJumpBuffer();
      return;
    }
  }

  // 3. 'G' 또는 'g' 키 누르면 점프 모달 열기
  if (k === 'g' || k === 'G') {
    e.preventDefault();
    openJumpModal();
    return;
  }

  // 4. 일반 내비게이션 키
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter' || k === 'n' || k === 'N' || k === 'j' || k === 'J') {
    e.preventDefault();
    go(1);
  } else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace' || k === 'p' || k === 'P' || k === 'k' || k === 'K') {
    e.preventDefault();
    go(-1);
  } else if (k === 'ArrowDown') {
    e.preventDefault();
    if (cur < slides.length - 1) {
      cur++;
      render();
    }
  } else if (k === 'ArrowUp') {
    e.preventDefault();
    if (cur > 0) {
      cur--;
      render();
    }
  }
}, true);

// ── 마우스 클릭 & 버튼 이벤트 ──
document.getElementById('btn-next').addEventListener('click', e => {
  e.stopPropagation();
  go(1);
});

document.getElementById('btn-prev').addEventListener('click', e => {
  e.stopPropagation();
  go(-1);
});

document.addEventListener('click', e => {
  if (modalOverlay && modalOverlay.style.display === 'flex') return;
  if (!e.target.closest('#nav') && !e.target.closest('button') && !e.target.closest('a') && !e.target.closest('#jump-modal')) {
    go(1);
  }
});

// 마우스 휠 스크롤 지원
let wheelTimeout;
window.addEventListener('wheel', e => {
  if (modalOverlay && modalOverlay.style.display === 'flex') return;
  if (wheelTimeout) return;
  if (e.deltaY > 30) {
    go(1);
    wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 250);
  } else if (e.deltaY < -30) {
    go(-1);
    wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 250);
  }
}, { passive: true });

// ── 화면 스케일링 & 포커스 ──
function scale() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  const tx = (window.innerWidth - 1920 * s) / 2;
  const ty = (window.innerHeight - 1080 * s) / 2;
  document.body.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
}

window.addEventListener('resize', scale);
window.addEventListener('load', () => {
  window.focus();
  document.body.focus();
});

// 초기화
scale();
render();
window.focus();
</script>
