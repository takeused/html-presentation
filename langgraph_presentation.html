<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangGraph 마스터클래스 — 기초부터 엔터프라이즈 고도화까지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090b;
  --t:#f0f0f0;
  --mu:#a1a1aa;
  --c:#00d4ff;  /* Cyan: Tech / Routing */
  --a:#f59e0b;  /* Amber: Node / Warning */
  --e:#10b981;  /* Emerald: Success / Edge */
  --p:#a78bfa;  /* Purple: State / AI */
  --r:#f43f5e;  /* Rose: Loop / Alert */
  --b:#3b82f6;  /* Blue: Enterprise / Cloud */
}
body{
  background:var(--bg);
  color:var(--t);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  overflow:hidden;
  width:1920px;
  height:1080px;
  transform-origin:0 0;
  word-break:keep-all;
  position:relative;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:88px 88px;
  pointer-events:none;
  z-index:0;
}

/* Typography */
.t-hero{font-size:94px;font-weight:800;letter-spacing:-.034em;line-height:1.12}
.t-xl{font-size:70px;font-weight:700;letter-spacing:-.026em;line-height:1.18}
.t-lg{font-size:50px;font-weight:700;letter-spacing:-.020em;line-height:1.24}
.t-md{font-size:36px;font-weight:600;line-height:1.32}
.t-sm{font-size:25px;font-weight:500;line-height:1.45}
.t-xs{font-size:19px;font-weight:400;color:var(--mu);line-height:1.55}

/* Glow Text */
.gc{color:#00d4ff;text-shadow:0 0 28px #00d4ff,0 0 56px rgba(0,212,255,.45)}
.ga{color:#f59e0b;text-shadow:0 0 28px #f59e0b,0 0 56px rgba(245,158,11,.45)}
.ge{color:#10b981;text-shadow:0 0 28px #10b981,0 0 56px rgba(16,185,129,.45)}
.gp{color:#a78bfa;text-shadow:0 0 28px #a78bfa,0 0 56px rgba(167,139,250,.45)}
.gr{color:#f43f5e;text-shadow:0 0 28px #f43f5e,0 0 56px rgba(244,63,94,.45)}
.gb{color:#3b82f6;text-shadow:0 0 28px #3b82f6,0 0 56px rgba(59,130,246,.45)}

/* Glass Cards */
.glass{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.11);
  border-radius:24px;
  box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
}
.glass-c{
  background:rgba(0,212,255,.07);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(0,212,255,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(0,212,255,.12),0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
}
.glass-a{
  background:rgba(245,158,11,.07);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(245,158,11,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(245,158,11,.12),0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
}
.glass-e{
  background:rgba(16,185,129,.07);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(16,185,129,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(16,185,129,.12),0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
}
.glass-p{
  background:rgba(167,139,250,.07);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(167,139,250,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(167,139,250,.12),0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
}
.glass-r{
  background:rgba(244,63,94,.07);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(244,63,94,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(244,63,94,.12),0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
}
.glass-b{
  background:rgba(59,130,246,.07);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(59,130,246,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(59,130,246,.12),0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
}

/* Animations */
[data-step]{
  opacity:0;
  transform:translateY(20px);
  transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1);
}
[data-step].revealed{opacity:1;transform:translateY(0)}
[data-step="2"].revealed{transition-delay:.06s}
[data-step="3"].revealed{transition-delay:.12s}
[data-step="4"].revealed{transition-delay:.18s}
[data-step="5"].revealed{transition-delay:.24s}

/* Layout Elements */
#blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
#slide{position:relative;z-index:1;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center}
#nav{position:fixed;bottom:24px;right:48px;z-index:100;display:flex;align-items:center;gap:12px;user-select:none}
#nav .nav-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  color:var(--t);
  width:44px;
  height:44px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:20px;
  transition:all .2s ease;
}
#nav .nav-btn:hover{
  background:rgba(0,212,255,.2);
  border-color:var(--c);
  color:var(--c);
  transform:scale(1.06);
}
#nav span{color:var(--mu);font-size:18px;font-weight:600;min-width:80px;text-align:center}
#progress{position:fixed;bottom:0;left:0;height:4px;background:linear-gradient(90deg,var(--c),var(--p),var(--b),var(--e));z-index:10;transition:width .3s ease}

.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:7px 20px;
  border-radius:100px;
  font-size:14px;
  font-weight:600;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:24px;
}
.badge-c{background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.35);color:var(--c)}
.badge-p{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.35);color:var(--p)}
.badge-e{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);color:var(--e)}
.badge-a{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:var(--a)}
.badge-b{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:var(--b)}

.tag{
  display:inline-block;
  padding:4px 12px;
  border-radius:8px;
  font-size:14px;
  font-weight:600;
  background:rgba(255,255,255,.1);
}
code{
  font-family:monospace;
  background:rgba(0,0,0,.35);
  padding:2px 6px;
  border-radius:6px;
  color:var(--c);
  font-size:0.92em;
}
</style>
</head>
<body>

<div id="blobs">
  <div style="position:absolute;width:950px;height:950px;top:-280px;left:-200px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.07) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:850px;height:850px;bottom:-200px;right:40px;border-radius:50%;background:radial-gradient(circle,rgba(167,139,250,.06) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:700px;height:700px;top:250px;right:-180px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.05) 0%,transparent 70%)"></div>
</div>

<div id="slide"></div>
<div id="nav">
  <button class="nav-btn" id="btn-prev" title="이전 (← / Backspace)">
    <iconify-icon icon="solar:alt-arrow-left-bold"></iconify-icon>
  </button>
  <span id="counter">1 / 25</span>
  <button class="nav-btn" id="btn-next" title="다음 (→ / Space / Click)">
    <iconify-icon icon="solar:alt-arrow-right-bold"></iconify-icon>
  </button>
</div>
<div id="progress"></div>

<script>

{n:3, html:`

      </p>
      <div class="t-xs">
        순차 실행 시 50초 걸릴 분석을 동시 병렬 실행으로 10초 만에 완수합니다.

  </div>
</div>`},

{n:3, html:`

    <div data-step="1" class="glass-p" style="padding:36px">

      <p class="t-sm" style="margin-bottom:16px">
        작성자 에이전트가 초안을 내놓으면, 비판자(Critic) 에이전트가 반론을 제기하고 수정안을 도출합니다.

        의료, 법률, 금융 등 환각(Hallucination)이 치명적인 도메인에서 정확도를 극적으로 끌어올립니다.
      </div>
    </div>

// ── 슬라이드 엔진 ──
let cur = 0, step = 0;

function applySteps() {
  document.querySelectorAll('[data-step]').forEach(el => {
    const n = parseInt(el.dataset.step);
    const on = n <= step;
    el.classList.toggle('revealed', on);
  });
}

function updateNav() {
  const total = slides.length;
  document.getElementById('counter').textContent = `${cur + 1} / ${total}`;
  document.getElementById('progress').style.width = ((cur) / (total - 1) * 100) + '%';
}

function render() {
  step = 0;
  const sl = slides[cur];
  document.getElementById('slide').innerHTML = sl.html;
  if (sl.after) setTimeout(sl.after, 50);
  applySteps();
  updateNav();
}

function go(d) {
  const max = slides[cur].n || 0;
  if (d === 1) {
    if (step < max) {
      step++;
      applySteps();
      updateNav();
    } else if (cur < slides.length - 1) {
      cur++;
      render();
    }
  } else {
    if (step > 0) {
      step--;
      applySteps();
      updateNav();
    } else if (cur > 0) {
      cur--;
      render();
      step = slides[cur].n || 0;
      applySteps();
      updateNav();
    }
  }
}

// ── 키보드 이벤트 (다양한 브라우저/키 호환) ──
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter' || k === 'n' || k === 'N' || k === 'j' || k === 'J') {
    e.preventDefault();
    go(1);
  } else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace' || k === 'p' || k === 'P' || k === 'k' || k === 'K') {
    e.preventDefault();
    go(-1);
  } else if (k === 'ArrowDown') {
    e.preventDefault();
    if (cur < slides.length - 1) {
      cur++;
      render();
    }
  } else if (k === 'ArrowUp') {
    e.preventDefault();
    if (cur > 0) {
      cur--;
      render();
    }
  }
}, true);

// ── 마우스 클릭 & 버튼 이벤트 ──
document.getElementById('btn-next').addEventListener('click', e => {
  e.stopPropagation();
  go(1);
});

document.getElementById('btn-prev').addEventListener('click', e => {
  e.stopPropagation();
  go(-1);
});

// 슬라이드 화면 클릭 시 다음으로 진행 (버튼 제외)
document.addEventListener('click', e => {
  if (!e.target.closest('#nav') && !e.target.closest('button') && !e.target.closest('a')) {
    go(1);
  }
});

// 마우스 휠 스크롤 지원
let wheelTimeout;
window.addEventListener('wheel', e => {
  if (wheelTimeout) return;
  if (e.deltaY > 30) {
    go(1);
    wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 250);
  } else if (e.deltaY < -30) {
    go(-1);
    wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 250);
  }
}, { passive: true });

// ── 화면 스케일링 & 포커스 ──
function scale() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  const tx = (window.innerWidth - 1920 * s) / 2;
  const ty = (window.innerHeight - 1080 * s) / 2;
  document.body.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
}

window.addEventListener('resize', scale);
window.addEventListener('load', () => {
  window.focus();
  document.body.focus();
});

// 초기화
scale();
render();
window.focus();
</script>
