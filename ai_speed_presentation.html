<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 개발 속도 조절 Presentation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#09090b;--t:#f0f0f0;--mu:#a1a1aa;--c:#00d4ff;--a:#f59e0b;--e:#10b981;--p:#a78bfa}
body{width:1920px;height:1080px;background:var(--bg);color:var(--t);font-family:'Pretendard',sans-serif;overflow:hidden;transform-origin:0 0;word-break:keep-all}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:88px 88px;pointer-events:none;z-index:0}

.t-hero{font-size:112px;font-weight:800;letter-spacing:-.034em}
.t-xl{font-size:80px;font-weight:700;letter-spacing:-.026em}
.t-lg{font-size:60px;font-weight:700;letter-spacing:-.020em}
.t-md{font-size:42px;font-weight:600}
.t-sm{font-size:30px;font-weight:500}
.t-xs{font-size:24px;font-weight:400;color:var(--mu)}

.gc{color:#00d4ff;text-shadow:0 0 28px #00d4ff,0 0 56px rgba(0,212,255,.45)}
.ga{color:#f59e0b;text-shadow:0 0 28px #f59e0b,0 0 56px rgba(245,158,11,.45)}
.ge{color:#10b981;text-shadow:0 0 28px #10b981,0 0 56px rgba(16,185,129,.45)}
.gp{color:#a78bfa;text-shadow:0 0 28px #a78bfa,0 0 56px rgba(167,139,250,.45)}

.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.13);border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.glass-c{background:rgba(0,212,255,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(0,212,255,.32);border-radius:24px;box-shadow:0 0 48px rgba(0,212,255,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(0,212,255,.06),inset 0 1px 0 rgba(255,255,255,.1)}
.glass-a{background:rgba(245,158,11,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(245,158,11,.32);border-radius:24px;box-shadow:0 0 48px rgba(245,158,11,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(245,158,11,.06),inset 0 1px 0 rgba(255,255,255,.1)}
.glass-e{background:rgba(16,185,129,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(16,185,129,.32);border-radius:24px;box-shadow:0 0 48px rgba(16,185,129,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(16,185,129,.06),inset 0 1px 0 rgba(255,255,255,.1)}
.glass-p{background:rgba(167,139,250,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(167,139,250,.32);border-radius:24px;box-shadow:0 0 48px rgba(167,139,250,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(167,139,250,.06),inset 0 1px 0 rgba(255,255,255,.1)}

[data-step]{opacity:0;transform:translateY(22px);transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1)}
[data-step].revealed{opacity:1;transform:translateY(0)}
[data-step="2"].revealed{transition-delay:.08s}
[data-step="3"].revealed{transition-delay:.16s}
[data-step="4"].revealed{transition-delay:.24s}

.badge{display:inline-block;padding:8px 26px;border-radius:100px;background:rgba(0,212,255,.13);border:1px solid rgba(0,212,255,.35);color:var(--c);font-size:24px;font-weight:600;letter-spacing:.14em;margin-bottom:44px}

#blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
#stage{position:relative;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;z-index:1}
#prog{position:fixed;top:0;left:0;height:4px;background:var(--c);box-shadow:0 0 12px var(--c);transition:width .4s ease;z-index:10}
#pg{position:fixed;bottom:32px;right:44px;font-size:24px;color:var(--mu);z-index:10}
</style>
</head>
<body>
<div id="blobs">
  <div style="position:absolute;width:900px;height:900px;top:-280px;left:-280px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.07) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:700px;height:700px;bottom:-180px;right:80px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.055) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:600px;height:600px;top:280px;right:-180px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.045) 0%,transparent 70%)"></div>
</div>
<div id="prog"></div>
<div id="pg"></div>
<div id="stage"><div id="slide"></div></div>
<script>
const slides=[

/* 1. 타이틀 */
{n:0,html:`<div style="width:1500px;text-align:center">
  <div class="badge">AI GOVERNANCE</div>
  <h2 class="t-hero">AI 개발 속도,<br><span class="gc">조절</span>해야 할까</h2>
  <p class="t-sm" style="color:var(--mu);margin-top:40px">혁신과 안전 사이에서 우리가 던져야 할 진짜 질문</p>
</div>`},

/* 2. 왜 지금 논쟁인가 — 3열 피처 카드 */
{n:3,html:`<div style="width:1460px">
  <div class="t-lg" style="text-align:center;margin-bottom:64px">왜 지금 <span class="gc">논쟁</span>이 뜨거운가</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:36px">
    <div data-step="1" class="glass-c" style="padding:52px 48px">
      <iconify-icon icon="solar:rocket-bold" style="font-size:56px;color:var(--c);margin-bottom:28px;display:block"></iconify-icon>
      <div class="t-md gc" style="margin-bottom:20px">빠른 역량 향상</div>
      <div class="t-sm" style="margin-bottom:16px">모델 성능이 짧은 주기로 갱신</div>
      <div class="t-xs">검증보다 출시가 앞서는 경우가 늘고 있다</div>
    </div>
    <div data-step="2" class="glass-a" style="padding:52px 48px">
      <iconify-icon icon="solar:danger-triangle-bold" style="font-size:56px;color:var(--a);margin-bottom:28px;display:block"></iconify-icon>
      <div class="t-md ga" style="margin-bottom:20px">커지는 위험</div>
      <div class="t-sm" style="margin-bottom:16px">오남용 · 오류 · 통제의 문제</div>
      <div class="t-xs">사회 전반에 미치는 영향이 함께 커진다</div>
    </div>
    <div data-step="3" class="glass-e" style="padding:52px 48px">
      <iconify-icon icon="solar:lightbulb-bolt-bold" style="font-size:56px;color:var(--e);margin-bottom:28px;display:block"></iconify-icon>
      <div class="t-md ge" style="margin-bottom:20px">큰 기대 효과</div>
      <div class="t-sm" style="margin-bottom:16px">의료 · 과학 · 재난 대응 혁신</div>
      <div class="t-xs">늦출수록 혜택도 함께 늦어진다</div>
    </div>
  </div>
</div>`},

/* 3. 무엇을 늦추나 — 임팩트 타이포 */
{n:2,html:`<div style="width:1500px;text-align:center">
  <div class="badge">QUESTION</div>
  <h2 class="t-xl">'속도 조절'은 정확히<br><span class="gc">무엇</span>을 늦추자는 말인가</h2>
  <p data-step="1" class="t-md" style="margin-top:52px;color:var(--mu)">모델 개발 · 상용 배포 · 고위험 분야 적용</p>
  <p data-step="2" class="t-sm" style="color:var(--mu);margin-top:24px">어느 단계를 말하는지 구분해야 논의가 성립한다</p>
</div>`},

/* 4. 논쟁의 흐름 — 플로우 다이어그램 */
{n:3,html:`<div style="width:1500px">
  <div class="t-lg" style="text-align:center;margin-bottom:72px">논쟁은 어떻게 <span class="ga">제도</span>로 이어졌나</div>
  <div style="display:flex;align-items:stretch;justify-content:center">
    <div class="glass-c" style="padding:36px 28px;text-align:center;flex:1;border-radius:24px">
      <div class="t-xs">2023.03</div>
      <div class="t-md gc" style="margin:12px 0">공개서한</div>
      <div class="t-xs">개발 6개월 중단 촉구</div>
    </div>
    <div data-step="1" style="display:flex;align-items:center;padding:0 16px"><div class="gc" style="font-size:36px">→</div></div>
    <div data-step="1" class="glass" style="padding:36px 28px;text-align:center;flex:1;border-radius:24px">
      <div class="t-xs">2023.11</div>
      <div class="t-md" style="margin:12px 0">안전 정상회의</div>
      <div class="t-xs">영국 블레츨리 개최</div>
    </div>
    <div data-step="2" style="display:flex;align-items:center;padding:0 16px"><div class="gc" style="font-size:36px">→</div></div>
    <div data-step="2" class="glass" style="padding:36px 28px;text-align:center;flex:1;border-radius:24px">
      <div class="t-xs">2024.08</div>
      <div class="t-md" style="margin:12px 0">EU AI Act</div>
      <div class="t-xs">세계 첫 포괄적 법률 발효</div>
    </div>
    <div data-step="3" style="display:flex;align-items:center;padding:0 16px"><div class="gc" style="font-size:36px">→</div></div>
    <div data-step="3" class="glass-e" style="padding:36px 28px;text-align:center;flex:1;border-radius:24px">
      <div class="t-xs">2026.01</div>
      <div class="t-md ge" style="margin:12px 0">AI 기본법</div>
      <div class="t-xs">한국 시행</div>
    </div>
  </div>
  <div data-step="3" class="t-sm" style="text-align:center;margin-top:60px;color:var(--mu)">'멈추자'는 호소에서 '어떻게 관리할까'라는 제도 논의로 이동했다</div>
</div>`},

/* 5. 조절 찬성 — 4색 2x2 */
{n:4,html:`<div style="width:1440px">
  <div class="t-lg" style="text-align:center;margin-bottom:56px">속도 조절 <span class="gc">찬성</span> 논거</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:36px">
    <div data-step="1" class="glass-c" style="padding:44px 48px">
      <iconify-icon icon="solar:danger-circle-bold" style="font-size:48px;color:var(--c);margin-bottom:22px;display:block"></iconify-icon>
      <div class="t-md gc" style="margin-bottom:14px">위험의 누적</div>
      <div class="t-sm" style="margin-bottom:10px">검증되지 않은 시스템이 먼저 확산</div>
      <div class="t-xs">오류·오남용이 발견되기 전에 피해가 커진다</div>
    </div>
    <div data-step="2" class="glass-a" style="padding:44px 48px">
      <iconify-icon icon="solar:shield-warning-bold" style="font-size:48px;color:var(--a);margin-bottom:22px;display:block"></iconify-icon>
      <div class="t-md ga" style="margin-bottom:14px">안전 연구의 격차</div>
      <div class="t-sm" style="margin-bottom:10px">성능 향상이 안전 연구를 앞선다</div>
      <div class="t-xs">평가·해석 기술이 역량 성장을 따라가지 못한다</div>
    </div>
    <div data-step="3" class="glass-e" style="padding:44px 48px">
      <iconify-icon icon="solar:hourglass-bold" style="font-size:48px;color:var(--e);margin-bottom:22px;display:block"></iconify-icon>
      <div class="t-md ge" style="margin-bottom:14px">사회의 적응 시간</div>
      <div class="t-sm" style="margin-bottom:10px">일자리·교육·법제도 정비에 시간 필요</div>
      <div class="t-xs">변화 속도가 제도 개편 속도를 넘어서면 혼란이 커진다</div>
    </div>
    <div data-step="4" class="glass-p" style="padding:44px 48px">
      <iconify-icon icon="solar:lock-bold" style="font-size:48px;color:var(--p);margin-bottom:22px;display:block"></iconify-icon>
      <div class="t-md gp" style="margin-bottom:14px">통제력 상실 우려</div>
      <div class="t-sm" style="margin-bottom:10px">고도화될수록 예측·통제가 어렵다</div>
      <div class="t-xs">되돌리기 어려운 문제가 생기기 전에 대비해야 한다</div>
    </div>
  </div>
</div>`},

/* 6. 조절 반대 — 수평 아이템 카드 */
{n:3,html:`<div style="width:1400px">
  <div class="t-lg" style="text-align:center;margin-bottom:56px">속도 조절 <span class="ga">반대</span> — 늦추면 치르는 비용</div>
  <div data-step="1" class="glass" style="padding:36px 52px;display:flex;align-items:center;gap:40px;margin-bottom:28px">
    <div class="glass-c" style="padding:20px 28px;border-radius:16px;flex-shrink:0;text-align:center;min-width:190px">
      <div class="gc" style="font-size:28px;font-weight:800">편익 지연</div>
    </div>
    <div style="flex:1">
      <div class="t-sm gc" style="margin-bottom:8px">의료·과학·재난 대응 혜택이 늦어진다</div>
      <div class="t-xs">활용을 기다리는 현장의 문제 해결도 함께 미뤄진다</div>
    </div>
    <div class="gc" style="font-size:36px;font-weight:700;flex-shrink:0">DELAY</div>
  </div>
  <div data-step="2" class="glass" style="padding:36px 52px;display:flex;align-items:center;gap:40px;margin-bottom:28px">
    <div class="glass-a" style="padding:20px 28px;border-radius:16px;flex-shrink:0;text-align:center;min-width:190px">
      <div class="ga" style="font-size:28px;font-weight:800">경쟁력 약화</div>
    </div>
    <div style="flex:1">
      <div class="t-sm ga" style="margin-bottom:8px">국가·기업 간 경쟁에서 뒤처질 수 있다</div>
      <div class="t-xs">기술·인재·투자가 규제가 느슨한 곳으로 이동한다</div>
    </div>
    <div class="ga" style="font-size:36px;font-weight:700;flex-shrink:0">GAP</div>
  </div>
  <div data-step="3" class="glass" style="padding:36px 52px;display:flex;align-items:center;gap:40px">
    <div class="glass-e" style="padding:20px 28px;border-radius:16px;flex-shrink:0;text-align:center;min-width:190px">
      <div class="ge" style="font-size:28px;font-weight:800">실효성 한계</div>
    </div>
    <div style="flex:1">
      <div class="t-sm ge" style="margin-bottom:8px">규제를 우회하거나 해외로 옮기면 무력하다</div>
      <div class="t-xs">오픈소스 확산 시 사실상 통제가 어렵다</div>
    </div>
    <div class="ge" style="font-size:36px;font-weight:700;flex-shrink:0">LEAK</div>
  </div>
</div>`},

/* 7. 격차 개념도 — 라인 차트 */
{n:2,html:`<div style="width:1400px">
  <div class="t-lg" style="text-align:center;margin-bottom:40px">역량과 안전장치의 <span class="ga">격차</span>가 쟁점이다</div>
  <div data-step="1" class="glass" style="padding:48px 64px 40px;width:1400px">
    <div style="display:flex;gap:56px;margin-bottom:24px">
      <span class="t-sm gc">— AI 역량 성장</span>

      <defs><linearGradient id="gradC1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(0,212,255,.22)"/><stop offset="100%" stop-color="rgba(0,212,255,0)"/>

      <polyline class="line-draw" points="60,320 360,300 660,270 960,235 1212,200" fill="none" stroke="var(--a)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" style="transition:stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1) .3s;filter:drop-shadow(0 0 10px rgba(245,158,11,.5))"/>

    </svg>
    <div class="t-xs" style="margin-top:16px">※ 논지 설명을 위한 개념도이며 실측 데이터가 아님</div>
  </div>
</div>`},

/* 8. 잘못된 질문 — 2열 비교 */
{n:3,html:`<div style="width:1440px">
  <div class="t-lg" style="text-align:center;margin-bottom:56px">'멈출까 말까'는 <span class="gc">잘못된 질문</span></div>
  <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:40px;align-items:stretch">
    <div data-step="1" class="glass-a" style="padding:52px 56px">
      <div class="t-md ga" style="margin-bottom:28px">이분법 — Stop or Go</div>

    <div data-step="3" class="glass-e" style="padding:52px 56px">
      <div class="t-md ge" style="margin-bottom:28px">위험 기반 — 어디에, 얼마나</div>
      <div class="t-sm" style="margin-bottom:18px">· 위험이 큰 영역만 엄격하게</div>
      <div class="t-sm" style="margin-bottom:18px">· 나머지 영역은 혁신을 허용</div>
      <div class="t-sm" style="margin-bottom:18px">· 단계별로 검증하며 확대</div>
      <div class="t-xs" style="margin-top:28px">속도가 아닌 위험 수준을 기준으로 삼는다</div>
    </div>

function scale(){const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);const tx=(window.innerWidth-1920*s)/2,ty=(window.innerHeight-1080*s)/2;document.body.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}
window.addEventListener('resize',scale);scale();

let cur=0,step=0;
function applySteps(){document.querySelectorAll('[data-step]').forEach(el=>{const n=parseInt(el.dataset.step),on=n<=step;el.classList.toggle('revealed',on);
el.querySelectorAll('.bar-fill[data-w]').forEach(b=>{b.style.width=on?b.dataset.w:'0%'});
el.querySelectorAll('.ring-fill[data-v]').forEach(r=>{const C=2*Math.PI*r.r.baseVal.value;r.style.strokeDasharray=C;r.style.strokeDashoffset=on?C*(1-parseFloat(r.dataset.v)/100):C});
el.querySelectorAll('.line-draw').forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=on?0:L});
el.querySelectorAll('.dot-pop').forEach(d=>{d.style.opacity=on?1:0})})}
function updateNav(){const pb=document.getElementById('prog');if(pb)pb.style.width=((cur+1)/slides.length*100)+'%';const pg=document.getElementById('pg');if(pg)pg.textContent=(cur+1)+' / '+slides.length}
function render(){step=0;const sl=slides[cur];document.getElementById('slide').innerHTML=sl.html;if(sl.after)setTimeout(sl.after,50);applySteps();updateNav()}
function go(d){const max=slides[cur].n;if(d===1){if(step<max){step++;applySteps();updateNav()}else if(cur<slides.length-1){cur++;render()}}else{if(step>0){step--;applySteps();updateNav()}else if(cur>0){cur--;render();step=slides[cur].n;applySteps();updateNav()}}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}else if(e.key==='ArrowDown'){e.preventDefault();if(cur<slides.length-1){cur++;render()}}else if(e.key==='ArrowUp'){e.preventDefault();if(cur>0){cur--;render()}}});
render();
</script>
</body>
</html>
