<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AX 전환에 맞춘 R&D 기획 혁신</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
<style>
:root{--bg:#09090b;--t:#f0f0f0;--mu:#a1a1aa;--c:#00d4ff;--a:#f59e0b;--e:#10b981;--p:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Pretendard',sans-serif;color:var(--t)}
body{width:1920px;height:1080px;transform-origin:0 0;position:relative;word-break:keep-all}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:88px 88px;pointer-events:none;z-index:0}
#blobs{position:fixed;inset:0;z-index:0;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1}
.t-hero{font-size:112px;font-weight:800;letter-spacing:-.034em;line-height:1.05}
.t-xl{font-size:80px;font-weight:700;letter-spacing:-.026em}
.t-lg{font-size:60px;font-weight:700;letter-spacing:-.020em}
.t-md{font-size:42px;font-weight:600}
.t-sm{font-size:30px;font-weight:500}
.t-xs{font-size:24px;font-weight:400;color:var(--mu)}
.gc{color:#00d4ff;text-shadow:0 0 28px #00d4ff,0 0 56px rgba(0,212,255,.45)}
.ga{color:#f59e0b;text-shadow:0 0 28px #f59e0b,0 0 56px rgba(245,158,11,.45)}
.ge{color:#10b981;text-shadow:0 0 28px #10b981,0 0 56px rgba(16,185,129,.45)}
.gp{color:#a78bfa;text-shadow:0 0 28px #a78bfa,0 0 56px rgba(167,139,250,.45)}
.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.13);border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.glass-c{background:rgba(0,212,255,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(0,212,255,.32);border-radius:24px;box-shadow:0 0 48px rgba(0,212,255,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(0,212,255,.06),inset 0 1px 0 rgba(255,255,255,.1)}
.glass-a{background:rgba(245,158,11,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(245,158,11,.32);border-radius:24px;box-shadow:0 0 48px rgba(245,158,11,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(245,158,11,.06),inset 0 1px 0 rgba(255,255,255,.1)}
.glass-e{background:rgba(16,185,129,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(16,185,129,.32);border-radius:24px;box-shadow:0 0 48px rgba(16,185,129,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(16,185,129,.06),inset 0 1px 0 rgba(255,255,255,.1)}
.glass-p{background:rgba(167,139,250,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(167,139,250,.32);border-radius:24px;box-shadow:0 0 48px rgba(167,139,250,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(167,139,250,.06),inset 0 1px 0 rgba(255,255,255,.1)}
[data-step]{opacity:0;transform:translateY(22px);transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1)}
[data-step].revealed{opacity:1;transform:translateY(0)}
[data-step="2"].revealed{transition-delay:.08s}
[data-step="3"].revealed{transition-delay:.16s}
[data-step="4"].revealed{transition-delay:.24s}
.badge{display:inline-block;padding:8px 26px;border-radius:100px;background:rgba(0,212,255,.13);border:1px solid rgba(0,212,255,.35);color:var(--c);font-size:14px;font-weight:600;letter-spacing:.14em;margin-bottom:44px}
#prog{position:fixed;bottom:0;left:0;height:4px;background:linear-gradient(90deg,var(--c),var(--e));z-index:10;transition:width .4s ease;box-shadow:0 0 12px rgba(0,212,255,.5)}
#pg{position:fixed;bottom:24px;right:40px;font-size:18px;color:var(--mu);z-index:10;font-weight:500}
</style>
</head>
<body>
<div id="blobs">
  <div style="position:absolute;width:900px;height:900px;top:-280px;left:-280px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.07) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:700px;height:700px;bottom:-180px;right:80px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.055) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:600px;height:600px;top:280px;right:-180px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.045) 0%,transparent 70%)"></div>
</div>
<div id="stage"><div id="slide"></div></div>
<div id="prog"></div>
<div id="pg"></div>
<script>
const slides=[
// 1 타이틀
{n:2,html:`<div style="text-align:center;width:1500px">
  <div class="badge" data-step="1">AI TRANSFORMATION · R&D PLANNING</div>
  <h1 class="t-hero" data-step="1">AX 전환에 맞춘<br><span class="gc">R&D 기획 혁신</span></h1>
  <p class="t-sm" data-step="2" style="color:var(--mu);margin-top:40px">데이터와 AI가 주도하는 차세대 연구개발 기획 패러다임</p>
  <p class="t-xs" data-step="2" style="margin-top:14px">국가연구개발 기획 혁신 전략</p>
</div>`},
// 2 AX란 무엇인가 (임팩트 타이포)
{n:3,html:`<div style="text-align:center;width:1400px">
  <div class="badge" data-step="1">WHAT IS AX</div>
  <h2 class="t-xl" data-step="1">AX는 <span class="gc">도구가 아니라</span></h2>
  <h2 class="t-hero" data-step="2" style="margin-top:24px"><span class="ge">일하는 방식의 전환</span></h2>
  <p class="t-sm" data-step="3" style="color:var(--mu);margin-top:40px">AI를 R&D 기획 전 과정에 내재화하여</p>
  <p class="t-sm" data-step="3" style="color:var(--mu);margin-top:8px">의사결정의 속도·정밀도·객관성을 근본적으로 끌어올린다</p>
</div>`},
// 3 기존 기획 한계 (3열 피처)
{n:3,html:`<div style="width:1500px">
  <h2 class="t-lg" data-step="1" style="text-align:center;margin-bottom:56px">기존 R&D 기획의 <span class="ga">구조적 한계</span></h2>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:36px">
    <div data-step="1" class="glass-a" style="padding:52px 48px">
      <iconify-icon icon="solar:document-text-bold" style="font-size:56px;color:var(--a);margin-bottom:28px;display:block"></iconify-icon>
      <div class="t-md ga" style="margin-bottom:20px">경험 의존</div>
      <div class="t-sm" style="margin-bottom:8px">소수 전문가의 직관과 관행 중심</div>
      <div class="t-xs">근거 데이터 부족으로 재현성 저하</div>
    </div>
    <div data-step="2" class="glass-a" style="padding:52px 48px">
      <iconify-icon icon="solar:clock-circle-bold" style="font-size:56px;color:var(--a);margin-bottom:28px;display:block"></iconify-icon>
      <div class="t-md ga" style="margin-bottom:20px">긴 기획 주기</div>
      <div class="t-sm" style="margin-bottom:8px">자료 수집·분석에 수개월 소요</div>
      <div class="t-xs">기술 변화 속도를 따라가지 못함</div>
    </div>
    <div data-step="3" class="glass-a" style="padding:52px 48px">
      <iconify-icon icon="solar:eye-closed-bold" style="font-size:56px;color:var(--a);margin-bottom:28px;display:block"></iconify-icon>
      <div class="t-md ga" style="margin-bottom:20px">사후 평가</div>
      <div class="t-sm" style="margin-bottom:8px">기획 후 결과로만 성패 확인</div>
      <div class="t-xs">실시간 보정·피드백 부재</div>
    </div>
  </div>
</div>`},
// 4 패러다임 전환 (2열 비교)
{n:3,html:`<div style="width:1500px">
  <h2 class="t-lg" data-step="1" style="text-align:center;margin-bottom:56px">기획 패러다임의 <span class="gc">전환</span></h2>
  <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:40px;align-items:stretch">
    <div data-step="1" class="glass-a" style="padding:52px 56px">
      <div class="t-md ga" style="margin-bottom:28px">AS-IS · 인력 주도</div>
      <div class="t-sm" style="margin-bottom:18px">· 경험·직관 기반 의사결정</div>
      <div class="t-sm" style="margin-bottom:18px">· 정적 보고서 중심 산출물</div>
      <div class="t-sm">· 선형적·단발성 기획 절차</div>
    </div>
    <div data-step="2" style="display:flex;align-items:center"><span class="gc" style="font-size:64px">→</span></div>
    <div data-step="3" class="glass-e" style="padding:52px 56px">
      <div class="t-md ge" style="margin-bottom:28px">TO-BE · AI 협업</div>
      <div class="t-sm" style="margin-bottom:18px">· 데이터·근거 기반 의사결정</div>
      <div class="t-sm" style="margin-bottom:18px">· 동적 시뮬레이션·예측 산출물</div>
      <div class="t-sm">· 순환적·실시간 피드백 기획</div>
    </div>
  </div>
</div>`},
// 5 3대 핵심 원칙 (3열 피처)
{n:3,html:`<div style="width:1500px">
  <div class="badge" data-step="1" style="display:block;text-align:center;margin:0 auto 44px;width:fit-content">CORE PRINCIPLES</div>
  <h2 class="t-lg" data-step="1" style="text-align:center;margin-bottom:52px">AX 기반 기획 <span class="gc">3대 원칙</span></h2>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:36px">
    <div data-step="1" class="glass-c" style="padding:52px 48px">
      <iconify-icon icon="solar:database-bold" style="font-size:56px;color:var(--c);margin-bottom:28px;display:block"></iconify-icon>
      <div class="t-md gc" style="margin-bottom:20px">데이터 기반</div>
      <div class="t-sm">정량 근거로 우선순위와 투자 방향을 결정</div>
    </div>
    <div data-step="2" class="glass-e" style="padding:52px 48px">
      <iconify-icon icon="solar:users-group-rounded-bold" style="font-size:56px;color:var(--e);margin-bottom:28px;display:block"></iconify-icon>
      <div class="t-md ge" style="margin-bottom:20px">AI 협업 기획</div>
      <div class="t-sm">생성형 AI와 인간 전문가의 역할 분담·증강</div>
    </div>
    <div data-step="3" class="glass-p" style="padding:52px 48px">
      <iconify-icon icon="solar:refresh-circle-bold" style="font-size:56px;color:var(--p);margin-bottom:28px;display:block"></iconify-icon>
      <div class="t-md gp" style="margin-bottom:20px">실시간 피드백</div>
      <div class="t-sm">기획 전 과정에서 즉각적 보정·재기획</div>
    </div>
  </div>
</div>`},
// 6 데이터 기반 의사결정 (Large Metric)
{n:3,html:`<div style="display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:stretch;width:1500px">
  <div class="glass" style="padding:56px 64px;display:flex;flex-direction:column;justify-content:center">
    <div class="t-md gc" data-step="1" style="margin-bottom:28px">데이터 기반 의사결정</div>
    <div class="t-sm" data-step="1" style="padding-left:20px;border-left:3px solid rgba(0,212,255,.4);margin-bottom:24px">논문·특허·정책 데이터의 자동 수집·분석</div>
    <div class="t-sm" data-step="2" style="padding-left:20px;border-left:3px solid rgba(0,212,255,.4);margin-bottom:24px">기술 성숙도·시장성 정량 스코어링</div>
    <div class="t-sm" data-step="3" style="padding-left:20px;border-left:3px solid rgba(0,212,255,.4)">기획 근거의 추적·재현 가능성 확보</div>
  </div>
  <div data-step="2" class="glass-c" style="padding:64px;display:flex;flex-direction:column;justify-content:center;align-items:center">
    <div class="t-xs" style="margin-bottom:18px">기획 분석 데이터 처리량</div>
    <div class="gc" style="font-size:100px;font-weight:800;line-height:1">10×↑</div>
    <div class="t-md" style="margin-top:20px;color:var(--mu)">수작업 대비 분석 범위 확대 (가정치)</div>
  </div>
</div>`},
// 7 AI 협업 기획 프로세스 (플로우)
{n:4,html:`<div style="width:1520px">
  <h2 class="t-lg" data-step="1" style="text-align:center;margin-bottom:60px">AI 협업 <span class="ge">기획 프로세스</span></h2>
  <div style="display:flex;align-items:center;justify-content:center">
    <div class="glass-c" style="padding:32px 36px;text-align:center;flex-shrink:0;min-width:230px;border-radius:24px">
      <iconify-icon icon="solar:magnifer-bold" style="font-size:44px;color:var(--c);margin-bottom:14px;display:block"></iconify-icon>

    </div>
    <div data-step="1" style="display:flex;flex-direction:column;align-items:center;padding:0 14px">
      <div class="gc" style="font-size:36px">→</div></div>
    <div data-step="1" class="glass" style="padding:32px 36px;text-align:center;flex-shrink:0;min-width:230px;border-radius:24px">
      <iconify-icon icon="solar:chart-2-bold" style="font-size:44px;color:var(--e);margin-bottom:14px;display:block"></iconify-icon>
      <div class="t-sm ge">분석·예측</div><div class="t-xs" style="margin-top:6px">시나리오 시뮬레이션</div>
    </div>
    <div data-step="2" style="display:flex;flex-direction:column;align-items:center;padding:0 14px">
      <div class="gc" style="font-size:36px">→</div></div>
    <div data-step="2" class="glass" style="padding:32px 36px;text-align:center;flex-shrink:0;min-width:230px;border-radius:24px">
      <iconify-icon icon="solar:users-group-rounded-bold" style="font-size:44px;color:var(--p);margin-bottom:14px;display:block"></iconify-icon>
      <div class="t-sm gp">검증·판단</div><div class="t-xs" style="margin-top:6px">전문가 의사결정</div>
    </div>
    <div data-step="3" style="display:flex;flex-direction:column;align-items:center;padding:0 14px">
      <div class="gc" style="font-size:36px">→</div></div>
    <div data-step="3" class="glass-e" style="padding:32px 36px;text-align:center;flex-shrink:0;min-width:230px;border-radius:24px">
      <iconify-icon icon="solar:refresh-bold" style="font-size:44px;color:var(--e);margin-bottom:14px;display:block"></iconify-icon>
      <div class="t-sm ge">실행·보정</div><div class="t-xs" style="margin-top:6px">실시간 피드백</div>
    </div>
  </div>
  <p class="t-xs" data-step="4" style="text-align:center;margin-top:48px">AI는 탐색·분석을 가속하고, 인간 전문가는 가치판단과 전략적 결정을 담당</p>

// 8 Before/After 비교 (2열 비교 — 다른 내용)
{n:3,html:`<div style="width:1500px">
  <h2 class="t-lg" data-step="1" style="text-align:center;margin-bottom:56px">기획 산출물의 <span class="ge">진화</span></h2>
  <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:40px;align-items:stretch">
    <div data-step="1" class="glass-a" style="padding:52px 56px">
      <iconify-icon icon="solar:file-text-bold" style="font-size:50px;color:var(--a);margin-bottom:24px;display:block"></iconify-icon>

    <div data-step="2" style="display:flex;align-items:center"><span class="gc" style="font-size:64px">→</span></div>
    <div data-step="3" class="glass-e" style="padding:52px 56px">
      <iconify-icon icon="solar:graph-new-bold" style="font-size:50px;color:var(--e);margin-bottom:24px;display:block"></iconify-icon>

// 9 도입 효과 (바차트)
{n:4,html:`<div style="width:1320px">
  <h2 class="t-lg" data-step="1" style="text-align:center;margin-bottom:20px">AX 기획 도입 <span class="gc">기대효과</span></h2>
  <p class="t-xs" data-step="1" style="text-align:center;margin-bottom:52px">기존 기획 방식 대비 개선 수준 (목표·가정치)</p>

    <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span class="t-sm">기획 소요 기간 단축</span><span class="t-sm gc">60%</span></div>

  </div>
  <div data-step="2" style="margin-bottom:40px">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span class="t-sm">분석 데이터 범위 확대</span><span class="t-sm ge">85%</span></div>
    <div class="t-xs" style="margin-bottom:10px">전수 분석 기반 사각지대 최소화</div>
    <div style="height:28px;background:rgba(255,255,255,.06);border-radius:14px;overflow:hidden"><div class="bar-fill" data-w="85%" style="height:100%;width:0%;background:linear-gradient(90deg,var(--e),rgba(16,185,129,.5));border-radius:14px;transition:width 1.2s cubic-bezier(.16,1,.3,1) .1s;box-shadow:0 0 16px rgba(16,185,129,.35)"></div></div>
  </div>
  <div data-step="3" style="margin-bottom:40px">

let cur=0,step=0;
function applySteps(){document.querySelectorAll('[data-step]').forEach(el=>{const n=parseInt(el.dataset.step),on=n<=step;el.classList.toggle('revealed',on);el.querySelectorAll('.bar-fill[data-w]').forEach(b=>{b.style.width=on?b.dataset.w:'0%'})})}
function updateNav(){document.getElementById('prog').style.width=((cur+1)/slides.length*100)+'%';document.getElementById('pg').textContent=(cur+1)+' / '+slides.length}
function render(){step=0;const sl=slides[cur];document.getElementById('slide').innerHTML=sl.html;applySteps();updateNav()}
function go(d){const max=slides[cur].n;if(d===1){if(step<max){step++;applySteps();updateNav()}else if(cur<slides.length-1){cur++;render()}}else{if(step>0){step--;applySteps();updateNav()}else if(cur>0){cur--;render();step=slides[cur].n;applySteps();updateNav()}}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}else if(e.key==='ArrowDown'){e.preventDefault();if(cur<slides.length-1){cur++;render()}}else if(e.key==='ArrowUp'){e.preventDefault();if(cur>0){cur--;render()}}});
function scale(){const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);const tx=(window.innerWidth-1920*s)/2,ty=(window.innerHeight-1080*s)/2;document.body.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}
window.addEventListener('resize',scale);scale();
render();
</script>
</body>
