<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEV & 로컬 판정모델 (LAYA / JevK5) — 개념, 활용, 장단점 비교 및 한국어 최적화</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090b;
  --t:#f0f0f0;
  --mu:#a1a1aa;
  --c:#00d4ff;  /* Cyan: 코어 기술 / 속도 / Choice */
  --a:#f59e0b;  /* Amber: 주의 / 벤치마크 / Score */
  --e:#10b981;  /* Emerald: 성능 / 비즈니스 효과 / Noul */
  --p:#a78bfa;  /* Purple: AI 모델 / 아키텍처 / System One */
  --r:#f43f5e;  /* Rose: 문제점 / 보안 / 가드레일 */
  --b:#3b82f6;  /* Blue: 엔터프라이즈 / 클라우드 / 통합 */
}
body{
  background:var(--bg);
  color:var(--t);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  overflow:hidden;
  width:1920px;
  height:1080px;
  transform-origin:0 0;
  word-break:keep-all;
  position:relative;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:88px 88px;
  pointer-events:none;
  z-index:0;
}

/* Typography */
.t-hero{font-size:94px;font-weight:800;letter-spacing:-.034em;line-height:1.12}
.t-xl{font-size:68px;font-weight:700;letter-spacing:-.026em;line-height:1.18}
.t-lg{font-size:48px;font-weight:700;letter-spacing:-.020em;line-height:1.24}
.t-md{font-size:32px;font-weight:600;line-height:1.32}
.t-sm{font-size:24px;font-weight:500;line-height:1.45}
.t-xs{font-size:18px;font-weight:400;color:var(--mu);line-height:1.55}

/* Glow Text */
.gc{color:#00d4ff;text-shadow:0 0 28px #00d4ff,0 0 56px rgba(0,212,255,.45)}
.ga{color:#f59e0b;text-shadow:0 0 28px #f59e0b,0 0 56px rgba(245,158,11,.45)}
.ge{color:#10b981;text-shadow:0 0 28px #10b981,0 0 56px rgba(16,185,129,.45)}
.gp{color:#a78bfa;text-shadow:0 0 28px #a78bfa,0 0 56px rgba(167,139,250,.45)}
.gr{color:#f43f5e;text-shadow:0 0 28px #f43f5e,0 0 56px rgba(244,63,94,.45)}
.gb{color:#3b82f6;text-shadow:0 0 28px #3b82f6,0 0 56px rgba(59,130,246,.45)}

/* Glass Cards */
.glass{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.11);
  border-radius:24px;
  box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
}
.glass-c{
  background:rgba(0,212,255,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(0,212,255,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(0,212,255,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-a{
  background:rgba(245,158,11,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(245,158,11,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(245,158,11,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-e{
  background:rgba(16,185,129,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(16,185,129,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(16,185,129,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-p{
  background:rgba(167,139,250,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(167,139,250,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(167,139,250,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-r{
  background:rgba(244,63,94,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(244,63,94,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(244,63,94,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-b{
  background:rgba(59,130,246,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(59,130,246,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(59,130,246,.12),0 8px 40px rgba(0,0,0,.5);
}

/* Animations */
[data-step]{
  opacity:0;
  transform:translateY(20px);
  transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1);
}
[data-step].revealed{opacity:1;transform:translateY(0)}
[data-step="2"].revealed{transition-delay:.06s}
[data-step="3"].revealed{transition-delay:.12s}
[data-step="4"].revealed{transition-delay:.18s}
[data-step="5"].revealed{transition-delay:.24s}

/* Layout Elements */
#blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
#slide{position:relative;z-index:1;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center}
#nav{position:fixed;bottom:24px;right:48px;z-index:100;display:flex;align-items:center;gap:12px;user-select:none}
#nav .nav-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  color:var(--t);
  width:44px;
  height:44px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:20px;
  transition:all .2s ease;
}
#nav .nav-btn:hover{
  background:rgba(0,212,255,.2);
  border-color:var(--c);
  color:var(--c);
  transform:scale(1.06);
}
#nav span{
  color:var(--mu);
  font-size:18px;
  font-weight:600;
  min-width:84px;
  text-align:center;
  cursor:pointer;
  padding:4px 8px;
  border-radius:8px;
  transition:all .2s ease;
}
#nav span:hover{
  background:rgba(255,255,255,.1);
  color:var(--c);
}
#progress{position:fixed;bottom:0;left:0;height:4px;background:linear-gradient(90deg,var(--c),var(--p),var(--a),var(--e));z-index:10;transition:width .3s ease}

/* Quick Jump Toast Indicator */
#jump-indicator{
  position:fixed;
  top:36px;
  right:48px;
  z-index:200;
  background:rgba(19,27,49,.92);
  backdrop-filter:blur(16px);
  border:1px solid var(--c);
  box-shadow:0 0 30px rgba(0,212,255,.35);
  border-radius:14px;
  padding:12px 24px;
  display:none;
  align-items:center;
  gap:12px;
  font-size:18px;
  font-weight:600;
  color:#fff;
  letter-spacing:-.01em;
}

/* Quick Jump Modal */
#jump-modal-overlay{
  position:fixed;
  inset:0;
  z-index:999;
  background:rgba(9,9,11,.75);
  backdrop-filter:blur(12px);
  display:none;
  align-items:center;
  justify-content:center;
}
#jump-modal{
  width:440px;
  background:rgba(18,24,38,.92);
  border:1px solid rgba(0,212,255,.35);
  box-shadow:0 16px 50px rgba(0,0,0,.7),0 0 40px rgba(0,212,255,.2);
  border-radius:24px;
  padding:36px 32px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}
#jump-modal input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:24px;
  font-weight:700;
  text-align:center;
  outline:none;
  transition:border .2s;
}
#jump-modal input:focus{
  border-color:var(--c);
  box-shadow:0 0 16px rgba(0,212,255,.3);
}
#modal-jump-btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:linear-gradient(135deg,var(--c),var(--p));
  color:#000;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  transition:transform .15s,opacity .15s;
}
#modal-jump-btn:hover{
  opacity:.9;
  transform:scale(1.02);
}

/* Tag / Badge */
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 18px;
  border-radius:999px;
  font-size:16px;
  font-weight:600;
  letter-spacing:.02em;
  text-transform:uppercase;
}
.badge-c{background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.35);color:var(--c)}
.badge-p{background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.35);color:var(--p)}
.badge-a{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);color:var(--a)}
.badge-e{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);color:var(--e)}
.badge-r{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.35);color:var(--r)}

/* Code Styling */
code.inline{
  font-family:'Consolas','Courier New',monospace;
  background:rgba(255,255,255,.1);
  padding:3px 8px;
  border-radius:6px;
  color:#00d4ff;
  font-size:.9em;
}
pre.codebox{
  font-family:'Consolas','Courier New',monospace;
  background:rgba(10,14,24,.85);
  border:1px solid rgba(255,255,255,.15);
  border-radius:16px;
  padding:24px;
  color:#e2e8f0;
  font-size:18px;
  line-height:1.6;
  overflow-x:auto;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.5);
}
.kw{color:#f43f5e;font-weight:600}
.fn{color:#00d4ff}
.str{color:#10b981}
.num{color:#f59e0b}
.com{color:#64748b;font-style:italic}
.type{color:#a78bfa}
</style>
</head>
<body>
<div id="blobs"></div>
<div id="slide"></div>

<!-- Quick Jump Toast -->
<div id="jump-indicator">
  <iconify-icon icon="solar:round-alt-arrow-right-bold" style="color:var(--c);font-size:24px"></iconify-icon>
  <span>Go to Page : </span>
  <span id="jump-number" style="color:var(--c);font-weight:800;font-size:22px">1</span>
</div>

<!-- Quick Jump Modal -->
<div id="jump-modal-overlay">
  <div id="jump-modal">
    <div style="font-size:22px;font-weight:700;color:var(--c);display:flex;align-items:center;gap:10px">
      <iconify-icon icon="solar:compass-bold" style="font-size:26px"></iconify-icon>
      페이지 바로 이동
    </div>
    <div style="font-size:14px;color:var(--mu);text-align:center">1부터 17 사이의 슬라이드 번호를 입력하세요</div>
    <input type="number" id="modal-page-input" min="1" max="17" placeholder="예: 7">
    <button id="modal-jump-btn">이동하기</button>
  </div>
</div>

<!-- Controls -->
<div id="nav">
  <button class="nav-btn" id="btn-prev" title="이전 (←, Backspace)">◀</button>
  <span id="counter" title="클릭하여 페이지 점프">1 / 17</span>
  <button class="nav-btn" id="btn-next" title="다음 (→, Space)">▶</button>
</div>
<div id="progress"></div>

<script>
// 슬라이드 데이터 정의 (총 17장) - [주의: 백틱 내부 백틱 절대 금지!]
const slides = [
  // ── 1. 표지 (Cover) ──
  {
    n: 1,
    html: '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 80px;height:100%">' +
      '<div class="badge badge-c" style="margin-bottom:32px">' +
        '<iconify-icon icon="solar:bolt-circle-bold" style="font-size:22px"></iconify-icon>' +
        '<span>Next-Gen System One Decision AI — 2026</span>' +
      '</div>' +
      '<div class="t-hero" style="margin-bottom:28px">' +
        '글을 쓰는 AI에서,<br><span class="gc">판단하는 AI</span>로의 대전환' +
      '</div>' +
      '<div class="t-md" style="color:var(--mu);font-weight:400;max-width:1200px;margin-bottom:56px;line-height:1.5">' +
        '<strong style="color:#fff">JEV · 로컬 판정모델 LAYA · 오픈엔진 JevK5</strong> 완벽 해부<br>' +
        '개념 비교, 로컬 온프레미스 구축, 한국어 NLU 적합성 평가 및 3-Tier 엔터프라이즈 아키텍처' +
      '</div>' +
      '<div style="display:flex;gap:24px">' +
        '<div class="glass-c" style="padding:18px 32px;display:flex;align-items:center;gap:14px">' +
          '<iconify-icon icon="solar:cpu-bolt-bold" style="color:var(--c);font-size:32px"></iconify-icon>' +
          '<span style="font-size:22px;font-weight:600">20~40ms 초저지연 연산</span>' +
        '</div>' +
        '<div class="glass-e" style="padding:18px 32px;display:flex;align-items:center;gap:14px">' +
          '<iconify-icon icon="solar:shield-check-bold" style="color:var(--e);font-size:32px"></iconify-icon>' +
          '<span style="font-size:22px;font-weight:600">100% 로컬 망분리 보안</span>' +
        '</div>' +
        '<div class="glass-a" style="padding:18px 32px;display:flex;align-items:center;gap:14px">' +
          '<iconify-icon icon="solar:wallet-money-bold" style="color:var(--a);font-size:32px"></iconify-icon>' +
          '<span style="font-size:22px;font-weight:600">API 비용 95% 절감</span>' +
        '</div>' +
      '</div>' +
    '</div>'
  },

  // ── 2. 도입: 생성형 LLM의 보틀넥 ──
  {
    n: 3,
    html: '<div style="width:1600px;display:flex;flex-direction:column;gap:36px">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-end">' +
        '<div>' +
          '<div class="badge badge-r" style="margin-bottom:14px">THE BOTTLENECK OF GENERATIVE AI</div>' +
          '<div class="t-xl">모든 문제에 <span class="gr">거대 생성 LLM</span>을 쓰는 것이 정답일까?</div>' +
        '</div>' +
        '<div style="color:var(--mu);font-size:20px">소프트웨어 백엔드의 90%는 긴 문장이 아닌 즉각적인 판단을 요구합니다</div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:28px">' +
        '<div class="glass-r" data-step="1" style="padding:40px 34px;display:flex;flex-direction:column;gap:18px">' +
          '<div style="width:60px;height:60px;border-radius:18px;background:rgba(244,63,94,.15);display:flex;align-items:center;justify-content:center">' +
            '<iconify-icon icon="solar:hourglass-line-bold" style="color:var(--r);font-size:34px"></iconify-icon>' +

          '</div>' +
        '</div>' +
        '<div class="glass-a" data-step="2" style="padding:40px 34px;display:flex;flex-direction:column;gap:18px">' +
          '<div style="width:60px;height:60px;border-radius:18px;background:rgba(245,158,11,.15);display:flex;align-items:center;justify-content:center">' +
            '<iconify-icon icon="solar:dollar-minimalistic-bold" style="color:var(--a);font-size:34px"></iconify-icon>' +

          '</div>' +
        '</div>' +
        '<div class="glass" data-step="3" style="padding:40px 34px;display:flex;flex-direction:column;gap:18px">' +
          '<div style="width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center">' +
            '<iconify-icon icon="solar:danger-triangle-bold" style="color:#cbd5e1;font-size:34px"></iconify-icon>' +
          '</div>' +
          '<div class="t-md" style="color:#fff">비결정론적 출력 불안정성</div>' +
          '<div class="t-sm" style="color:var(--mu);line-height:1.6">' +
            '장황한 서두 출력, JSON 파싱 에러, 미세한 환각(Hallucination) 때문에 백엔드 파이프라인의 에러율이 급증합니다.' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="glass" style="padding:22px 36px;display:flex;align-items:center;justify-content:space-between">' +
        '<div style="display:flex;align-items:center;gap:16px">' +
          '<iconify-icon icon="solar:lightbulb-bolt-bold" style="color:var(--c);font-size:32px"></iconify-icon>' +

    '</div>'

  // ── 3. JEV 코어 개념 및 프리미티브 ──
  {
    n: 3,
    html: '<div style="width:1600px;display:flex;flex-direction:column;gap:36px">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-end">' +
        '<div>' +
          '<div class="badge badge-c" style="margin-bottom:14px">CORE FOUNDATION OF JEV</div>' +

        '</div>' +
        '<div style="color:var(--mu);font-size:20px">TypeSafe AI가 개척한 70ms 초고속 System One 판정 아키텍처</div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:28px">' +
        '<div class="glass-c" data-step="1" style="padding:38px 32px;display:flex;flex-direction:column;gap:18px">' +
          '<div style="display:flex;justify-content:space-between;align-items:center">' +
            '<span class="badge badge-c">PRIMITIVE 01</span>' +
            '<iconify-icon icon="solar:check-read-bold" style="color:var(--c);font-size:32px"></iconify-icon>' +
          '</div>' +
          '<div class="t-lg" style="color:#fff">Choice</div>' +

          '<div class="t-xs" style="color:var(--mu);line-height:1.6">' +
            '입력과 N개의 후보 선택지 간 매칭 확률을 직접 연산. 1등 선택지와 각 옵션별 확률(Probability Score)을 동시 반환.' +
          '</div>' +
          '<div style="background:rgba(0,0,0,.35);padding:14px;border-radius:12px;font-family:monospace;font-size:16px;color:var(--c)">' +
            'result = jev.choice(text, options)' +
          '</div>' +
        '</div>' +
        '<div class="glass-a" data-step="2" style="padding:38px 32px;display:flex;flex-direction:column;gap:18px">' +
          '<div style="display:flex;justify-content:space-between;align-items:center">' +
            '<span class="badge badge-a">PRIMITIVE 02</span>' +
            '<iconify-icon icon="solar:slider-vertical-bold" style="color:var(--a);font-size:32px"></iconify-icon>' +

// ── 슬라이드 상태 & 렌더링 엔진 ──
let cur = 0;
let step = 1;
const slideEl = document.getElementById('slide');
const counterEl = document.getElementById('counter');
const progEl = document.getElementById('progress');

function render() {
  const s = slides[cur];
  slideEl.innerHTML = s.html;
  counterEl.textContent = `${cur + 1} / ${slides.length}`;
  progEl.style.width = `${((cur + 1) / slides.length) * 100}%`;
  step = 1;
  applyStep();
}

function applyStep() {
  const els = slideEl.querySelectorAll('[data-step]');
  els.forEach(el => {
    const st = parseInt(el.getAttribute('data-step'), 10);
    if (st <= step) {
      el.classList.add('revealed');
    } else {
      el.classList.remove('revealed');
    }
  });
}

function go(dir) {
  const s = slides[cur];
  if (dir > 0) {
    if (step < s.n) {
      step++;
      applyStep();
    } else if (cur < slides.length - 1) {
      cur++;
      render();
    }
  } else {
    if (step > 1) {
      step--;
      applyStep();
    } else if (cur > 0) {
      cur--;
      render();
      step = slides[cur].n;
      applyStep();
    }
  }
}

function goToPage(pageIdx) {
  const p = parseInt(pageIdx, 10);
  if (!isNaN(p) && p >= 1 && p <= slides.length) {
    cur = p - 1;
    render();
  }
}

// ── 퀵 점프 토스트 버퍼 시스템 ──
let jumpBuffer = '';
let jumpTimeout = null;
const jumpIndicator = document.getElementById('jump-indicator');
const jumpNumber = document.getElementById('jump-number');

function handleDigitInput(digit) {
  jumpBuffer += digit;
  const targetPage = parseInt(jumpBuffer, 10);
  
  if (targetPage > slides.length) {
    jumpBuffer = digit;
  }
  
  jumpNumber.textContent = jumpBuffer;
  jumpIndicator.style.display = 'flex';
  
  if (jumpTimeout) clearTimeout(jumpTimeout);
  jumpTimeout = setTimeout(() => {
    goToPage(jumpBuffer);
    clearJumpBuffer();
  }, 1200);
}

function clearJumpBuffer() {
  jumpBuffer = '';
  jumpIndicator.style.display = 'none';
  if (jumpTimeout) {
    clearTimeout(jumpTimeout);
    jumpTimeout = null;
  }
}

// ── 퀵 점프 모달 시스템 (G키 & 카운터 클릭) ──
const modalOverlay = document.getElementById('jump-modal-overlay');
const modalInput = document.getElementById('modal-page-input');
const modalBtn = document.getElementById('modal-jump-btn');

function openJumpModal() {
  clearJumpBuffer();
  modalOverlay.style.display = 'flex';
  modalInput.value = cur + 1;
  modalInput.focus();
  modalInput.select();
}

function closeJumpModal() {
  modalOverlay.style.display = 'none';
}

function executeModalJump() {
  const val = parseInt(modalInput.value, 10);
  if (!isNaN(val) && val >= 1 && val <= slides.length) {
    goToPage(val);
    closeJumpModal();
  } else {
    alert(`1부터 ${slides.length} 사이의 페이지 번호를 입력하세요.`);
    modalInput.focus();
  }
}

modalBtn.addEventListener('click', executeModalJump);
modalOverlay.addEventListener('click', e => {
  if (e.target === modalOverlay) closeJumpModal();
});
modalInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    executeModalJump();
  } else if (e.key === 'Escape') {
    closeJumpModal();
  }
});

document.getElementById('counter').addEventListener('click', e => {
  e.stopPropagation();
  openJumpModal();
});

// ── 키보드 단축키 ──
window.addEventListener('keydown', e => {
  if (modalOverlay && modalOverlay.style.display === 'flex') return;

  const k = e.key;

  // 숫자 키 (0~9)
  if (/^[0-9]$/.test(k)) {
    e.preventDefault();
    handleDigitInput(k);
    return;
  }

  // 버퍼 활성화 중 Enter/Esc
  if (jumpBuffer.length > 0) {
    if (k === 'Enter') {
      e.preventDefault();
      goToPage(jumpBuffer);
      clearJumpBuffer();
      return;
    } else if (k === 'Escape' || k === 'Backspace') {
      e.preventDefault();
      clearJumpBuffer();
      return;
    }
  }

  // G키 모달
  if (k === 'g' || k === 'G') {
    e.preventDefault();
    openJumpModal();
    return;
  }

  // 일반 내비게이션
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter' || k === 'n' || k === 'N') {
    e.preventDefault();
    go(1);
  } else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace' || k === 'p' || k === 'P') {
    e.preventDefault();
    go(-1);
  } else if (k === 'ArrowDown') {
    e.preventDefault();
    if (cur < slides.length - 1) { cur++; render(); }
  } else if (k === 'ArrowUp') {
    e.preventDefault();
    if (cur > 0) { cur--; render(); }
  }
}, true);

// ── 마우스 & 터치 이벤트 ──
document.getElementById('btn-next').addEventListener('click', e => {
  e.stopPropagation();
  go(1);
});
document.getElementById('btn-prev').addEventListener('click', e => {
  e.stopPropagation();
  go(-1);
});
document.addEventListener('click', e => {
  if (modalOverlay && modalOverlay.style.display === 'flex') return;
  if (!e.target.closest('#nav') && !e.target.closest('button') && !e.target.closest('a') && !e.target.closest('#jump-modal')) {
    go(1);
  }
});

let wheelTimeout;
window.addEventListener('wheel', e => {
  if (modalOverlay && modalOverlay.style.display === 'flex') return;
  if (wheelTimeout) return;
  if (e.deltaY > 30) {
    go(1);
    wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 250);
  } else if (e.deltaY < -30) {
    go(-1);
    wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 250);
  }
}, { passive: true });

// ── 1920x1080 뷰포트 반응형 스케일링 ──
function scale() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  const tx = (window.innerWidth - 1920 * s) / 2;
  const ty = (window.innerHeight - 1080 * s) / 2;
  document.body.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
}

window.addEventListener('resize', scale);
window.addEventListener('load', () => {
  window.focus();
  document.body.focus();
});

// 초기 실행
scale();
render();
window.focus();
