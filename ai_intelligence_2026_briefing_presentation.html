.grad{background:linear-gradient(100deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}

.card{background:var(--card);border-radius:36px;padding:60px 56px;min-height:470px;display:flex;flex-direction:column;justify-content:center}
.metric{text-align:center}

.metric .big small{font-size:84px;font-weight:600;letter-spacing:0;margin-left:6px}

.metric .desc{margin-top:14px;font-size:25px;line-height:1.6;color:var(--mu)}
.text h3{font-size:40px;font-weight:800;color:var(--ink2)}
.text p{margin-top:36px;font-size:25px;line-height:1.7;color:var(--mu)}

.tbl{width:100%}
.tbl .row{display:grid;align-items:center;padding:0 26px;min-height:80px;font-size:24px;font-weight:600;color:var(--ink2)}

.tbl .hd{min-height:50px;border-radius:12px;background:var(--bar);color:#fff;font-size:18px;font-weight:600;margin-bottom:6px}
.tbl .row>span{padding-right:16px}
.tbl .row:not(.hd) .v{color:var(--ac);font-weight:700;font-size:27px;font-variant-numeric:tabular-nums}
.tbl .row:not(.hd) .v.sep{border-left:1px solid #d6dbe4;padding-left:22px}
.tbl .hd .v.sep{padding-left:23px}

.opts{display:flex;flex-direction:column;gap:20px}
.opt{border:1.5px solid var(--line);border-radius:20px;padding:24px 32px;text-align:center;background:#fff}
.opt .k{font-size:21px;font-weight:700;color:var(--ac)}
.opt .t{margin-top:6px;font-size:27px;font-weight:700;color:var(--ink)}
.opt .d{margin-top:6px;font-size:20px;color:var(--mu)}
.opt.em{background:var(--ac);border-color:var(--ac);box-shadow:0 18px 40px rgba(var(--ac-rgb),.28)}
.opt.em .k,.opt.em .d{color:rgba(255,255,255,.85)}

.bcol{display:flex;flex-direction:column;align-items:center;width:150px}
.bcol .val{font-size:46px;font-weight:800;color:var(--ink2);font-variant-numeric:tabular-nums}

.qcard .by{margin-top:34px;font-size:21px;color:var(--mu)}

.scard .v{font-size:80px;font-weight:800;line-height:1;letter-spacing:-.02em}
.scard .v small{font-size:38px;font-weight:600;margin-left:4px}

.scard .d{margin-top:16px;font-size:22px;line-height:1.65;color:var(--mu)}

.part{position:absolute;inset:0;color:#fff;overflow:hidden;

#pbar{position:absolute;left:0;right:0;bottom:0;height:46px;display:flex;z-index:5;transition:opacity .3s}
#pbar.hide{opacity:0;pointer-events:none}
#pbar div{flex:1;display:grid;place-items:center;font-size:20px;font-weight:600;color:#a3a8b1;background:#f3f4f6;cursor:pointer;transition:background .2s}
#pbar div:hover{background:#e7e9ed}
#pbar div.on{background:var(--bar);color:#fff}
#counter{position:absolute;right:28px;bottom:54px;font-size:17px;font-weight:600;color:var(--dim);cursor:pointer;z-index:6;font-variant-numeric:tabular-nums}
#counter.dark{color:rgba(255,255,255,.5)}

#jump-toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);padding:14px 26px;border-radius:14px;font-size:22px;font-weight:700;background:var(--bar);color:#fff;z-index:9;display:none}
#jump-modal{position:absolute;inset:0;background:rgba(10,12,16,.45);display:none;place-items:center;z-index:10}
#jump-modal.open{display:grid}
#jump-modal form{padding:40px 48px;border-radius:22px;background:#fff;display:flex;flex-direction:column;gap:20px;align-items:center;box-shadow:0 30px 80px rgba(0,0,0,.25)}
#jump-modal label{font-size:24px;font-weight:700;color:var(--ac)}
#jump-input{width:160px;height:56px;font-size:32px;font-weight:700;text-align:center;border-radius:12px;border:1.5px solid var(--line);color:var(--ink)}
#jump-modal button{padding:12px 32px;border-radius:12px;font-size:18px;font-weight:700;background:var(--ac);color:#fff;border:none;cursor:pointer}
@media (prefers-reduced-motion:reduce){[data-s]{transition:none}}
</style>
</head>

        head: ['모델 · 2026년 7월', '과제당 비용'],
        rows: [['DeepSeek V4-Flash', '$0.03'], ['Kimi K3', '$0.86'], ['GPT-5.6 Sol', '$1.86'], ['Claude Opus 5', '$2.34'], ['Claude Fable 5', '$3.15']] },
      src: '왼쪽: 순다르 피차이, 카네기멜런대 강연(2024-09-18) 슬라이드 · 오른쪽: Artificial Analysis 지능 지수<br>과제당 평균 비용(포브스 2026-08-03 보도 인용)',
      take: '같은 시기에도 가장 싼 모델과 비싼 모델은 100배 넘게 차이 난다.' },
    { layout: 'cards', chapter: 2,
      title: '공개형 모델은 <b>성능의 80~90%를 값의 20%에</b> 냅니다',
      items: [
        { value: '80~90', unit: '%', label: '최상위 모델 대비 성능', desc: '일부 중국 공개형 모델에 대한<br>업계 평가(아틀라스 클라우드 CEO)' },
        { value: '20', unit: '%', label: '같은 기준의 가격', desc: 'DeepSeek · 알리바바 · 문샷 AI가<br>모델을 공개형으로 내며 만든 구간' },
        { value: '10 → 58', unit: '%', label: '미국 개발자 트래픽 중 공개형', desc: 'OpenRouter 미국 사용자 기준<br>1년 사이의 변화' }],
      src: '뉴욕타임스 2026-09-04 · AT&T는 공개형 모델 비중을 20%에서 40%로 올려 AI 비용을 최대 80% 줄였다고 밝힘',
      take: '값을 끌어내리는 힘은 한 회사가 아니라 경쟁 구조에서 나온다.' },
    { layout: 'quotes', chapter: 2,
      title: '샘 올트먼은 <b>지금의 성능과 값에 맞춰 설계하지 말라</b>고 합니다',
      items: [
        { quote: '「세상의 95%는 모델이 지금 속도로<br>계속 좋아진다는 쪽에 걸어야 한다」',
          desc: '모델이 그대로일 거라 보고 그 위에 작은 것을<br>얹은 회사는 다음 모델이 나오는 순간 밀려납니다.',
          by: '20VC 팟캐스트 인터뷰 · 2024년 4월' },
        { quote: '「전등 한 시간 켜는 값을 따지지 않듯<br>AI 값도 따지지 않게 만드는 것이 목표다」',
          desc: '1인당 월 토큰 사용량은 6년 반 만에 0에서<br>10만으로 늘었고, 인프라를 더 지어 값을<br>계속 내리겠다는 뜻입니다.',
          by: 'G20 혁신장관회의 대담 · 2026년 9월 2일' }],
      src: '두 인용은 번역 요지 · 20VC 팟캐스트(2024-04), G20 혁신장관회의 대담(2026-09-02, 영상 24:29~28:20)',
      take: '지금의 성능과 값에 맞춘 계획은 1년 뒤에 낡는다.' },
    { layout: 'part', kicker: 'AI 브리핑 · 정리', part: 'Next.', title: '더 좋아지고 더 싸질 AI를<br>전제로 일을 설계합니다' }
  ]
};
/* ===================== 렌더링 엔진 — 고치지 않는다 ===================== */
const $ = id => document.getElementById(id);
const S = DECK.slides;
let cur = 0, step = 0, maxStep = 0;
const pad = i => String(i).padStart(2, '0');
const LOGO = `<svg width="40" height="30" viewBox="0 0 40 30"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#5db6ff"/><stop offset="1" stop-color="#3b78ff"/></linearGradient></defs><path d="M2 28 16 2h9L11 28z" fill="url(#lg)"/><path d="M18 28 25 15l7 13z" fill="#ffd54a"/></svg>`;

const head = (s, n) => `<div class="eyebrow grad" ${n(0)}>${s.eyebrow || DECK.eyebrow || ''}</div><h2 class="title" ${n(0)}>${s.title}</h2>`;
const foot = (s, n, k) => (s.src ? `<div class="src" ${n(k)}>${s.src}</div>` : '') + (s.take ? `<div class="take" ${n(k + 1)}>${s.take}</div>` : '');
const std = (s, n, body, k) => `<div class="std">${head(s, n)}<div class="body">${body}</div>${foot(s, n, k)}</div>`;
const num = (v, u) => `${v}<small>${u || ''}</small>`;

const LEFT = {
  metric: p => `<div class="card metric"><div class="big grad">${num(p.value, p.unit)}</div><div class="cap">${p.label}</div>${p.desc ? `<div class="desc">${p.desc}</div>` : ''}</div>`,
  text: p => `<div class="card text"><h3>${p.head}</h3>${p.paras.map(t => `<p>${t}</p>`).join('')}</div>`
};
const RIGHT = {
  table: p => {
    const row = (r, cls) => `<div class="row ${cls}" style="grid-template-columns:${p.cols}">${r.map((c, i) => `<span class="${i === p.val ? (i ? 'v sep' : 'v') : ''}">${c}</span>`).join('')}</div>`;
    return `<div class="tbl">${row(p.head, 'hd')}${p.rows.map(r => row(r, '')).join('')}</div>`;
  },
  options: p => `<div class="opts">${p.items.map(it =>
    `<div class="opt${it.em ? ' em' : ''}">${it.k ? `<div class="k">${it.k}</div>` : ''}<div class="t">${it.t}</div>${it.d ? `<div class="d">${it.d}</div>` : ''}</div>`).join('')}</div>`
};

const LAYOUTS = {
  part: (s, n) => `<div class="part"><div class="grid"></div><div class="ring r1"></div><div class="ring r2"></div>
      <div class="in"><div class="kick" ${n(0)}>${s.kicker || ''}</div><div class="pnum" ${n(1)}>${s.part || ''}</div><h1 class="ptitle" ${n(1)}>${s.title}</h1>${s.sub ? `<p class="psub" ${n(2)}>${s.sub}</p>` : ''}</div>
      <div class="brand" ${n(2)}><b>${LOGO}${DECK.brand.name}</b>${DECK.brand.contact ? `<span>${DECK.brand.contact}</span>` : ''}</div></div>`,
  contents: (s, n) => `<div class="contents"><h2 class="grad" ${n(0)}>Contents</h2><ol>${(s.items || DECK.chapters).map((t, i) =>
      `<li ${n(i + 1)}><span class="n grad">${pad(i + 1)}</span><span class="t">${t}</span>${s.tags && s.tags[i] ? `<span class="tag">${s.tags[i]}</span>` : '<span></span>'}</li>`).join('')}</ol></div>`,
  section: (s, n) => `<div class="section"><div class="in"><div class="snum grad" ${n(0)}>${s.num || pad((s.chapter ?? 0) + 1)}</div>
      <h1 class="stitle" ${n(1)}>${s.title}</h1>${s.meta ? `<div class="smeta" ${n(2)}>${s.meta.join('<br>')}</div>` : ''}</div></div>`,
  split: (s, n) => std(s, n, `<div class="split"><div ${n(1)}>${LEFT[s.left.type](s.left)}</div><div ${n(2)}>${RIGHT[s.right.type](s.right)}</div></div>`, 3),
  bars: (s, n) => {
    const max = Math.max(...s.items.map(it => it.value));
    return std(s, n, `<div class="bars">${s.items.map((it, i) =>
      `<div class="bcol${it.em ? ' em' : ''}" ${n(i + 1)}><div class="val">${num(it.show ?? it.value, it.unit)}</div><div class="b" style="height:${Math.max(24, it.value / max * (s.h || 300))}px"></div><div class="lb">${it.label}</div></div>`).join('')}</div>`, s.items.length + 1);
  },
  quotes: (s, n) => std(s, n, `<div class="quotes">${s.items.map((it, i) =>
      `<div class="qcard" ${n(i + 1)}><div class="q">${it.quote}</div>${it.desc ? `<div class="qd">${it.desc}</div>` : ''}${it.by ? `<div class="by">${it.by}</div>` : ''}</div>`).join('')}</div>`, s.items.length + 1),
  cards: (s, n) => std(s, n, `<div class="cards">${s.items.map((it, i) =>
      `<div class="scard" ${n(i + 1)}><div class="v grad">${num(it.value, it.unit)}</div><div class="l">${it.label}</div>${it.desc ? `<div class="d">${it.desc}</div>` : ''}</div>`).join('')}</div>`, s.items.length + 1)
};

function renderBar() {
  const s = S[cur], on = s.chapter != null && !['part', 'contents'].includes(s.layout);
  $('pbar').classList.toggle('hide', !on);
  $('pbar').innerHTML = DECK.chapters.map((c, i) => `<div class="${i === s.chapter ? 'on' : ''}" data-slide="${Math.max(0, S.findIndex(x => x.chapter === i))}" title="${c}">${pad(i + 1)}</div>`).join('');
  $('counter').classList.toggle('dark', ['part', 'section'].includes(s.layout));
}

function go(i, full) {
  cur = Math.max(0, Math.min(S.length - 1, i));
  const s = S[cur];
  $('slide').innerHTML = LAYOUTS[s.layout](s, k => `data-s="${k}"`);
  renderBar();
  $('counter').textContent = `${cur + 1} / ${S.length}`;
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) { }
  const els = [...$('slide').querySelectorAll('[data-s]')];
  maxStep = Math.max(0, ...els.map(e => +e.dataset.s));
  const mode = s.reveal || DECK.reveal;
  step = (full || mode === 'auto') ? maxStep : 0;
  els.forEach(e => e.style.setProperty('--d', mode === 'auto' && !full ? (0.08 + e.dataset.s * 0.2) + 's' : '0s'));
  requestAnimationFrame(() => requestAnimationFrame(showSteps));
}
function showSteps() { $('slide').querySelectorAll('[data-s]').forEach(e => e.classList.toggle('on', +e.dataset.s <= step)); }
function next() { if (step < maxStep) { step++; showSteps(); } else if (cur < S.length - 1) go(cur + 1); }
function prev() { if (cur > 0) go(cur - 1, true); }

function scale() {
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('stage').style.transform = `translate(${(innerWidth - 1920 * k) / 2}px,${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
}

let buf = '', bufT;
function jumpTo(v) { const n = parseInt(v, 10); if (n >= 1 && n <= S.length) go(n - 1, true); }
function openModal() { $('jump-modal').classList.add('open'); const inp = $('jump-input'); inp.max = S.length; inp.value = ''; inp.focus(); }
function closeModal() { $('jump-modal').classList.remove('open'); }
$('jump-modal').querySelector('form').addEventListener('submit', e => { e.preventDefault(); jumpTo($('jump-input').value); closeModal(); });
$('jump-modal').addEventListener('click', e => { if (e.target.id === 'jump-modal') closeModal(); });
$('counter').addEventListener('click', e => { e.stopPropagation(); openModal(); });
$('pbar').addEventListener('click', e => {
  e.stopPropagation();
  const t = e.target.closest('[data-slide]');
  if (t) go(+t.dataset.slide, true);
});

window.addEventListener('keydown', e => {
  if ($('jump-modal').classList.contains('open')) { if (e.key === 'Escape') closeModal(); return; }
  if (/^[0-9]$/.test(e.key)) {
    buf += e.key; $('jump-num').textContent = buf; $('jump-toast').style.display = 'block';
    clearTimeout(bufT); bufT = setTimeout(() => { jumpTo(buf); buf = ''; $('jump-toast').style.display = 'none'; }, 1200);
    return;
  }
  if (e.key === 'Enter' && buf) { clearTimeout(bufT); jumpTo(buf); buf = ''; $('jump-toast').style.display = 'none'; return; }
  if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(S.length - 1, true);
  else if (e.key === 'g' || e.key === 'G') { e.preventDefault(); openModal(); }
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); }
});
$('stage').addEventListener('click', e => { if (!e.target.closest('#jump-modal')) next(); });
let tx0 = null;
addEventListener('touchstart', e => tx0 = e.touches[0].clientX, { passive: true });
addEventListener('touchend', e => { if (tx0 === null) return; const dx = e.changedTouches[0].clientX - tx0; if (Math.abs(dx) > 50) dx < 0 ? next() : prev(); tx0 = null; });

const hex = DECK.accent.replace('#', '');
document.documentElement.style.setProperty('--ac', DECK.accent);
document.documentElement.style.setProperty('--ac2', DECK.accent2 || DECK.accent);
document.documentElement.style.setProperty('--ac-rgb', [0, 2, 4].map(i => parseInt(hex.substr(i, 2), 16)).join(','));
addEventListener('resize', scale); scale();
window.addEventListener('hashchange', () => go((parseInt(location.hash.slice(1), 10) || 1) - 1));
go((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
