<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 차세대 AI 에이전트 혁명 — OpenAI Dots · Meta Muse · Grok Bot</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#09090b;
  --t:#f0f0f0;
  --mu:#a1a1aa;
  --c:#00d4ff;  /* Cyan: OpenAI Dots / 테크 / 클라우드 브라우저 */
  --a:#f59e0b;  /* Amber: Grok Bot / 엔터프라이즈 / 워크플로우 */
  --e:#10b981;  /* Emerald: Meta Muse / 일상 / 소상공인 */
  --p:#a78bfa;  /* Purple: AI Agent / 자율 아키텍처 / LPU */
  --r:#f43f5e;  /* Rose: 보안 리스크 / 가드레일 / 한계 */
  --b:#3b82f6;  /* Blue: 오케스트레이션 / 생태계 */
}
body{
  background:var(--bg);
  color:var(--t);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  overflow:hidden;
  width:1920px;
  height:1080px;
  transform-origin:0 0;
  word-break:keep-all;
  position:relative;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:88px 88px;
  pointer-events:none;
  z-index:0;
}

/* Typography */
.t-hero{font-size:90px;font-weight:800;letter-spacing:-.034em;line-height:1.14}
.t-xl{font-size:64px;font-weight:700;letter-spacing:-.026em;line-height:1.2}
.t-lg{font-size:44px;font-weight:700;letter-spacing:-.020em;line-height:1.26}
.t-md{font-size:30px;font-weight:600;line-height:1.34}
.t-sm{font-size:22px;font-weight:500;line-height:1.48}
.t-xs{font-size:18px;font-weight:400;color:var(--mu);line-height:1.56}

/* Glow Text */
.gc{color:#00d4ff;text-shadow:0 0 28px #00d4ff,0 0 56px rgba(0,212,255,.45)}
.ga{color:#f59e0b;text-shadow:0 0 28px #f59e0b,0 0 56px rgba(245,158,11,.45)}
.ge{color:#10b981;text-shadow:0 0 28px #10b981,0 0 56px rgba(16,185,129,.45)}
.gp{color:#a78bfa;text-shadow:0 0 28px #a78bfa,0 0 56px rgba(167,139,250,.45)}
.gr{color:#f43f5e;text-shadow:0 0 28px #f43f5e,0 0 56px rgba(244,63,94,.45)}
.gb{color:#3b82f6;text-shadow:0 0 28px #3b82f6,0 0 56px rgba(59,130,246,.45)}

/* Glass Cards */
.glass{
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.11);
  border-radius:24px;
  box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
}
.glass-c{
  background:rgba(0,212,255,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(0,212,255,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(0,212,255,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-a{
  background:rgba(245,158,11,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(245,158,11,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(245,158,11,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-e{
  background:rgba(16,185,129,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(16,185,129,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(16,185,129,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-p{
  background:rgba(167,139,250,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(167,139,250,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(167,139,250,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-r{
  background:rgba(244,63,94,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(244,63,94,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(244,63,94,.12),0 8px 40px rgba(0,0,0,.5);
}
.glass-b{
  background:rgba(59,130,246,.07);
  backdrop-filter:blur(24px);
  border:1px solid rgba(59,130,246,.28);
  border-radius:24px;
  box-shadow:0 0 48px rgba(59,130,246,.12),0 8px 40px rgba(0,0,0,.5);
}

/* Animations */
[data-step]{
  opacity:0;
  transform:translateY(20px);
  transition:opacity .45s cubic-bezier(.16,1,.3,1),transform .45s cubic-bezier(.16,1,.3,1);
}
[data-step].revealed{opacity:1;transform:translateY(0)}
[data-step="2"].revealed{transition-delay:.06s}
[data-step="3"].revealed{transition-delay:.12s}
[data-step="4"].revealed{transition-delay:.18s}
[data-step="5"].revealed{transition-delay:.24s}

/* Layout Elements */
#blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
#slide{position:relative;z-index:1;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center}
#nav{position:fixed;bottom:24px;right:48px;z-index:100;display:flex;align-items:center;gap:12px;user-select:none}
#nav .nav-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  color:var(--t);
  width:44px;
  height:44px;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:20px;
  transition:all .2s ease;
}
#nav .nav-btn:hover{
  background:rgba(0,212,255,.2);
  border-color:var(--c);
  color:var(--c);
  transform:scale(1.06);
}
#nav span{
  color:var(--mu);
  font-size:18px;
  font-weight:600;
  min-width:84px;
  text-align:center;
  cursor:pointer;
  padding:4px 8px;
  border-radius:8px;
  transition:all .2s ease;
}
#nav span:hover{
  background:rgba(255,255,255,.1);
  color:var(--c);
}
#progress{position:fixed;bottom:0;left:0;height:4px;background:linear-gradient(90deg,var(--c),var(--e),var(--a),var(--p));z-index:10;transition:width .3s ease}

/* Quick Jump Toast Indicator */
#jump-indicator{
  position:fixed;
  top:36px;
  right:48px;
  z-index:200;
  background:rgba(19,27,49,.92);
  backdrop-filter:blur(16px);
  border:1px solid var(--c);
  box-shadow:0 0 30px rgba(0,212,255,.35);
  border-radius:14px;
  padding:12px 24px;
  display:none;
  align-items:center;
  gap:12px;
  font-size:18px;
  font-weight:600;
  color:#fff;
  letter-spacing:-.01em;
}

/* Quick Jump Modal */
#jump-modal-overlay{
  position:fixed;
  inset:0;
  z-index:999;
  background:rgba(9,9,11,.75);
  backdrop-filter:blur(12px);
  display:none;
  align-items:center;
  justify-content:center;
}
#jump-modal{
  width:440px;
  background:rgba(18,24,38,.92);
  border:1px solid rgba(0,212,255,.35);
  box-shadow:0 16px 50px rgba(0,0,0,.7),0 0 40px rgba(0,212,255,.2);
  border-radius:24px;
  padding:36px 32px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}
#jump-modal input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.06);
  color:#fff;
  font-size:24px;
  font-weight:700;
  text-align:center;
  outline:none;
  transition:border .2s;
}
#jump-modal input:focus{
  border-color:var(--c);
  box-shadow:0 0 16px rgba(0,212,255,.3);
}
#modal-jump-btn{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  background:linear-gradient(135deg,var(--c),var(--p));
  color:#000;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  transition:transform .15s,opacity .15s;
}
#modal-jump-btn:hover{
  opacity:.9;
  transform:scale(1.02);
}

/* Badges */
.badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 18px;
  border-radius:999px;
  font-size:16px;
  font-weight:600;
  letter-spacing:-.01em;
}
.badge-c{background:rgba(0,212,255,.12);color:var(--c);border:1px solid rgba(0,212,255,.3)}
.badge-a{background:rgba(245,158,11,.12);color:var(--a);border:1px solid rgba(245,158,11,.3)}
.badge-e{background:rgba(16,185,129,.12);color:var(--e);border:1px solid rgba(16,185,129,.3)}
.badge-p{background:rgba(167,139,250,.12);color:var(--p);border:1px solid rgba(167,139,250,.3)}
.badge-r{background:rgba(244,63,94,.12);color:var(--r);border:1px solid rgba(244,63,94,.3)}
.badge-b{background:rgba(59,130,246,.12);color:var(--b);border:1px solid rgba(59,130,246,.3)}
</style>
</head>
<body>
<div id="blobs"></div>
<div id="slide"></div>

<!-- Quick Jump Toast -->
<div id="jump-indicator">
  <iconify-icon icon="solar:round-alt-arrow-right-bold" style="color:var(--c);font-size:24px"></iconify-icon>
  <span>Go to Page : </span>
  <span id="jump-number" style="color:var(--c);font-weight:800;font-size:22px">1</span>
</div>

<!-- Quick Jump Modal -->
<div id="jump-modal-overlay">
  <div id="jump-modal">
    <div style="font-size:22px;font-weight:700;color:var(--c);display:flex;align-items:center;gap:10px">
      <iconify-icon icon="solar:compass-bold" style="font-size:26px"></iconify-icon>
      페이지 바로 이동
    </div>
    <div style="font-size:14px;color:var(--mu);text-align:center">1부터 15 사이의 슬라이드 번호를 입력하세요</div>
    <input type="number" id="modal-page-input" min="1" max="15" placeholder="예: 7">
    <button id="modal-jump-btn">이동하기</button>
  </div>
</div>

<!-- Controls -->
<div id="nav">
  <button class="nav-btn" id="btn-prev" title="이전 (←, Backspace)">◀</button>
  <span id="counter" title="클릭하여 페이지 점프">1 / 15</span>
  <button class="nav-btn" id="btn-next" title="다음 (→, Space)">▶</button>
</div>
<div id="progress"></div>

// ── 슬라이드 상태 & 렌더링 엔진 ──
let cur = 0;
let step = 1;
const slideEl = document.getElementById('slide');
const counterEl = document.getElementById('counter');
const progEl = document.getElementById('progress');

function render() {
  const s = slides[cur];
  slideEl.innerHTML = s.html;
  counterEl.textContent = `${cur + 1} / ${slides.length}`;
  progEl.style.width = `${((cur + 1) / slides.length) * 100}%`;
  step = 1;
  applyStep();
}

function applyStep() {
  const els = slideEl.querySelectorAll('[data-step]');
  els.forEach(el => {
    const st = parseInt(el.getAttribute('data-step'), 10);
    if (st <= step) {
      el.classList.add('revealed');
    } else {
      el.classList.remove('revealed');
    }
  });
}

function go(dir) {
  const s = slides[cur];
  if (dir > 0) {
    if (step < s.n) {
      step++;
      applyStep();
    } else if (cur < slides.length - 1) {
      cur++;
      render();
    }
  } else {
    if (step > 1) {
      step--;
      applyStep();
    } else if (cur > 0) {
      cur--;
      render();
      step = slides[cur].n;
      applyStep();
    }
  }
}

function goToPage(pageIdx) {
  const p = parseInt(pageIdx, 10);
  if (!isNaN(p) && p >= 1 && p <= slides.length) {
    cur = p - 1;
    render();
  }
}

// ── 퀵 점프 토스트 버퍼 시스템 ──
let jumpBuffer = '';
let jumpTimeout = null;
const jumpIndicator = document.getElementById('jump-indicator');
const jumpNumber = document.getElementById('jump-number');

function handleDigitInput(digit) {
  jumpBuffer += digit;
  const targetPage = parseInt(jumpBuffer, 10);
  
  if (targetPage > slides.length) {
    jumpBuffer = digit;
  }
  
  jumpNumber.textContent = jumpBuffer;
  jumpIndicator.style.display = 'flex';
  
  if (jumpTimeout) clearTimeout(jumpTimeout);
  jumpTimeout = setTimeout(() => {
    goToPage(jumpBuffer);
    clearJumpBuffer();
  }, 1200);
}

function clearJumpBuffer() {
  jumpBuffer = '';
  jumpIndicator.style.display = 'none';
  if (jumpTimeout) {
    clearTimeout(jumpTimeout);
    jumpTimeout = null;
  }
}

// ── 퀵 점프 모달 시스템 (G키 & 카운터 클릭) ──
const modalOverlay = document.getElementById('jump-modal-overlay');
const modalInput = document.getElementById('modal-page-input');
const modalBtn = document.getElementById('modal-jump-btn');

function openJumpModal() {
  clearJumpBuffer();
  modalOverlay.style.display = 'flex';
  modalInput.value = cur + 1;
  modalInput.focus();
  modalInput.select();
}

function closeJumpModal() {
  modalOverlay.style.display = 'none';
}

function executeModalJump() {
  const val = parseInt(modalInput.value, 10);
  if (!isNaN(val) && val >= 1 && val <= slides.length) {
    goToPage(val);
    closeJumpModal();
  } else {
    alert('1부터 ' + slides.length + ' 사이의 페이지 번호를 입력하세요.');
  }
}

modalBtn.addEventListener('click', executeModalJump);
modalOverlay.addEventListener('click', e => {
  if (e.target === modalOverlay) closeJumpModal();
});
modalInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    executeModalJump();
  } else if (e.key === 'Escape') {
    closeJumpModal();
  }
});

document.getElementById('counter').addEventListener('click', e => {
  e.stopPropagation();
  openJumpModal();
});

// ── 키보드 단축키 ──
window.addEventListener('keydown', e => {
  if (modalOverlay && modalOverlay.style.display === 'flex') return;

  const k = e.key;

  // 숫자 키 (0~9)
  if (/^[0-9]$/.test(k)) {
    e.preventDefault();
    handleDigitInput(k);
    return;
  }

  // 버퍼 활성화 중 Enter/Esc
  if (jumpBuffer.length > 0) {
    if (k === 'Enter') {
      e.preventDefault();
      goToPage(jumpBuffer);
      clearJumpBuffer();
      return;
    } else if (k === 'Escape' || k === 'Backspace') {
      e.preventDefault();
      clearJumpBuffer();
      return;
    }
  }

  // G키 모달
  if (k === 'g' || k === 'G') {
    e.preventDefault();
    openJumpModal();
    return;
  }

  // 일반 내비게이션
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown' || k === 'Enter' || k === 'n' || k === 'N') {
    e.preventDefault();
    go(1);
  } else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace' || k === 'p' || k === 'P') {
    e.preventDefault();
    go(-1);
  } else if (k === 'ArrowDown') {
    e.preventDefault();
    if (cur < slides.length - 1) { cur++; render(); }
  } else if (k === 'ArrowUp') {
    e.preventDefault();
    if (cur > 0) { cur--; render(); }
  }
}, true);

// ── 마우스 & 터치 이벤트 ──
document.getElementById('btn-next').addEventListener('click', e => {
  e.stopPropagation();
  go(1);
});
document.getElementById('btn-prev').addEventListener('click', e => {
  e.stopPropagation();
  go(-1);
});
document.addEventListener('click', e => {
  if (modalOverlay && modalOverlay.style.display === 'flex') return;
  if (!e.target.closest('#nav') && !e.target.closest('button') && !e.target.closest('a') && !e.target.closest('#jump-modal')) {
    go(1);
  }
});

let wheelTimeout;
window.addEventListener('wheel', e => {
  if (modalOverlay && modalOverlay.style.display === 'flex') return;
  if (wheelTimeout) return;
  if (e.deltaY > 30) {
    go(1);
    wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 250);
  } else if (e.deltaY < -30) {
    go(-1);
    wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 250);
  }
}, { passive: true });

// ── 1920x1080 뷰포트 반응형 스케일링 ──
function scale() {
  const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  const tx = (window.innerWidth - 1920 * s) / 2;
  const ty = (window.innerHeight - 1080 * s) / 2;
  document.body.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
}

window.addEventListener('resize', scale);
window.addEventListener('load', () => {
  window.focus();
  document.body.focus();
});

// 초기 실행
scale();
render();
window.focus();
