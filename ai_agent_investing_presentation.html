<!DOCTYPE html>
<html lang="ko">

<script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#09090b;--t:#f0f0f0;--mu:#a1a1aa;--c:#00d4ff;--a:#f59e0b;--e:#10b981}
body{background:var(--bg);color:var(--t);font-family:'Pretendard',sans-serif;overflow:hidden;width:1920px;height:1080px;transform-origin:0 0;word-break:keep-all;position:relative}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:88px 88px;pointer-events:none;z-index:0}

.t-hero{font-size:112px;font-weight:800;letter-spacing:-.034em}
.t-xl{font-size:80px;font-weight:700;letter-spacing:-.026em}
.t-lg{font-size:60px;font-weight:700;letter-spacing:-.020em}
.t-md{font-size:42px;font-weight:600}
.t-sm{font-size:30px;font-weight:500}
.t-xs{font-size:24px;font-weight:400;color:var(--mu)}

.gc{color:#00d4ff;text-shadow:0 0 28px #00d4ff,0 0 56px rgba(0,212,255,.45)}
.ga{color:#f59e0b;text-shadow:0 0 28px #f59e0b,0 0 56px rgba(245,158,11,.45)}
.ge{color:#10b981;text-shadow:0 0 28px #10b981,0 0 56px rgba(16,185,129,.45)}

.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.13);border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.glass-c{background:rgba(0,212,255,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(0,212,255,.32);border-radius:24px;box-shadow:0 0 48px rgba(0,212,255,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(0,212,255,.06),inset 0 1px 0 rgba(255,255,255,.1)}
.glass-a{background:rgba(245,158,11,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(245,158,11,.32);border-radius:24px;box-shadow:0 0 48px rgba(245,158,11,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(245,158,11,.06),inset 0 1px 0 rgba(255,255,255,.1)}
.glass-e{background:rgba(16,185,129,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(16,185,129,.32);border-radius:24px;box-shadow:0 0 48px rgba(16,185,129,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(16,185,129,.06),inset 0 1px 0 rgba(255,255,255,.1)}

[data-step]{opacity:0;transform:translateY(22px);transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1)}
[data-step].revealed{opacity:1;transform:translateY(0)}
[data-step="2"].revealed{transition-delay:.08s}
[data-step="3"].revealed{transition-delay:.16s}
[data-step="4"].revealed{transition-delay:.24s}
[data-step="5"].revealed{transition-delay:.32s}

#blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
#slide{position:relative;z-index:1;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center}
#nav{position:fixed;bottom:36px;right:48px;z-index:10;display:flex;align-items:center;gap:16px}
#nav span{color:var(--mu);font-size:18px;font-weight:500}
#progress{position:fixed;bottom:0;left:0;height:3px;background:linear-gradient(90deg,var(--c),var(--e));z-index:10;transition:width .3s ease}
</style>
</head>
<body>
<div id="blobs">
  <div style="position:absolute;width:900px;height:900px;top:-280px;left:-280px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.07) 0%,transparent 70%)"></div>

<div id="slide"></div>
<div id="nav"><span id="counter"></span></div>
<div id="progress"></div>

// ── 네비게이션 엔진 ──
let cur=0,step=0;
function applySteps(){document.querySelectorAll('[data-step]').forEach(el=>{const n=parseInt(el.dataset.step),on=n<=step;el.classList.toggle('revealed',on);el.querySelectorAll('.bar-fill[data-w]').forEach(b=>{b.style.width=on?b.dataset.w:'0%'})})}
function updateNav(){const total=slides.length;document.getElementById('counter').textContent=`${cur+1} / ${total}`;document.getElementById('progress').style.width=((cur)/(total-1)*100)+'%'}
function render(){step=0;const sl=slides[cur];document.getElementById('slide').innerHTML=sl.html;if(sl.after)setTimeout(sl.after,50);applySteps();updateNav()}
function go(d){const max=slides[cur].n;if(d===1){if(step<max){step++;applySteps();updateNav()}else if(cur<slides.length-1){cur++;render()}}else{if(step>0){step--;applySteps();updateNav()}else if(cur>0){cur--;render();step=slides[cur].n;applySteps();updateNav()}}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}else if(e.key==='ArrowDown'){e.preventDefault();if(cur<slides.length-1){cur++;render()}}else if(e.key==='ArrowUp'){e.preventDefault();if(cur>0){cur--;render()}}});

// ── 화면 스케일 ──
function scale(){const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);const tx=(window.innerWidth-1920*s)/2,ty=(window.innerHeight-1080*s)/2;document.body.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}
window.addEventListener('resize',scale);scale();
render();
</script>
</body>
