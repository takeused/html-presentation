<!-- 다크 글래스모피즘 HTML 발표자료: 2026년, AI 지능은 어디까지 발전했나? (15장) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026년, AI 지능은 어디까지 발전했나?</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#09090b;--t:#f0f0f0;--mu:#a1a1aa;--c:#00d4ff;--a:#f59e0b;--e:#10b981}
body{background:var(--bg);color:var(--t);font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  overflow:hidden;width:1920px;height:1080px;transform-origin:0 0;word-break:keep-all;position:relative}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:88px 88px}

/* 타이포그래피 (1920 기준, 본문 최소 24px) */
.t-hero{font-size:112px;font-weight:800;letter-spacing:-.034em;line-height:1.14}
.t-xl{font-size:80px;font-weight:700;letter-spacing:-.026em;line-height:1.18}
.t-lg{font-size:60px;font-weight:700;letter-spacing:-.02em;line-height:1.24}
.t-md{font-size:42px;font-weight:600;line-height:1.32}
.t-sm{font-size:30px;font-weight:500;line-height:1.45}
.t-xs{font-size:24px;font-weight:400;color:var(--mu);line-height:1.55}

/* Glow 강조 */
.gc{color:#00d4ff;text-shadow:0 0 28px #00d4ff,0 0 56px rgba(0,212,255,.45)}
.ga{color:#f59e0b;text-shadow:0 0 28px #f59e0b,0 0 56px rgba(245,158,11,.45)}
.ge{color:#10b981;text-shadow:0 0 28px #10b981,0 0 56px rgba(16,185,129,.45)}

/* 글래스모피즘 카드 */
.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.13);border-radius:24px;
  box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.glass-c{background:rgba(0,212,255,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(0,212,255,.32);border-radius:24px;
  box-shadow:0 0 48px rgba(0,212,255,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(0,212,255,.06),inset 0 1px 0 rgba(255,255,255,.10)}
.glass-a{background:rgba(245,158,11,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(245,158,11,.32);border-radius:24px;
  box-shadow:0 0 48px rgba(245,158,11,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(245,158,11,.06),inset 0 1px 0 rgba(255,255,255,.10)}
.glass-e{background:rgba(16,185,129,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(16,185,129,.32);border-radius:24px;
  box-shadow:0 0 48px rgba(16,185,129,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(16,185,129,.06),inset 0 1px 0 rgba(255,255,255,.10)}

/* 뱃지 */
.badge{display:inline-flex;align-items:center;gap:10px;padding:8px 26px;border-radius:100px;font-size:18px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(12px)}
.badge-c{background:rgba(0,212,255,.13);border:1px solid rgba(0,212,255,.35);color:var(--c);box-shadow:0 0 20px rgba(0,212,255,.18)}
.badge-a{background:rgba(245,158,11,.13);border:1px solid rgba(245,158,11,.35);color:var(--a);box-shadow:0 0 20px rgba(245,158,11,.18)}
.badge-e{background:rgba(16,185,129,.13);border:1px solid rgba(16,185,129,.35);color:var(--e);box-shadow:0 0 20px rgba(16,185,129,.18)}

/* 스텝 등장 */
[data-step]{opacity:0;transform:translateY(22px);transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1)}
[data-step].revealed{opacity:1;transform:translateY(0)}
[data-step="2"].revealed{transition-delay:.08s}
[data-step="3"].revealed{transition-delay:.16s}
[data-step="4"].revealed{transition-delay:.24s}

/* 장면 공통 */
#blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
#slide{position:relative;z-index:1;width:1920px;height:1080px}
.sc{position:relative;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:40px}
.s-num,.s-section{position:absolute;top:64px;font-size:18px;color:var(--mu);letter-spacing:.18em;text-transform:uppercase}
.s-num{left:80px}.s-section{right:80px}
.head{width:1520px;margin-bottom:56px}
.head .t-lg{margin-top:22px}
.src{position:absolute;left:0;right:0;bottom:84px;text-align:center;font-size:24px;color:var(--mu)}
iconify-icon{display:block}
[style*="text-align:center"]>iconify-icon{width:fit-content;margin-left:auto;margin-right:auto}

/* 수평 바차트 */
.bar-track{height:22px;background:rgba(255,255,255,.08);border-radius:11px;overflow:hidden}
.bar-fill{height:100%;width:0%;border-radius:11px;background:linear-gradient(90deg,var(--c),rgba(0,212,255,.5));
  box-shadow:0 0 16px rgba(0,212,255,.4);transition:width 1s cubic-bezier(.16,1,.3,1) .2s}

/* 네비게이션 · 점프 */
#nav{position:fixed;bottom:24px;right:48px;z-index:100;display:flex;align-items:center;gap:12px;user-select:none}
#nav .nav-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:var(--t);width:44px;height:44px;border-radius:12px;cursor:pointer;font-size:18px}
#nav .nav-btn:hover{border-color:var(--c);color:var(--c)}
#counter{color:var(--mu);font-size:18px;font-weight:600;min-width:84px;text-align:center;cursor:pointer}
#progress{position:fixed;bottom:0;left:0;height:4px;background:linear-gradient(90deg,var(--c),var(--e),var(--a));z-index:10;transition:width .3s ease}
#jump-indicator{position:fixed;top:36px;right:48px;z-index:200;background:rgba(19,27,49,.92);border:1px solid var(--c);
  box-shadow:0 0 30px rgba(0,212,255,.35);border-radius:14px;padding:12px 24px;display:none;align-items:center;gap:12px;font-size:20px;font-weight:600}
#jump-modal-overlay{position:fixed;inset:0;z-index:999;background:rgba(9,9,11,.8);display:none;align-items:center;justify-content:center}
#jump-modal{width:440px;background:rgba(18,24,38,.95);border:1px solid rgba(0,212,255,.35);box-shadow:0 16px 50px rgba(0,0,0,.7),0 0 40px rgba(0,212,255,.2);
  border-radius:24px;padding:36px 32px;display:flex;flex-direction:column;align-items:center;gap:20px}
#jump-modal input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:24px;font-weight:700;text-align:center;outline:none}
#modal-jump-btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--c),var(--e));color:#000;font-size:20px;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){[data-step],.bar-fill{transition:none}}
</style>
</head>
<body>
<div id="blobs">
  <div style="position:absolute;width:900px;height:900px;top:-280px;left:-280px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.07) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:700px;height:700px;bottom:-180px;right:80px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.055) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:600px;height:600px;top:280px;right:-180px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.045) 0%,transparent 70%)"></div>
</div>
<div id="slide"></div>

<div id="jump-indicator">
  <iconify-icon icon="solar:round-alt-arrow-right-bold" style="color:var(--c);font-size:24px;display:inline-block"></iconify-icon>
  <span>Go to Page :</span><span id="jump-number" style="color:var(--c);font-weight:800">1</span>
</div>
<div id="jump-modal-overlay">
  <div id="jump-modal">
    <div style="font-size:24px;font-weight:700;color:var(--c)">페이지 바로 이동</div>
    <input type="number" id="modal-page-input" min="1" max="15">
    <button id="modal-jump-btn">이동</button>
  </div>
</div>
<div id="nav">
  <button class="nav-btn" id="btn-prev" title="이전 (←)">◀</button>
  <span id="counter" title="클릭하거나 G 키로 페이지 이동">1 / 15</span>
  <button class="nav-btn" id="btn-next" title="다음 (→, Space)">▶</button>
</div>
<div id="progress"></div>

<script>
/* 장면 공통 조각 — 문자열 안에는 백틱을 쓰지 않는다 */
const TOTAL = 15;
const lab = (no, sec) => '<div class="s-num">' + String(no).padStart(2, '0') + ' / ' + TOTAL + '</div><div class="s-section">' + sec + '</div>';
const head = (badge, cls, title) => '<div class="head"><div class="badge badge-' + cls + '">' + badge + '</div><div class="t-lg">' + title + '</div></div>';
const src = t => '<div class="src">' + t + '</div>';
const icon = (name, color, size) => '<iconify-icon icon="solar:' + name + '" style="font-size:' + (size || 52) + 'px;color:var(--' + color + ');margin-bottom:22px"></iconify-icon>';
const bar = (label, val, w, glow, step) =>
  '<div data-step="' + step + '"><div style="display:flex;justify-content:space-between;margin-bottom:12px">' +
  '<span class="t-sm">' + label + '</span><span class="t-sm ' + glow + '" style="font-weight:700">' + val + '</span></div>' +
  '<div class="bar-track"><div class="bar-fill" data-w="' + w + '"></div></div></div>';

const slides = [
  // 01 타이틀 — Cyan
  { s: 'Intro', n: 1, html: '<div class="sc">' +
    '<div class="badge badge-c" style="margin-bottom:44px">' + '2026 AI Briefing' + '</div>' +
    '<div class="t-hero" style="text-align:center">2026년, AI 지능은<br><span class="gc">어디까지</span> 발전했나?</div>' +
    '<div class="t-sm" style="color:var(--mu);margin-top:40px">코딩 · 시험 · 수학 · 가격, 네 가지 지표로 본 1년</div>' +
    '<div data-step="1" style="display:flex;gap:24px;margin-top:64px">' +
      '<div class="glass-c" style="padding:20px 32px;display:flex;align-items:center;gap:14px"><iconify-icon icon="solar:code-square-bold" style="font-size:34px;color:var(--c)"></iconify-icon><span class="t-xs" style="color:var(--t)">코딩 결승 1위</span></div>' +
      '<div class="glass-c" style="padding:20px 32px;display:flex;align-items:center;gap:14px"><iconify-icon icon="solar:document-text-bold" style="font-size:34px;color:var(--c)"></iconify-icon><span class="t-xs" style="color:var(--t)">마지막 시험 55%</span></div>' +
      '<div class="glass-e" style="padding:20px 32px;display:flex;align-items:center;gap:14px"><iconify-icon icon="solar:wallet-bold" style="font-size:34px;color:var(--e)"></iconify-icon><span class="t-xs" style="color:var(--t)">가격 97% 하락</span></div>' +
    '</div>' +
    src('자료 출처 · 조코딩 AI 리터러시 특강 1편(2026)에 인용된 공개 자료') + '</div>' },

  // 02 현황·배경 — 타임라인 (Amber → Cyan)
  { s: 'Intro', n: 3, html: '<div class="sc">' + lab(2, 'Background') +
    head('10년의 흐름', 'a', '게임판의 승리가 <span class="ga">10년 만에 일 전체로</span>') +
    '<div style="display:flex;align-items:stretch;justify-content:center;width:1520px">' +
      '<div class="glass-a" style="padding:36px 30px;text-align:center;width:300px;flex-shrink:0">' + icon('gamepad-bold', 'a', 48) +
        '<div class="t-md ga">2016</div><div class="t-sm" style="margin-top:8px">알파고 대 이세돌</div><div class="t-xs">서울 5번기, 최정상<br>기사가 기계에 지다</div></div>' +
      '<div data-step="1" style="padding:0 14px;text-align:center;display:flex;flex-direction:column;justify-content:center"><div class="ga" style="font-size:36px">→</div><div class="t-xs">1년</div></div>' +
      '<div data-step="1" class="glass-a" style="padding:36px 30px;text-align:center;width:300px;flex-shrink:0">' + icon('restart-bold', 'a', 48) +
        '<div class="t-md ga">2017</div><div class="t-sm" style="margin-top:8px">알파고 제로</div><div class="t-xs">기보 없이 독학해<br>이전 버전에 100 : 0</div></div>' +
      '<div data-step="2" style="padding:0 14px;text-align:center;display:flex;flex-direction:column;justify-content:center"><div class="gc" style="font-size:36px">→</div><div class="t-xs">9년</div></div>' +
      '<div data-step="2" class="glass-c" style="padding:36px 30px;text-align:center;width:300px;flex-shrink:0">' + icon('code-square-bold', 'c', 48) +
        '<div class="t-md gc">2026.7</div><div class="t-sm" style="margin-top:8px">코딩 결승 1위</div><div class="t-xs">AtCoder 결승<br>알고리즘 전 문제 해결</div></div>' +
      '<div data-step="3" style="padding:0 14px;text-align:center;display:flex;flex-direction:column;justify-content:center"><div class="gc" style="font-size:36px">→</div><div class="t-xs">2개월</div></div>' +
      '<div data-step="3" class="glass-c" style="padding:36px 30px;text-align:center;width:300px;flex-shrink:0">' + icon('medal-ribbons-star-bold', 'c', 48) +
        '<div class="t-md gc">2026.9</div><div class="t-sm" style="margin-top:8px">ARC-AGI-3</div><div class="t-xs">사람만 풀던 시험에서<br>99.9%로 돌파</div></div>' +
    '</div>' +
    src('구글 딥마인드 · Silver 외, Nature(2017) · AtCoder(2026-07) · ARC Prize Foundation(2026-09)') + '</div>' },

  // 03 핵심 질문 — 임팩트 타이포 (Cyan)
  { s: 'Intro', n: 1, html: '<div class="sc">' + lab(3, 'The Question') +
    '<div class="badge badge-c" style="margin-bottom:44px">The Question</div>' +
    '<div class="t-hero" style="text-align:center">AI는 이제 사람을<br><span class="gc">어디까지 넘었을까?</span></div>' +
    '<div data-step="1" class="t-sm" style="color:var(--mu);margin-top:48px;text-align:center">답은 점수보다 <span class="gc">속도</span>에 있습니다.<br>시험을 새로 만드는 속도보다 시험이 뚫리는 속도가 빠릅니다.</div>' +
    '</div>' },

  // 04 1부 섹션 헤더
  { s: 'Part 01', n: 0, html: '<div class="sc">' + lab(4, 'Part 01') +
    '<div class="badge badge-c" style="margin-bottom:44px">Part 01</div>' +
    '<div class="t-hero" style="text-align:center">사람을 넘어선 <span class="gc">장면들</span></div>' +
    '<div class="t-sm" style="color:var(--mu);margin-top:40px">세계 최상위 코딩 대회 결승에서 일어난 일</div></div>' },

  // 05 Large Metric — 8,300점 (Cyan)
  { s: 'Part 01', n: 3, html: '<div class="sc">' + lab(5, 'Part 01 · Coding') +
    head('AtCoder World Tour Finals 2026', 'c', '코딩 결승 1위는 <span class="gc">사람이 아니었다</span>') +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center;width:1520px">' +
      '<div class="glass" style="padding:52px 60px">' +
        '<div class="t-sm gc" style="margin-bottom:20px">2026년 7월 · 도쿄</div>' +
        '<div class="t-md" style="margin-bottom:32px">알고리즘 부문 A~E<br>전 문제를 AI가 풀었다</div>' +
        '<div style="display:flex;flex-direction:column;gap:16px">' +
          '<div data-step="1" class="t-sm" style="color:var(--mu)">• 2위 사람 참가자는 4,300점</div>' +
          '<div data-step="2" class="t-sm" style="color:var(--mu)">• 1년 전 같은 대회 휴리스틱 부문은<br>&nbsp;&nbsp;사람이 근소하게 1위</div>' +
        '</div></div>' +
      '<div data-step="3" class="glass-c" style="padding:64px 40px;text-align:center">' +
        '<div class="gc" style="font-size:150px;font-weight:800;letter-spacing:-.04em;line-height:1">8,300</div>' +
        '<div class="t-md" style="margin-top:28px;color:var(--mu)">1위 OpenAI의 점수</div></div>' +
    '</div>' +
    src('AtCoder 월드투어 파이널 2026 알고리즘 부문 최종 순위(atcoder.jp) · 데이터넷 2026-07-10') + '</div>' },

  // 06 2부 섹션 헤더
  { s: 'Part 02', n: 0, html: '<div class="sc">' + lab(6, 'Part 02') +
    '<div class="badge badge-c" style="margin-bottom:44px">Part 02</div>' +
    '<div class="t-hero" style="text-align:center">시험이 AI를<br><span class="gc">따라가지 못한다</span></div>' +
    '<div class="t-sm" style="color:var(--mu);margin-top:40px">인류의 마지막 시험 · ARC-AGI-3 · 미해결 수학</div></div>' },

  // 07 수평 바차트 — HLE 정답률 (Cyan)
  { s: 'Part 02', n: 2, html: '<div class="sc">' + lab(7, 'Part 02 · Benchmark') +
    head('Humanity’s Last Exam · 2,500문항', 'c', '「인류의 마지막 시험」, <span class="gc">2년 만에 절반을 넘다</span>') +
    '<div style="display:flex;flex-direction:column;gap:20px;width:1320px">' +
      bar('GPT-4o · 2024.11', '3.3%', '5.3%', '', 1) +
      bar('o1 · 2024.12', '9.1%', '14.6%', '', 1) +
      bar('o3 · 2025.4', '20.3%', '32.5%', '', 1) +
      bar('GPT-5 · 2025.8', '25.3%', '40.5%', '', 1) +
      bar('Gemini 3 Pro · 2025.11', '37.5%', '60%', '', 1) +
      bar('Gemini 3.1 Pro · 2026.3', '46.4%', '74.2%', 'gc', 2) +
      bar('Fable 5.1 · 2026.9', '55%', '88%', 'gc', 2) +
    '</div>' +
    src('정답률(%) · 전문가 1,000여 명 출제, 2026년 1월 Nature 게재 · CAIS AI Dashboard(agi.safe.ai) · 막대는 1.6배 확대') + '</div>' },

  // 08 2열 비교 — ARC-AGI-3 (Amber → Cyan)
  { s: 'Part 02', n: 2, html: '<div class="sc">' + lab(8, 'Part 02 · ARC-AGI-3') +
    head('ARC-AGI-3 · 상호작용형 추론 시험', 'c', '사람만 풀게 만든 시험도 <span class="gc">반년 만에 뚫렸다</span>') +
    '<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:44px;align-items:stretch;width:1520px">' +
      '<div data-step="1" class="glass-a" style="padding:48px 56px">' +
        '<div class="t-sm ga" style="margin-bottom:12px">2026년 3월 · 시험 공개</div>' +
        '<div class="t-xs" style="margin-bottom:32px">설명 없는 게임을 직접 해 보며<br>규칙을 알아내야 하는 시험</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px"><span class="t-sm">사람</span><span class="ge" style="font-size:64px;font-weight:800">100%</span></div>' +

/* 내비게이션 엔진 — step 0은 data-step 없는 요소만 보이는 상태 */
let cur = 0, step = 0;
const slideEl = document.getElementById('slide');

function applySteps() {
  slideEl.querySelectorAll('[data-step]').forEach(el => {
    const on = parseInt(el.dataset.step, 10) <= step;
    el.classList.toggle('revealed', on);
    el.querySelectorAll('.bar-fill[data-w]').forEach(b => { b.style.width = on ? b.dataset.w : '0%'; });
  });
}
function render() {
  slideEl.innerHTML = slides[cur].html;
  step = 0;
  document.getElementById('counter').textContent = (cur + 1) + ' / ' + slides.length;
  document.getElementById('progress').style.width = ((cur + 1) / slides.length * 100) + '%';
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) { }
  requestAnimationFrame(() => requestAnimationFrame(applySteps));
}
function go(d) {
  const max = slides[cur].n;
  if (d === 1) {
    if (step < max) { step++; applySteps(); }
    else if (cur < slides.length - 1) { cur++; render(); }
  } else {
    if (step > 0) { step--; applySteps(); }
    else if (cur > 0) { cur--; render(); step = slides[cur].n; requestAnimationFrame(() => requestAnimationFrame(applySteps)); }
  }
}
function goToPage(p) {
  p = parseInt(p, 10);
  if (p >= 1 && p <= slides.length) { cur = p - 1; render(); }
}

/* 퀵 점프: 숫자 입력 토스트 · G 키 모달 · 카운터 클릭 */
let buf = '', bufT = null;
const ind = document.getElementById('jump-indicator'), overlay = document.getElementById('jump-modal-overlay'), input = document.getElementById('modal-page-input');
function clearBuf() { buf = ''; ind.style.display = 'none'; clearTimeout(bufT); }
function digit(k) {
  buf += k; if (parseInt(buf, 10) > slides.length) buf = k;
  document.getElementById('jump-number').textContent = buf; ind.style.display = 'flex';
  clearTimeout(bufT); bufT = setTimeout(() => { goToPage(buf); clearBuf(); }, 1200);
}
function openModal() { clearBuf(); overlay.style.display = 'flex'; input.value = cur + 1; input.focus(); input.select(); }
function closeModal() { overlay.style.display = 'none'; }
function modalJump() { goToPage(input.value); closeModal(); }
document.getElementById('modal-jump-btn').addEventListener('click', modalJump);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); modalJump(); } else if (e.key === 'Escape') closeModal(); });
document.getElementById('counter').addEventListener('click', e => { e.stopPropagation(); openModal(); });

window.addEventListener('keydown', e => {
  if (overlay.style.display === 'flex') return;
  const k = e.key;
  if (/^[0-9]$/.test(k)) { e.preventDefault(); digit(k); return; }
  if (buf && k === 'Enter') { e.preventDefault(); goToPage(buf); clearBuf(); return; }
  if (buf && (k === 'Escape' || k === 'Backspace')) { e.preventDefault(); clearBuf(); return; }
  if (k === 'g' || k === 'G') { e.preventDefault(); openModal(); return; }
  if (k === 'f' || k === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); return; }
  if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { e.preventDefault(); go(1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(-1); }
  else if (k === 'ArrowDown') { e.preventDefault(); if (cur < slides.length - 1) { cur++; render(); } }
  else if (k === 'ArrowUp') { e.preventDefault(); if (cur > 0) { cur--; render(); } }
});
document.getElementById('btn-next').addEventListener('click', e => { e.stopPropagation(); go(1); });
document.getElementById('btn-prev').addEventListener('click', e => { e.stopPropagation(); go(-1); });
document.addEventListener('click', e => { if (overlay.style.display !== 'flex' && !e.target.closest('#nav,#jump-modal')) go(1); });

function scale() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.body.style.transform = 'translate(' + (innerWidth - 1920 * s) / 2 + 'px,' + (innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
}
addEventListener('resize', scale); scale();
cur = Math.max(0, Math.min(slides.length - 1, (parseInt(location.hash.slice(1), 10) || 1) - 1));
render();
</script>
