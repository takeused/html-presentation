<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEPSA Presentation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#09090b;--t:#f0f0f0;--mu:#a1a1aa;--c:#00d4ff;--a:#f59e0b;--e:#10b981;--p:#a78bfa}
body{width:1920px;height:1080px;background:var(--bg);color:var(--t);font-family:'Pretendard',sans-serif;overflow:hidden;transform-origin:0 0;word-break:keep-all}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:88px 88px;pointer-events:none;z-index:0}

.t-hero{font-size:112px;font-weight:800;letter-spacing:-.034em}
.t-xl{font-size:80px;font-weight:700;letter-spacing:-.026em}
.t-lg{font-size:60px;font-weight:700;letter-spacing:-.020em}
.t-md{font-size:42px;font-weight:600}
.t-sm{font-size:30px;font-weight:500}
.t-xs{font-size:24px;font-weight:400;color:var(--mu)}

.gc{color:#00d4ff;text-shadow:0 0 28px #00d4ff,0 0 56px rgba(0,212,255,.45)}
.ga{color:#f59e0b;text-shadow:0 0 28px #f59e0b,0 0 56px rgba(245,158,11,.45)}
.ge{color:#10b981;text-shadow:0 0 28px #10b981,0 0 56px rgba(16,185,129,.45)}
.gp{color:#a78bfa;text-shadow:0 0 28px #a78bfa,0 0 56px rgba(167,139,250,.45)}

.glass{background:rgba(255,255,255,.07);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.13);border-radius:24px;box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12)}
.glass-c{background:rgba(0,212,255,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(0,212,255,.32);border-radius:24px;box-shadow:0 0 48px rgba(0,212,255,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(0,212,255,.06),inset 0 1px 0 rgba(255,255,255,.1)}
.glass-a{background:rgba(245,158,11,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(245,158,11,.32);border-radius:24px;box-shadow:0 0 48px rgba(245,158,11,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(245,158,11,.06),inset 0 1px 0 rgba(255,255,255,.1)}
.glass-e{background:rgba(16,185,129,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(16,185,129,.32);border-radius:24px;box-shadow:0 0 48px rgba(16,185,129,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(16,185,129,.06),inset 0 1px 0 rgba(255,255,255,.1)}
.glass-p{background:rgba(167,139,250,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(167,139,250,.32);border-radius:24px;box-shadow:0 0 48px rgba(167,139,250,.14),0 8px 40px rgba(0,0,0,.5),inset 0 0 48px rgba(167,139,250,.06),inset 0 1px 0 rgba(255,255,255,.1)}

[data-step]{opacity:0;transform:translateY(22px);transition:opacity .5s cubic-bezier(.16,1,.3,1),transform .5s cubic-bezier(.16,1,.3,1)}
[data-step].revealed{opacity:1;transform:translateY(0)}
[data-step="2"].revealed{transition-delay:.08s}
[data-step="3"].revealed{transition-delay:.16s}
[data-step="4"].revealed{transition-delay:.24s}

.badge{display:inline-block;padding:8px 26px;border-radius:100px;background:rgba(0,212,255,.13);border:1px solid rgba(0,212,255,.35);color:var(--c);font-size:14px;font-weight:600;letter-spacing:.14em;margin-bottom:44px}
.cell{border-radius:18px;padding:22px 10px;text-align:center;font-weight:800;font-size:32px}

#blobs{position:fixed;inset:0;z-index:0;pointer-events:none}
#stage{position:relative;width:1920px;height:1080px;display:flex;align-items:center;justify-content:center;z-index:1}
#prog{position:fixed;top:0;left:0;height:4px;background:var(--c);box-shadow:0 0 12px var(--c);transition:width .4s ease;z-index:10}
#pg{position:fixed;bottom:32px;right:44px;font-size:18px;color:var(--mu);z-index:10}
</style>
</head>
<body>
<div id="blobs">
  <div style="position:absolute;width:900px;height:900px;top:-280px;left:-280px;border-radius:50%;background:radial-gradient(circle,rgba(0,212,255,.07) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:700px;height:700px;bottom:-180px;right:80px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.055) 0%,transparent 70%)"></div>
  <div style="position:absolute;width:600px;height:600px;top:280px;right:-180px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.045) 0%,transparent 70%)"></div>
</div>
<div id="prog"></div>
<div id="pg"></div>
<div id="stage"><div id="slide"></div></div>
<script>
const slides=[

/* 1. 타이틀 — 임팩트 타이포 */
{n:0,html:`<div style="width:1440px;text-align:center">
  <div class="badge">R&amp;D PORTFOLIO MANAGEMENT</div>
  <h2 class="t-hero">어떤 과제를 <span class="gc">먼저</span> 할 것인가</h2>
  <p class="t-md" style="color:var(--mu);margin-top:40px">R&amp;D 기획과제 우선순위 선정 방법론 — NEPSA</p>
  <p class="t-sm" style="color:var(--mu);margin-top:18px">한국산업기술평가관리원(KEIT) PD Issue Report, 2013.10 (Vol. 13-10)</p>
</div>`},

/* 2. 오늘의 구성 — 3열 피처 카드 */
{n:3,html:`<div style="width:1460px">
  <div class="t-lg" style="text-align:center;margin-bottom:64px">오늘 <span class="gc">세 단계</span>로 이해합니다</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:36px">
    <div data-step="1" class="glass-c" style="padding:52px 48px">
      <iconify-icon icon="solar:sticker-smile-square-bold" style="font-size:56px;color:var(--c);margin-bottom:28px;display:block"></iconify-icon>
      <div class="t-md gc" style="margin-bottom:20px">PART 1 · 쉽게</div>
      <div class="t-sm" style="margin-bottom:16px">10살 눈높이 비유로 원리 파악</div>
      <div class="t-xs">용돈, 성적표, 보물지도로 설명한다</div>
    </div>
    <div data-step="2" class="glass-a" style="padding:52px 48px">
      <iconify-icon icon="solar:ruler-cross-pen-bold" style="font-size:56px;color:var(--a);margin-bottom:28px;display:block"></iconify-icon>
      <div class="t-md ga" style="margin-bottom:20px">PART 2 · 정확히</div>
      <div class="t-sm" style="margin-bottom:16px">12개 검증지표와 등급 부여 규칙</div>
      <div class="t-xs">기대성과 6개 + 위험 6개, 가중치까지</div>
    </div>
    <div data-step="3" class="glass-e" style="padding:52px 48px">
      <iconify-icon icon="solar:target-bold" style="font-size:56px;color:var(--e);margin-bottom:28px;display:block"></iconify-icon>
      <div class="t-md ge" style="margin-bottom:20px">PART 3 · 적용</div>
      <div class="t-sm" style="margin-bottom:16px">실제 검증 사례와 국가R&amp;D 유의점</div>
      <div class="t-xs">숫자로 순위가 나오는 과정을 본다</div>
    </div>
  </div>
</div>`},

/* 3. 쉬운 설명 ① — 임팩트 타이포 */
{n:2,html:`<div style="width:1460px;text-align:center">
  <div class="badge">PART 1 · 10살도 아는 이야기</div>
  <h2 class="t-xl">하고 싶은 건 <span class="ga">10개</span>,<br>돈은 <span class="gc">5개</span>어치밖에 없다면?</h2>
  <p data-step="1" class="t-md" style="margin-top:48px">그럼 우리는 "무엇을 먼저 할지" 줄을 세워야 한다</p>
  <p data-step="2" class="t-sm" style="color:var(--mu);margin-top:24px">NEPSA는 나라가 연구과제에 돈을 줄 때, 그 줄을 <span class="ge">공평하게 세우는 방법</span>이다</p>
</div>`},

/* 4. 쉬운 설명 ② — 2열 비교 카드 */
{n:3,html:`<div style="width:1440px">
  <div class="t-lg" style="text-align:center;margin-bottom:56px">줄을 세울 땐 <span class="gc">딱 두 가지</span>만 물어본다</div>
  <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:40px;align-items:stretch">
    <div data-step="1" class="glass-c" style="padding:52px 56px">
      <div class="t-md gc" style="margin-bottom:28px">질문 1 — "얼마나 좋은 일이 생겨?"</div>
      <div class="t-sm" style="margin-bottom:18px">· 성공하면 뭐가 얼마나 좋아지나</div>
      <div class="t-sm" style="margin-bottom:18px">· 나 말고 다른 사람도 좋아지나</div>
      <div class="t-sm" style="margin-bottom:18px">· 오래오래 도움이 되나</div>
      <div class="t-xs" style="margin-top:28px">어른 말로는 <span class="gc">기대성과(Return)</span></div>
    </div>
    <div data-step="2" style="display:flex;align-items:center"><span class="ga" style="font-size:52px">+</span></div>
    <div data-step="3" class="glass-a" style="padding:52px 56px">
      <div class="t-md ga" style="margin-bottom:28px">질문 2 — "잘 안 될 수도 있어?"</div>
      <div class="t-sm" style="margin-bottom:18px">· 너무 어려워서 실패할 수 있나</div>
      <div class="t-sm" style="margin-bottom:18px">· 만들어도 아무도 안 쓰면 어쩌나</div>
      <div class="t-sm" style="margin-bottom:18px">· 돈과 시간이 얼마나 더 드나</div>
      <div class="t-xs" style="margin-top:28px">어른 말로는 <span class="ga">위험(Risk)</span></div>
    </div>
  </div>
</div>`},

/* 5. 쉬운 설명 ③ — 2x2 매트릭스(비유판) */
{n:4,html:`<div style="width:1420px">
  <div class="t-lg" style="text-align:center;margin-bottom:48px">두 가지 답을 <span class="ge">가로·세로</span>로 놓으면 방이 네 칸</div>
  <div style="display:grid;grid-template-columns:120px 1fr 1fr;grid-template-rows:auto auto auto;gap:24px;align-items:stretch">
    <div style="display:flex;align-items:center;justify-content:center"><div class="t-sm gc" style="writing-mode:vertical-rl;text-orientation:upright">좋은 일이 크다</div></div>
    <div data-step="1" class="glass-c" style="padding:40px 44px">
      <div class="t-md gc" style="margin-bottom:14px">가장 먼저 할 일</div>
      <div class="t-sm" style="margin-bottom:10px">좋은 일 크고 · 어렵지도 않다</div>
      <div class="t-xs">망설일 이유가 없는 최우선 과제 (S등급)</div>
    </div>
    <div data-step="2" class="glass-a" style="padding:40px 44px">
      <div class="t-md ga" style="margin-bottom:14px">용감하게 도전할 일</div>
      <div class="t-sm" style="margin-bottom:10px">좋은 일 크지만 · 많이 어렵다</div>
      <div class="t-xs">나라가 대신 모험해 주는 자리 — 도전적 R&amp;D</div>
    </div>
    <div style="display:flex;align-items:center;justify-content:center"><div class="t-sm ga" style="writing-mode:vertical-rl;text-orientation:upright">좋은 일이 작다</div></div>
    <div data-step="3" class="glass-e" style="padding:40px 44px">
      <div class="t-md ge" style="margin-bottom:14px">시간 나면 할 일</div>
      <div class="t-sm" style="margin-bottom:10px">쉽지만 · 좋은 일이 크지 않다</div>
      <div class="t-xs">해도 되지만 순서는 뒤로</div>
    </div>
    <div data-step="4" class="glass-p" style="padding:40px 44px">
      <div class="t-md gp" style="margin-bottom:14px">하지 않는 게 나은 일</div>
      <div class="t-sm" style="margin-bottom:10px">어렵기만 하고 · 좋은 일도 작다</div>
      <div class="t-xs">과감히 접거나 다른 과제와 합친다 (D등급)</div>
    </div>
    <div></div>
    <div class="t-sm gc" style="text-align:center">어렵지 않다</div>
    <div class="t-sm ga" style="text-align:center">많이 어렵다</div>
  </div>
</div>`},

/* 6. 쉬운 설명 ④ — 플로우(등급) */
{n:4,html:`<div style="width:1500px">
  <div class="t-lg" style="text-align:center;margin-bottom:72px">그래서 과제도 <span class="gc">성적표</span>처럼 등급을 받는다</div>
  <div style="display:flex;align-items:center;justify-content:center">
    <div class="glass-c" style="padding:34px 34px;text-align:center;flex-shrink:0;min-width:200px;border-radius:24px">
      <div class="t-md gc">S</div>
      <div class="t-xs" style="margin-top:10px">최우선</div>
    </div>
    <div data-step="1" style="display:flex;align-items:center;padding:0 14px"><div class="gc" style="font-size:36px">›</div></div>
    <div data-step="1" class="glass" style="padding:34px 34px;text-align:center;flex-shrink:0;min-width:200px;border-radius:24px">
      <div class="t-md">A</div>
      <div class="t-xs" style="margin-top:10px">우수</div>
    </div>
    <div data-step="2" style="display:flex;align-items:center;padding:0 14px"><div class="gc" style="font-size:36px">›</div></div>
    <div data-step="2" class="glass" style="padding:34px 34px;text-align:center;flex-shrink:0;min-width:200px;border-radius:24px">
      <div class="t-md">B</div>
      <div class="t-xs" style="margin-top:10px">보통</div>
    </div>
    <div data-step="3" style="display:flex;align-items:center;padding:0 14px"><div class="gc" style="font-size:36px">›</div></div>
    <div data-step="3" class="glass" style="padding:34px 34px;text-align:center;flex-shrink:0;min-width:200px;border-radius:24px">
      <div class="t-md">C</div>
      <div class="t-xs" style="margin-top:10px">미흡</div>
    </div>
    <div data-step="4" style="display:flex;align-items:center;padding:0 14px"><div class="gc" style="font-size:36px">›</div></div>
    <div data-step="4" class="glass-a" style="padding:34px 34px;text-align:center;flex-shrink:0;min-width:200px;border-radius:24px">
      <div class="t-md ga">D</div>
      <div class="t-xs" style="margin-top:10px">후순위</div>
    </div>
  </div>
  <div data-step="4" class="t-sm" style="text-align:center;margin-top:64px;color:var(--mu)">같은 등급이면 <span class="ge">기대성과가 높은 과제</span>가 앞선다 — 이 한 문장이 NEPSA 순위의 마지막 규칙</div>
</div>`},

/* 7. 정의 — 임팩트 타이포 */
{n:2,html:`<div style="width:1500px;text-align:center">
  <div class="badge">PART 2 · DEFINITION</div>
  <h2 class="t-xl">NEPSA는 기획과제를<br><span class="gc">2배수에서 1배수로</span> 걸러내는 검증툴</h2>
  <p data-step="1" class="t-md" style="margin-top:48px">기대성과(Return) × 위험(Risk) 2×2 Matrix · 12개 검증지표 · 5등급(S&gt;A&gt;B&gt;C&gt;D)</p>
  <p data-step="2" class="t-sm" style="color:var(--mu);margin-top:24px">금융의 기대수익·위험 개념을 국가 R&amp;D 과제 선정에 확장 적용한 모델<br>산업융합원천기술개발사업의 기획대상과제 우선순위 선정에 적용 · 원문 표기 Nest yEar Projects Selection Analysis</p>
</div>`},

/* 8. 기대성과 3단계 — 3열 피처 카드 */
{n:3,html:`<div style="width:1460px">
  <div class="t-lg" style="text-align:center;margin-bottom:56px">기대성과는 <span class="gc">세 겹</span>으로 본다</div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:36px">
    <div data-step="1" class="glass-c" style="padding:48px 44px">
      <iconify-icon icon="solar:document-text-bold" style="font-size:52px;color:var(--c);margin-bottom:24px;display:block"></iconify-icon>
      <div class="t-md gc" style="margin-bottom:16px">Output · 1차 성과</div>
      <div class="t-sm" style="margin-bottom:12px">R&amp;D 직후 손에 잡히는 결과물</div>
      <div class="t-xs">기술의 차별성·독창성, 경쟁우위 확보 및 유지기간,<br>타 분야 응용가능성, 우수 IP 확보 가능성</div>
    </div>
    <div data-step="2" class="glass-a" style="padding:48px 44px">
      <iconify-icon icon="solar:banknote-2-bold" style="font-size:52px;color:var(--a);margin-bottom:24px;display:block"></iconify-icon>
      <div class="t-md ga" style="margin-bottom:16px">Outcome · 2차 성과</div>
      <div class="t-sm" style="margin-bottom:12px">기술이전·사업화로 벌어들이는 수익</div>
      <div class="t-xs">NPV·IRR·ROI·BCR, 시장(창출)규모 및 성장률,<br>제품 영업이익률, 매출액 및 수익구조</div>
    </div>
    <div data-step="3" class="glass-e" style="padding:48px 44px">
      <iconify-icon icon="solar:share-circle-bold" style="font-size:52px;color:var(--e);margin-bottom:24px;display:block"></iconify-icon>
      <div class="t-md ge" style="margin-bottom:16px">Impact · 파급효과</div>
      <div class="t-sm" style="margin-bottom:12px">의도하지 않은 형태로 번지는 영향</div>
      <div class="t-xs">타 산업·기술로의 파급, 공정혁신 등 비용절감 효과,<br>사회에 대한 긍정적 외부효과</div>
    </div>
  </div>
</div>`},

/* 9. 기대성과 6개 지표 가중치 — 수평 바차트 */
{n:3,html:`<div style="width:1400px">
  <div class="t-lg" style="text-align:center;margin-bottom:16px">기대성과 검증지표 <span class="gc">6개</span>와 가중치</div>
  <div class="t-xs" style="text-align:center;margin-bottom:44px">막대 길이는 가중치를 4배 확대해 표시 · 숫자는 실제 가중치</div>

  <div data-step="1" style="margin-bottom:28px">
    <div class="t-xs" style="margin-bottom:6px">Output · 정성 — 기술이 가지는 독창성 및 차별성</div>
    <div style="display:flex;justify-content:space-between;margin-bottom:14px"><span class="t-sm">기술적 수월성</span><span class="t-sm gc">15%</span></div>
    <div style="height:28px;background:rgba(255,255,255,.06);border-radius:14px;overflow:hidden">
      <div class="bar-fill" data-w="60%" style="height:100%;width:0%;background:linear-gradient(90deg,var(--c),rgba(0,212,255,.5));border-radius:14px;transition:width 1.2s cubic-bezier(.16,1,.3,1) .1s;box-shadow:0 0 16px rgba(0,212,255,.35)"></div>
    </div>
  </div>
  <div data-step="1" style="margin-bottom:28px">

];

function scale(){const s=Math.min(window.innerWidth/1920,window.innerHeight/1080);const tx=(window.innerWidth-1920*s)/2,ty=(window.innerHeight-1080*s)/2;document.body.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}
window.addEventListener('resize',scale);scale();

let cur=0,step=0;
function applySteps(){document.querySelectorAll('[data-step]').forEach(el=>{const n=parseInt(el.dataset.step),on=n<=step;el.classList.toggle('revealed',on);
el.querySelectorAll('.bar-fill[data-w]').forEach(b=>{b.style.width=on?b.dataset.w:'0%'});
el.querySelectorAll('.ring-fill[data-v]').forEach(r=>{const C=2*Math.PI*r.r.baseVal.value;r.style.strokeDasharray=C;r.style.strokeDashoffset=on?C*(1-parseFloat(r.dataset.v)/100):C});
el.querySelectorAll('.line-draw').forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=on?0:L});
el.querySelectorAll('.dot-pop').forEach(d=>{d.style.opacity=on?1:0})})}
function updateNav(){const pb=document.getElementById('prog');if(pb)pb.style.width=((cur+1)/slides.length*100)+'%';const pg=document.getElementById('pg');if(pg)pg.textContent=(cur+1)+' / '+slides.length}
function render(){step=0;const sl=slides[cur];document.getElementById('slide').innerHTML=sl.html;if(sl.after)setTimeout(sl.after,50);applySteps();updateNav()}
function go(d){const max=slides[cur].n;if(d===1){if(step<max){step++;applySteps();updateNav()}else if(cur<slides.length-1){cur++;render()}}else{if(step>0){step--;applySteps();updateNav()}else if(cur>0){cur--;render();step=slides[cur].n;applySteps();updateNav()}}}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}else if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}else if(e.key==='ArrowDown'){e.preventDefault();if(cur<slides.length-1){cur++;render()}}else if(e.key==='ArrowUp'){e.preventDefault();if(cur>0){cur--;render()}}});
render();
</script>
</body>
</html>
